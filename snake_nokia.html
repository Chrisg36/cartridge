<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Snake - Nokia 3310 Immersif</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gb-bg: #9bbc0f;
    --gb-dark: #0f380f;
    --gb-medium: #306230;
    --gb-light: #8bac0f;
    --bg-app: #070a0f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-app);
    color: #f2f3f5;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 10px) env(safe-area-inset-bottom, 10px) env(safe-area-inset-left, 10px);
  }

  /* En-tête minimaliste du jeu */
  .game-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: rgba(21, 27, 38, 0.85);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #9bbc0f;
  }

  /* Zone de l'écran principal qui prend le maximum de place */
  .screen-container {
    flex: 1;
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    position: relative;
  }

  .screen-lens {
    background-color: #070d07;
    padding: 14px;
    border-radius: 16px;
    box-shadow: inset 0 6px 20px rgba(0,0,0,0.95), 0 0 30px rgba(153, 230, 0, 0.15);
    border: 3px solid #182418;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1.1;
    position: relative;
  }

  .hud-top {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--gb-dark);
    margin-bottom: 8px;
    font-weight: bold;
    padding: 0 4px;
  }

  canvas {
    width: 100% !important;
    height: 100% !important;
    flex: 1;
    display: block;
    background-color: var(--gb-bg);
    border: 3px solid var(--gb-dark);
    image-rendering: pixelated;
  }

  /* Commandes tactiles en bas d'écran (optimisées iOS & Android) */
  .controls-container {
    width: 100%;
    max-width: 400px;
    padding: 15px 10px 25px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 75px);
    grid-template-rows: repeat(3, 60px);
    gap: 8px;
  }

  .arcade-btn {
    background: linear-gradient(145deg, #232c3d, #151b26);
    border: 1.5px solid color-mix(in srgb, var(--gb-light) 50%, transparent);
    border-radius: 14px;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.08s ease;
  }

  .arcade-btn:active {
    background: var(--gb-light);
    color: #0f380f;
    transform: translateY(3px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  .btn-up { grid-column: 2; grid-row: 1; }
  .btn-left { grid-column: 1; grid-row: 2; }
  .btn-right { grid-column: 3; grid-row: 2; }
  .btn-down { grid-column: 2; grid-row: 3; }

  /* Écrans de superposition (Menu & Game Over) */
  .screen-overlay {
    position: absolute;
    inset: 14px;
    background-color: var(--gb-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 20px;
    border-radius: 10px;
  }

  .screen-overlay.hidden {
    display: none;
  }

  .screen-overlay h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    color: var(--gb-dark);
    margin-bottom: 14px;
    text-shadow: 2px 2px var(--gb-light);
  }

  .screen-overlay p {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--gb-medium);
    margin-bottom: 20px;
    line-height: 1.8;
  }

  .menu-btn {
    background-color: var(--gb-dark);
    color: var(--gb-bg);
    border: none;
    padding: 14px 26px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    cursor: pointer;
    border-radius: 6px;
    box-shadow: 0 4px var(--gb-medium);
  }

  .menu-btn:active {
    transform: translateY(2px);
  }

  @media (pointer: fine) {
    .controls-container {
      display: none; /* Masqué sur PC pour profiter de tout l'écran avec le clavier */
    }
  }
</style>
</head>
<body>

<div class="game-header">
  <span>🐍 SNAKE // NOKIA 3310</span>
  <span id="headerHi">HI:00</span>
</div>

<div class="screen-container">
  <div class="screen-lens">
    <div class="hud-top">
      <span id="scoreText">SCORE:00</span>
    </div>

    <div style="position: relative; width: 100%; flex: 1; display: flex; flex-direction: column;">
      <canvas id="snakeCanvas" width="200" height="200"></canvas>

      <!-- Menu Principal -->
      <div id="menuScreen" class="screen-overlay">
        <h1>SNAKE</h1>
        <p>NOKIA EDITION<br><br>Utilise les flèches du clavier ou le pavé tactile géant en bas !</p>
        <button class="menu-btn" id="startBtn">JOUER</button>
      </div>

      <!-- Game Over -->
      <div id="gameOverScreen" class="screen-overlay hidden">
        <h1>GAME OVER</h1>
        <p id="finalScoreText">SCORE : 0</p>
        <button class="menu-btn" id="restartBtn">REJOUER</button>
      </div>
    </div>
  </div>
</div>

<!-- Contrôles tactiles plein écran pour mobile -->
<div class="controls-container">
  <div class="dpad">
    <button class="arcade-btn btn-up" id="btnUp">▲</button>
    <button class="arcade-btn btn-left" id="btnLeft">◀</button>
    <button class="arcade-btn btn-right" id="btnRight">▶</button>
    <button class="arcade-btn btn-down" id="btnDown">▼</button>
  </div>
</div>

<script>
// --- AUDIO BUZZER 8-BITS ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playNokiaSound(type) {
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';

    if (type === 'eat') {
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'gameover') {
      osc.frequency.setValueAtTime(250, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.5);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
    }
  } catch (e) {}
}

// --- LOGIQUE SNAKE ---
const canvas = document.getElementById("snakeCanvas");
const ctx = canvas.getContext("2d");

const GRID_SIZE = 20;
const TILE_SIZE = 10; // 20x10 = 200px

let snake = [];
let food = { x: 0, y: 0 };
let dx = 1;
let dy = 0;
let nextDx = 1;
let nextDy = 0;
let score = 0;
let highScore = parseInt(localStorage.getItem("nokia_snake_hi") || "0", 10);
let gameStarted = false;
let gameOver = false;
let gameInterval = null;
let speed = 100;

document.getElementById("highScoreText")?.remove(); // Remplacé par l'en-tête
document.getElementById("headerHi").textContent = `HI:${String(highScore).padStart(2, '0')}`;

function resetGame() {
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];
  dx = 1; dy = 0;
  nextDx = 1; nextDy = 0;
  score = 0;
  speed = 100;
  updateHUD();
  spawnFood();
}

function spawnFood() {
  let valid = false;
  while (!valid) {
    food.x = Math.floor(Math.random() * GRID_SIZE);
    food.y = Math.floor(Math.random() * GRID_SIZE);
    valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
  }
}

function updateHUD() {
  document.getElementById("scoreText").textContent = `SCORE:${String(score).padStart(2, '0')}`;
  document.getElementById("headerHi").textContent = `HI:${String(highScore).padStart(2, '0')}`;
}

function drawBlock(x, y, isHead = false) {
  ctx.fillStyle = "#306230";
  ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
  ctx.fillStyle = isHead ? "#0f380f" : "#8bac0f";
  ctx.fillRect(x * TILE_SIZE + 1, y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
}

function drawFood() {
  ctx.fillStyle = "#0f380f";
  ctx.fillRect(food.x * TILE_SIZE + 2, food.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
}

function gameStep() {
  dx = nextDx;
  dy = nextDy;

  const head = { x: snake[0].x + dx, y: snake[0].y + dy };

  if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE || snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    playNokiaSound('eat');
    if (score > highScore) {
      highScore = score;
      localStorage.setItem("nokia_snake_hi", highScore);
    }
    updateHUD();
    spawnFood();
    if (score % 50 === 0 && speed > 50) {
      speed -= 8;
      clearInterval(gameInterval);
      gameInterval = setInterval(gameStep, speed);
    }
  } else {
    snake.pop();
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawFood();
  snake.forEach((segment, index) => {
    drawBlock(segment.x, segment.y, index === 0);
  });
}

function startGame() {
  gameStarted = true;
  gameOver = false;
  document.getElementById("menuScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");
  resetGame();
  if (gameInterval) clearInterval(gameInterval);
  gameInterval = setInterval(gameStep, speed);
}

function endGame() {
  gameOver = true;
  gameStarted = false;
  clearInterval(gameInterval);
  playNokiaSound('gameover');
  document.getElementById("finalScoreText").textContent = `SCORE : ${score}`;
  document.getElementById("gameOverScreen").classList.remove("hidden");
}

// Contrôles Clavier
window.addEventListener("keydown", e => {
  if (!gameStarted || gameOver) return;
  if ((e.code === "ArrowUp" || e.code === "KeyW") && dy === 0) { nextDx = 0; nextDy = -1; e.preventDefault(); }
  else if ((e.code === "ArrowDown" || e.code === "KeyS") && dy === 0) { nextDx = 0; nextDy = 1; e.preventDefault(); }
  else if ((e.code === "ArrowLeft" || e.code === "KeyA") && dx === 0) { nextDx = -1; nextDy = 0; e.preventDefault(); }
  else if ((e.code === "ArrowRight" || e.code === "KeyD") && dx === 0) { nextDx = 1; nextDy = 0; e.preventDefault(); }
});

// Contrôles Tactiles Plein Écran
document.getElementById("btnUp").onclick = () => { if (gameStarted && !gameOver && dy === 0) { nextDx = 0; nextDy = -1; } };
document.getElementById("btnDown").onclick = () => { if (gameStarted && !gameOver && dy === 0) { nextDx = 0; nextDy = 1; } };
document.getElementById("btnLeft").onclick = () => { if (gameStarted && !gameOver && dx === 0) { nextDx = -1; nextDy = 0; } };
document.getElementById("btnRight").onclick = () => { if (gameStarted && !gameOver && dx === 0) { nextDx = 1; nextDy = 0; } };

document.getElementById("startBtn").onclick = startGame;
document.getElementById("restartBtn").onclick = startGame;
</script>
</body>
</html>
