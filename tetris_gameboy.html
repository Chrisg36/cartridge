<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tetris - Game Boy Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --gb-bg: #9bbc0f;
    --gb-dark: #0f380f;
    --gb-medium: #306230;
    --gb-light: #8bac0f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  body {
    margin: 0;
    padding: 0;
    background-color: #070f07;
    color: var(--gb-dark);
    font-family: 'Press Start 2P', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* Cadre Game Boy / Écran LCD */
  .console-body {
    background-color: #152915;
    border: 4px solid var(--gb-light);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    max-width: 360px;
    width: 100%;
  }

  .screen-lens {
    background-color: #0a180a;
    padding: 12px;
    border-radius: 8px 8px 24px 8px;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
    border: 2px solid #204020;
    margin-bottom: 14px;
    display: flex;
    gap: 12px;
  }

  .game-area {
    background-color: var(--gb-bg);
    border: 3px solid var(--gb-dark);
    position: relative;
    image-rendering: pixelated;
  }

  canvas {
    display: block;
    background-color: var(--gb-bg);
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 90px;
    background-color: var(--gb-bg);
    border: 3px solid var(--gb-dark);
    padding: 8px;
    text-align: center;
  }

  .panel-box {
    margin-bottom: 8px;
  }

  .panel-title {
    font-size: 7px;
    color: var(--gb-dark);
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .panel-value {
    font-size: 9px;
    color: var(--gb-dark);
    font-weight: bold;
  }

  #nextCanvas {
    width: 60px;
    height: 60px;
    margin: 0 auto;
    background-color: var(--gb-bg);
  }

  /* Contrôles tactiles de type Game Boy */
  .controls-grid {
    display: grid;
    grid-template-columns: repeat(3, 55px);
    grid-template-rows: repeat(3, 50px);
    gap: 4px;
    margin-top: 10px;
  }

  .gb-btn {
    background-color: #2c2c2c;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    cursor: pointer;
    box-shadow: 0 4px #111;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gb-btn:active {
    box-shadow: 0 1px #111;
    transform: translateY(3px);
  }

  .btn-up { grid-column: 2; grid-row: 1; }
  .btn-left { grid-column: 1; grid-row: 2; }
  .btn-right { grid-column: 3; grid-row: 2; }
  .btn-down { grid-column: 2; grid-row: 3; }

  .action-buttons {
    display: flex;
    justify-content: space-around;
    width: 100%;
    margin-top: 12px;
    padding: 0 10px;
  }

  .action-btn {
    background-color: #800020;
    border: none;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    box-shadow: 0 4px #300;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-btn:active {
    box-shadow: 0 1px #300;
    transform: translateY(3px);
  }

  /* Écrans de menu et game over */
  .screen-overlay {
    position: absolute;
    inset: 0;
    background-color: var(--gb-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 10px;
  }

  .screen-overlay.hidden {
    display: none;
  }

  .screen-overlay h1 {
    font-size: 16px;
    color: var(--gb-dark);
    margin-bottom: 14px;
    text-shadow: 1px 1px var(--gb-light);
  }

  .screen-overlay p {
    font-size: 8px;
    color: var(--gb-medium);
    margin-bottom: 12px;
    line-height: 1.6;
  }

  .menu-btn {
    background-color: var(--gb-dark);
    color: var(--gb-bg);
    border: none;
    padding: 10px 16px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    cursor: pointer;
    margin-top: 8px;
    border-radius: 4px;
  }

  .menu-btn:hover {
    background-color: var(--gb-medium);
  }

  @media (pointer: fine) {
    .controls-grid, .action-buttons {
      display: none; /* Masqué sur PC car on joue au clavier */
    }
  }
</style>
</head>
<body>

<div class="console-body">
  <div class="screen-lens">
    <!-- Grille de jeu Tetris (10x20 blocs) -->
    <div style="position: relative;">
      <canvas id="tetrisCanvas" width="160" height="320"></canvas>
      
      <!-- Écran Menu Principal -->
      <div id="menuScreen" class="screen-overlay">
        <h1>TETRIS</h1>
        <p>EDITION GAME BOY<br><br>CLAVIER :<br>← → Déplacer<br>↑ Pivoter<br>↓ Tomber<br>ESPACE : Drop</p>
        <button class="menu-btn" id="startBtn">JOUER</button>
      </div>

      <!-- Écran Game Over -->
      <div id="gameOverScreen" class="screen-overlay hidden">
        <h1>GAME OVER</h1>
        <p id="finalScoreText">SCORE : 0</p>
        <button class="menu-btn" id="restartBtn">REJOUER</button>
      </div>
    </div>

    <!-- Panneau latéral (Score, Lignes, Pièce suivante) -->
    <div class="side-panel">
      <div class="panel-box">
        <div class="panel-title">SCORE</div>
        <div class="panel-value" id="scoreVal">000000</div>
      </div>
      <div class="panel-box">
        <div class="panel-title">LIGNES</div>
        <div class="panel-value" id="linesVal">000</div>
      </div>
      <div class="panel-box">
        <div class="panel-title">NIVEAU</div>
        <div class="panel-value" id="levelVal">1</div>
      </div>
      <div class="panel-box">
        <div class="panel-title">SUIVANT</div>
        <canvas id="nextCanvas" width="48" height="48"></canvas>
      </div>
    </div>
  </div>

  <!-- Contrôles tactiles Game Boy -->
  <div class="action-buttons">
    <button class="action-btn" id="btnRotate">ROT</button>
    <button class="action-btn" id="btnDrop" style="background-color: #004080; box-shadow: 0 4px #002040;">DROP</button>
  </div>
  <div class="controls-grid">
    <button class="gb-btn btn-up" id="btnUp">▲</button>
    <button class="gb-btn btn-left" id="btnLeft">◀</button>
    <button class="gb-btn btn-right" id="btnRight">▶</button>
    <button class="gb-btn btn-down" id="btnDown">▼</button>
  </div>
</div>

<script>
// --- WEB AUDIO API (Effets sonores Game Boy) ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playGbSound(type) {
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';

    if (type === 'move') {
      osc.frequency.setValueAtTime(300, now);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'rotate') {
      osc.frequency.setValueAtTime(500, now);
      osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'drop') {
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(60, now + 0.12);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'clear') {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'square';
        o.frequency.setValueAtTime(f, now + idx * 0.06);
        g.gain.setValueAtTime(0.08, now + idx * 0.06);
        g.gain.linearRampToValueAtTime(0.001, now + idx * 0.06 + 0.08);
        o.start(now + idx * 0.06); o.stop(now + idx * 0.06 + 0.08);
      });
    } else if (type === 'gameover') {
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.8);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.8);
      osc.start(now); osc.stop(now + 0.8);
    }
  } catch (e) {}
}

// --- LOGIQUE TETRIS ---
const canvas = document.getElementById("tetrisCanvas");
const ctx = canvas.getContext("2d");
const nextCanvas = document.getElementById("nextCanvas");
const nextCtx = nextCanvas.getContext("2d");

const BLOCK_SIZE = 16;
const COLS = 10;
const ROWS = 20;

let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
let score = 0;
let lines = 0;
let level = 1;
let gameOver = false;
let gameStarted = false;

const SHAPES = [
  [],
  [[1,1,1,1]], // I
  [[1,1],[1,1]], // O
  [[0,1,0],[1,1,1]], // T
  [[0,1,1],[1,1,0]], // S
  [[1,1,0],[0,1,1]], // Z
  [[1,0,0],[1,1,1]], // J
  [[0,0,1],[1,1,1]]  // L
];

let currentPiece = null;
let nextPiece = null;

function createPiece(type) {
  return {
    shape: SHAPES[type],
    color: type,
    x: Math.floor(COLS / 2) - Math.floor(SHAPES[type][0].length / 2),
    y: 0
  };
}

function getRandomPieceType() {
  return Math.floor(Math.random() * 7) + 1;
}

function drawBlock(context, x, y, size, colorIndex) {
  if (colorIndex === 0) {
    context.fillStyle = "#9bbc0f"; // Fond Game Boy
    context.fillRect(x * size, y * size, size, size);
    return;
  }
  context.fillStyle = "#306230"; // Contour
  context.fillRect(x * size, y * size, size, size);
  context.fillStyle = "#8bac0f"; // Intérieur pixel
  context.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
  context.fillStyle = "#0f380f"; // Cœur sombre
  context.fillRect(x * size + 3, y * size + 3, size - 6, size - 6);
}

function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      drawBlock(ctx, c, r, BLOCK_SIZE, board[r][c]);
    }
  }

  if (currentPiece) {
    currentPiece.shape.forEach((row, r) => {
      row.forEach((val, c) => {
        if (val) {
          drawBlock(ctx, currentPiece.x + c, currentPiece.y + r, BLOCK_SIZE, currentPiece.color);
        }
      });
    });
  }
}

function drawNext() {
  nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;
  const size = 12;
  const offsetX = Math.floor((4 - nextPiece.shape[0].length) / 2);
  const offsetY = Math.floor((4 - nextPiece.shape.length) / 2);

  nextPiece.shape.forEach((row, r) => {
    row.forEach((val, c) => {
      if (val) {
        drawBlock(nextCtx, offsetX + c, offsetY + r, size, nextPiece.color);
      }
    });
  });
}

function collide(piece, dx = 0, dy = 0, shape = piece.shape) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) {
        let newX = piece.x + c + dx;
        let newY = piece.y + r + dy;
        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
        if (newY >= 0 && board[newY][newX]) return true;
      }
    }
  }
  return false;
}

function mergePiece() {
  currentPiece.shape.forEach((row, r) => {
    row.forEach((val, c) => {
      if (val) {
        let boardY = currentPiece.y + r;
        if (boardY >= 0) board[boardY][currentPiece.x + c] = currentPiece.color;
      }
    });
  });
}

function clearLines() {
  let cleared = 0;
  outer: for (let r = ROWS - 1; r >= 0; r--) {
    for (let c = 0; c < COLS; c++) {
      if (!board[r][c]) continue outer;
    }
    board.splice(r, 1);
    board.unshift(Array(COLS).fill(0));
    cleared++;
    r++; // Vérifier à nouveau la même ligne
  }

  if (cleared > 0) {
    lines += cleared;
    score += [0, 40, 100, 300, 1200][cleared] * level;
    level = Math.floor(lines / 10) + 1;
    playGbSound('clear');
    updateHUD();
  }
}

function updateHUD() {
  document.getElementById("scoreVal").textContent = String(score).padStart(6, '0');
  document.getElementById("linesVal").textContent = String(lines).padStart(3, '0');
  document.getElementById("levelVal").textContent = level;
}

function rotatePiece() {
  let rotated = currentPiece.shape[0].map((_, index) => currentPiece.shape.map(row => row[index]).reverse());
  if (!collide(currentPiece, 0, 0, rotated)) {
    currentPiece.shape = rotated;
    playGbSound('rotate');
  } else {
    // Wall kick simple
    if (!collide(currentPiece, -1, 0, rotated)) { currentPiece.x--; currentPiece.shape = rotated; playGbSound('rotate'); }
    else if (!collide(currentPiece, 1, 0, rotated)) { currentPiece.x++; currentPiece.shape = rotated; playGbSound('rotate'); }
  }
  drawBoard();
}

function movePiece(dx) {
  if (!collide(currentPiece, dx, 0)) {
    currentPiece.x += dx;
    playGbSound('move');
    drawBoard();
  }
}

function dropPiece() {
  if (!collide(currentPiece, 0, 1)) {
    currentPiece.y++;
    drawBoard();
  } else {
    mergePiece();
    clearLines();
    currentPiece = nextPiece;
    nextPiece = createPiece(getRandomPieceType());
    drawNext();
    if (collide(currentPiece, 0, 0)) {
      gameOver = true;
      playGbSound('gameover');
      document.getElementById("finalScoreText").textContent = `SCORE : ${score}`;
      document.getElementById("gameOverScreen").classList.remove("hidden");
    }
  }
  dropCounter = 0;
}

let dropCounter = 0;
let dropInterval = 800;
let lastTime = 0;

function gameLoop(time = 0) {
  if (!gameStarted || gameOver) return;
  const deltaTime = time - lastTime;
  lastTime = time;
  dropCounter += deltaTime;

  let speed = Math.max(100, dropInterval - (level - 1) * 70);
  if (dropCounter > speed) {
    dropPiece();
  }

  requestAnimationFrame(gameLoop);
}

function startGame() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  score = 0;
  lines = 0;
  level = 1;
  gameOver = false;
  gameStarted = true;
  updateHUD();

  currentPiece = createPiece(getRandomPieceType());
  nextPiece = createPiece(getRandomPieceType());
  drawNext();

  document.getElementById("menuScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");

  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

// Contrôles clavier
window.addEventListener("keydown", e => {
  if (!gameStarted || gameOver) return;
  if (e.code === "ArrowLeft") movePiece(-1);
  else if (e.code === "ArrowRight") movePiece(1);
  else if (e.code === "ArrowDown") dropPiece();
  else if (e.code === "ArrowUp") rotatePiece();
  else if (e.code === "Space") {
    while (!collide(currentPiece, 0, 1)) { currentPiece.y++; }
    playGbSound('drop');
    dropPiece();
    e.preventDefault();
  }
});

// Contrôles tactiles Game Boy
document.getElementById("btnLeft").onclick = () => { if (gameStarted && !gameOver) movePiece(-1); };
document.getElementById("btnRight").onclick = () => { if (gameStarted && !gameOver) movePiece(1); };
document.getElementById("btnDown").onclick = () => { if (gameStarted && !gameOver) dropPiece(); };
document.getElementById("btnUp").onclick = () => { if (gameStarted && !gameOver) rotatePiece(); };
document.getElementById("btnRotate").onclick = () => { if (gameStarted && !gameOver) rotatePiece(); };
document.getElementById("btnDrop").onclick = () => {
  if (gameStarted && !gameOver) {
    while (!collide(currentPiece, 0, 1)) { currentPiece.y++; }
    playGbSound('drop');
    dropPiece();
  }
};

document.getElementById("startBtn").onclick = startGame;
document.getElementById("restartBtn").onclick = startGame;
</script>
</body>
</html>
