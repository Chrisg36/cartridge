<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>TYRIEL & SOREN — La Légende des Frères</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #06070f; overflow: hidden; touch-action: none; font-family: 'Press Start 2P', monospace; color: #fff; }
  #app { position: relative; width: 100vw; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    background: radial-gradient(120% 70% at 50% 0%, #1b2347, #06070f 70%); }
  #screen { position: relative; width: 100vw; max-width: calc(100dvh * 4 / 3); aspect-ratio: 4 / 3; margin-top: env(safe-area-inset-top); background: #000;
    box-shadow: 0 0 0 3px #2b3566, 0 8px 30px rgba(0, 0, 0, .6); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }

  /* Manette tactile façon console portable (en portrait, sous l'écran) */
  #pad { flex: 1; width: 100%; max-width: 520px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 14px calc(16px + env(safe-area-inset-bottom)); gap: 6px; }
  #brand { margin: 18px 0 0; display: flex; align-items: center; gap: 10px; font-size: 9px; letter-spacing: 2px; color: #8c96c9; }
  #brand b { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 20px; }
  @media (orientation: landscape), (hover: hover) and (pointer: fine) { #brand { display: none; } }
  .dpad { position: relative; width: 138px; height: 138px; justify-self: start; }
  .dpad .k { position: absolute; width: 48px; height: 48px; background: linear-gradient(180deg, #343c64, #1c2244); border: 2px solid #4c578f; display: grid; place-items: center; box-shadow: 0 4px 0 #0b0f22; }
  .dpad .k svg { width: 22px; height: 22px; fill: #c9d2ff; }
  .dpad .k.l { left: 0; top: 45px; border-radius: 12px 4px 4px 12px; }
  .dpad .k.r { right: 0; top: 45px; border-radius: 4px 12px 12px 4px; }
  .dpad .k.u { left: 45px; top: 0; border-radius: 12px 12px 4px 4px; }
  .dpad .k.d { left: 45px; bottom: 0; border-radius: 4px 4px 12px 12px; }
  .dpad::after { content: ""; position: absolute; left: 47px; top: 47px; width: 44px; height: 44px; background: #262d52; border-radius: 6px; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .small { padding: 8px 10px; border-radius: 999px; font-size: 7px; color: #c9d2ff; background: #232a4d; border: 2px solid #3d4780; box-shadow: 0 3px 0 #0b0f22; }
  .abtns { position: relative; width: 150px; height: 140px; justify-self: end; }
  .ab { position: absolute; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: #fff; text-shadow: 2px 2px 0 rgba(0, 0, 0, .5); box-shadow: 0 5px 0 rgba(0, 0, 0, .45), inset 0 3px 0 rgba(255, 255, 255, .3); }
  .ab small { position: absolute; bottom: -16px; font-size: 6px; color: #8c96c9; text-shadow: none; white-space: nowrap; }
  .ab.a { width: 66px; height: 66px; right: 0; top: 20px; background: radial-gradient(circle at 50% 35%, #ff9bb5, #e0335f 60%, #8e1235); }
  .ab.b { width: 58px; height: 58px; right: 76px; top: 58px; background: radial-gradient(circle at 50% 35%, #9fd7ff, #2f7fd6 60%, #163d78); }
  .ab.s { width: 42px; height: 42px; right: 84px; top: 0; font-size: 14px; background: radial-gradient(circle at 50% 35%, #fff2b0, #f0b429 60%, #8a5a00); }
  .k.on, .ab.on, .small.on { transform: translateY(3px); filter: brightness(1.3); box-shadow: 0 1px 0 rgba(0, 0, 0, .45); }

  /* Paysage / téléphone couché : écran plein, boutons par-dessus */
  @media (orientation: landscape) {
    #app { justify-content: center; }
    #screen { height: 100dvh; width: auto; max-width: none; margin: 0; }
    #pad { position: absolute; inset: 0; max-width: none; pointer-events: none; display: block; padding: 0; }
    #pad > * { pointer-events: auto; position: absolute; }
    .dpad { left: calc(14px + env(safe-area-inset-left)); bottom: 14px; opacity: .75; }
    .abtns { right: calc(14px + env(safe-area-inset-right)); bottom: 14px; opacity: .8; }
    .mid { bottom: 8px; left: 50%; transform: translateX(-50%); flex-direction: row; opacity: .7; }
  }
  /* Ordinateur (souris) : clavier, pas de manette tactile */
  @media (hover: hover) and (pointer: fine) {
    #pad { display: none !important; }
    #app { justify-content: center; }
    #screen { height: min(100dvh, 75vw); width: auto; max-width: 100vw; margin: 0; border-radius: 6px; }
  }
  #tsQuit { position: fixed; z-index: 30; top: calc(8px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left));
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; opacity: .8;
    background: rgba(20, 24, 48, .85); border: 2px solid #4c578f; box-shadow: 0 3px 0 #0b0f22; touch-action: manipulation; }
  #tsQuit svg { width: 18px; height: 18px; stroke: #c9d2ff; stroke-width: 2.6; stroke-linecap: round; fill: none; }
  #tsQuit:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b0f22; }
  /* Portrait sur téléphone : le bouton Quitter est dans la manette (sous PAUSE / SON) */
  #tsQuit { display: none; }
  @media (orientation: landscape), (hover: hover) and (pointer: fine) { #tsQuit { display: grid; } #tsQuit2 { display: none; } }
</style>

<body>
<button id="tsQuit" type="button" aria-label="Quitter"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div id="app">
  <div id="screen"><canvas id="c" width="256" height="192"></canvas></div>
  <div id="brand"><b style="color:#9ad7ff">兄</b>TYRIEL &amp; SOREN<b style="color:#a8e6a0">弟</b></div>
  <div id="pad">
    <div class="dpad">
      <div class="k u" data-k="up"><svg viewBox="0 0 24 24"><path d="M12 5 L20 17 H4 Z"/></svg></div>
      <div class="k l" data-k="left"><svg viewBox="0 0 24 24"><path d="M5 12 L17 4 V20 Z"/></svg></div>
      <div class="k r" data-k="right"><svg viewBox="0 0 24 24"><path d="M19 12 L7 4 V20 Z"/></svg></div>
      <div class="k d" data-k="down"><svg viewBox="0 0 24 24"><path d="M12 19 L20 7 H4 Z"/></svg></div>
    </div>
    <div class="mid">
      <div class="small" data-k="pause">PAUSE</div>
      <div class="small" data-k="music">♪ SON</div>
      <div class="small" id="tsQuit2">✕ QUITTER</div>
    </div>
    <div class="abtns">
      <div class="ab s" data-k="special">★<small>SPÉCIAL</small></div>
      <div class="ab b" data-k="attack">B<small>ATTAQUE</small></div>
      <div class="ab a" data-k="jump">A<small>SAUT</small></div>
    </div>
  </div>
</div>

<script>
"use strict";
// =====================================================================
//  TYRIEL & SOREN — LA LÉGENDE DES FRÈRES
//  Jeu de plateforme rétro 2D. Choisis Tyriel (兄, le grand frère, épée
//  de l'Aube) ou Soren (弟, le petit frère, lanterne-esprit et double saut).
//  3 mondes, 6 niveaux, un boss final : Zyltharak.
//
//  Clavier : ← → (ou Q/D) bouger · ESPACE/Z/↑ sauter · X/J attaquer
//            C/K spécial · P pause · M musique · ENTRÉE valider
// =====================================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const VW = 256, VH = 192, T = 16;
ctx.imageSmoothingEnabled = false;
const FONT = "'Press Start 2P', monospace";
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// ================================================================== ENTRÉES
const K = { left: 0, right: 0, up: 0, down: 0, jump: 0, attack: 0, special: 0 };
const P = { jump: 0, attack: 0, special: 0, confirm: 0, left: 0, right: 0, up: 0, down: 0, pause: 0, music: 0, tap: 0 }; // appuis (front montant)
function press(k, on) {
  if (k === 'pause' || k === 'music') { if (on) P[k] = 1; return; }
  if (on && !K[k]) { if (k in P) P[k] = 1; if (k === 'jump' || k === 'attack') P.confirm = 1; }
  K[k] = on ? 1 : 0;
}
const KEYMAP = { ArrowLeft: 'left', KeyQ: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyZ: 'jump', KeyW: 'jump', KeyX: 'attack', KeyJ: 'attack', KeyC: 'special', KeyK: 'special', KeyP: 'pause', Escape: 'pause', KeyM: 'music' };
addEventListener('keydown', (e) => {
  initAudio();
  if (e.code === 'Enter') { P.confirm = 1; return; }
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault();
  if (!e.repeat) press(k, true);
});
addEventListener('keyup', (e) => {
  const k = KEYMAP[e.code]; if (!k) return;
  press(k, false);
});
document.querySelectorAll('[data-k]').forEach((b) => {
  if (b.closest('.dpad')) return; // la croix a sa propre gestion (diagonales) juste en dessous
  const k = b.dataset.k;
  const on = (e) => { e.preventDefault(); initAudio(); b.setPointerCapture?.(e.pointerId); b.classList.add('on'); press(k, true); };
  const off = (e) => { e.preventDefault(); b.classList.remove('on'); press(k, false); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
});
// Croix tactile « glissable » à 8 directions : un seul pouce peut courir ET sauter
// (diagonale haut-gauche / haut-droite = avancer + sauter), et on peut glisser
// d'une direction à l'autre sans relever le doigt.
(function () {
  const pad = document.querySelector('.dpad'); if (!pad) return;
  const keyEl = { up: pad.querySelector('.u'), down: pad.querySelector('.d'), left: pad.querySelector('.l'), right: pad.querySelector('.r') };
  let pid = null; const cur = { up: 0, down: 0, left: 0, right: 0 };
  const set = (next) => {
    for (const k in cur) if (cur[k] !== next[k]) { cur[k] = next[k]; press(k, !!next[k]); keyEl[k] && keyEl[k].classList.toggle('on', !!next[k]); }
  };
  const pick = (e) => {
    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const n = { up: 0, down: 0, left: 0, right: 0 };
    if (Math.hypot(dx, dy) >= r.width * 0.12) {
      const a = Math.atan2(dy, dx) * 180 / Math.PI; // 0 = droite, -90 = haut
      if (a > -67.5 && a < 67.5) n.right = 1;
      if (a > 112.5 || a < -112.5) n.left = 1;
      if (a > -157.5 && a < -22.5) n.up = 1;
      if (a > 22.5 && a < 157.5) n.down = 1;
    }
    set(n);
  };
  pad.style.touchAction = 'none';
  pad.addEventListener('pointerdown', (e) => {
    e.preventDefault(); initAudio(); if (pid !== null) return;
    pid = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch (_) {}
    pick(e);
  });
  pad.addEventListener('pointermove', (e) => { if (e.pointerId === pid) pick(e); });
  const end = (e) => { if (e.pointerId !== pid) return; pid = null; set({ up: 0, down: 0, left: 0, right: 0 }); };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end); pad.addEventListener('lostpointercapture', end);
})();
// Toucher l'écran : valide dans les menus (et choisit le héros sur l'écran de sélection)
let tapX = -1, tapY = -1;
cv.addEventListener('pointerdown', (e) => {
  initAudio();
  const r = cv.getBoundingClientRect(); tapX = (e.clientX - r.left) / r.width * VW; tapY = (e.clientY - r.top) / r.height * VH;
  P.confirm = 1; P.tap = 1;
});

// ================================================================== AUDIO
let AC = null, master = null, musicOn = true;
try { musicOn = localStorage.getItem('ts_music') !== '0'; } catch (e) {}
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination); } catch (e) { return; } }
  if (AC.state === 'suspended') AC.resume();
}
function tone(type, f1, f2, dur, vol = 0.08, delay = 0, dest) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f1, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) {}
}
function noise(dur, vol = 0.1, delay = 0) {
  if (!AC) return;
  const len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(master); s.start(AC.currentTime + delay);
}
const SFX = {
  jump: () => tone('square', 240, 620, 0.12, 0.06),
  djump: () => tone('square', 420, 980, 0.12, 0.06),
  coin: () => { tone('square', 988, 0, 0.06, 0.05); tone('square', 1319, 0, 0.16, 0.05, 0.06); },
  slash: () => { noise(0.08, 0.12); tone('sawtooth', 900, 200, 0.09, 0.04); },
  shoot: () => tone('triangle', 700, 300, 0.12, 0.07),
  hit: () => tone('square', 220, 90, 0.12, 0.07),
  stomp: () => tone('square', 300, 700, 0.1, 0.07),
  hurt: () => { tone('sawtooth', 300, 60, 0.35, 0.09); noise(0.15, 0.08); },
  bump: () => tone('triangle', 140, 90, 0.08, 0.1),
  brick: () => noise(0.18, 0.18),
  item: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone('square', f, 0, 0.07, 0.045, i * 0.05)),
  heart: () => [659, 880, 1175].forEach((f, i) => tone('triangle', f, 0, 0.12, 0.08, i * 0.07)),
  oneup: () => [659, 784, 1319, 1047, 1175, 1568].forEach((f, i) => tone('square', f, 0, 0.09, 0.05, i * 0.08)),
  special: () => { tone('sawtooth', 120, 1200, 0.5, 0.07); noise(0.5, 0.1); },
  check: () => [784, 988, 1175].forEach((f, i) => tone('triangle', f, 0, 0.15, 0.08, i * 0.09)),
  die: () => [494, 466, 440, 415, 392, 330].forEach((f, i) => tone('square', f, 0, 0.14, 0.06, i * 0.12)),
  clear: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone('square', f, 0, 0.16, 0.06, i * 0.11)),
  boom: () => { noise(0.6, 0.25); tone('sawtooth', 120, 30, 0.6, 0.12); },
  select: () => tone('square', 660, 880, 0.08, 0.05),
  roar: () => { tone('sawtooth', 90, 50, 0.7, 0.12); noise(0.5, 0.1); },
};

// Musique chiptune : petites boucles originales (gamme japonaise « yo »)
const N = (n) => 440 * Math.pow(2, (n - 69) / 12);
const SONGS = {
  forest: { bpm: 132, lead: [74, 0, 76, 79, 81, 0, 79, 76, 74, 76, 74, 71, 69, 0, 0, 0, 71, 0, 74, 76, 79, 0, 81, 83, 81, 79, 76, 79, 74, 0, 0, 0],
    bass: [50, 50, 57, 57, 52, 52, 59, 59, 55, 55, 62, 62, 50, 50, 57, 57] },
  night: { bpm: 108, lead: [69, 0, 72, 0, 74, 76, 74, 0, 72, 0, 69, 0, 67, 0, 69, 0, 72, 74, 76, 0, 79, 0, 76, 74, 72, 0, 74, 0, 69, 0, 0, 0],
    bass: [45, 45, 52, 52, 48, 48, 55, 55, 43, 43, 50, 50, 45, 45, 52, 52] },
  tower: { bpm: 144, lead: [62, 65, 69, 65, 62, 65, 70, 69, 67, 0, 65, 64, 62, 0, 61, 0, 62, 65, 69, 72, 74, 72, 69, 65, 67, 69, 65, 64, 62, 0, 0, 0],
    bass: [38, 38, 38, 45, 41, 41, 41, 48, 43, 43, 43, 45, 38, 37, 38, 45] },
  boss: { bpm: 168, lead: [62, 0, 62, 63, 62, 0, 60, 0, 62, 0, 62, 63, 65, 0, 63, 62, 67, 0, 67, 68, 67, 0, 65, 0, 63, 62, 60, 58, 57, 0, 0, 0],
    bass: [38, 38, 50, 38, 38, 50, 36, 48, 39, 39, 51, 39, 41, 41, 53, 41] },
  title: { bpm: 112, lead: [76, 0, 79, 0, 81, 0, 83, 81, 79, 0, 76, 0, 74, 0, 0, 0, 76, 0, 79, 81, 83, 0, 86, 0, 83, 81, 79, 76, 79, 0, 0, 0],
    bass: [52, 52, 59, 59, 55, 55, 62, 62, 57, 57, 64, 64, 52, 52, 59, 59] },
};
let song = null, songStep = 0, nextNote = 0, musicGain = null;
function playSong(name) {
  if (song === SONGS[name]) return;
  song = SONGS[name] || null; songStep = 0; nextNote = AC ? AC.currentTime + 0.05 : 0;
}
function musicTick() {
  if (!AC || !song || !musicOn || AC.state !== 'running') return;
  if (!musicGain) { musicGain = AC.createGain(); musicGain.gain.value = 0.55; musicGain.connect(master); }
  const step = 60 / song.bpm / 2;
  while (nextNote < AC.currentTime + 0.12) {
    const d = nextNote - AC.currentTime;
    const l = song.lead[songStep % song.lead.length];
    if (l) tone('square', N(l), 0, step * 0.9, 0.035, Math.max(0, d), musicGain);
    if (songStep % 2 === 0) { const b = song.bass[(songStep / 2) % song.bass.length]; tone('triangle', N(b), 0, step * 1.8, 0.07, Math.max(0, d), musicGain); }
    if (songStep % 4 === 2) tone('square', 2000, 800, 0.02, 0.012, Math.max(0, d), musicGain);
    songStep++; nextNote += step;
  }
}

// ================================================================== SPRITES PIXEL
function sprite(rows, pal, w = 16) {
  const c = document.createElement('canvas'); c.width = w; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < w; x++) { const ch = r[x]; if (ch && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } } });
  return c;
}
const PAL_T = { H: '#2b2230', h: '#4a3d5c', S: '#f6d7bf', s: '#e2b89c', E: '#1d1724', B: '#f2a0a0', M: '#a3524a', R: '#e0623f', r: '#b8432a',
  C: '#5a92dc', c: '#3c6fba', w: '#fff6ec', L: '#8a5a36', N: '#283150', O: '#5a3a26' };
const PAL_S = { H: '#6b4a32', h: '#8c6646', L: '#7fbf6a', l: '#4f8a4c', S: '#f6d7bf', s: '#e2b89c', E: '#2a1d14', W: '#ffffff', B: '#f2a0a0', M: '#c46a5a',
  T: '#7bb56e', t: '#4f8a4c', w: '#fff6ec', O: '#a0703f', N: '#efe2c8', K: '#6b4329' };
const HEAD_T = [
  "................",
  ".....HHHHH......",
  "...HHHHHHHHH....",
  "..HHHHhHHHHHH...",
  "..HHhHHHHHhHHH..",
  ".HHHHHHHHHHHHH..",
  ".HHHSHHSSHHSHH..",
  ".HHSSSSSSSSSSH..",
  ".HSSSSSSESSSES..",
  ".HSSSSSSESSSES..",
  "..SSSSSBSSSSBS..",
  "...SSSSSSSMMS...",
  "....sSSSSSSs....",
];
const BODY_T = [
  "....RRRRRRRR....",
  "...rRRRwwRRRR...",
  "..r.CCCwwCCCCC..",
  ".r..CCCwwCCCCC..",
  "....CcCCCCCcCS..",
  "....LLLLLLLLL...",
  "....CCCCCCCCc...",
];
const BODY_T_ATK = [
  "....RRRRRRRR....",
  "...rRRRwwRRRR...",
  "..r.CCCwwCCCCCCS",
  ".r..CCCwwCCCCCC.",
  "....CcCCCCCcC...",
  "....LLLLLLLLL...",
  "....CCCCCCCCc...",
];
const HEAD_S = [
  "........HH......",
  ".......HH...LL..",
  "....HHHHHHHLlL..",
  "..HHHHHhHHHHLH..",
  ".HHHhHHHHHHHHHH.",
  ".HHHHHHHHHHhHHH.",
  ".HHHSHHHSSHHSHH.",
  ".HHSSSSSSSSSSSH.",
  ".HSSSSSSEESSSEE.",
  ".HSSSSSSEWSSSEW.",
  "..SSSSBSSSSSSBS.",
  "...SSSSSSSMMSS..",
  "....sSSSSSSSs...",
];
const BODY_S = [
  "....TTTTwwTT....",
  "...TTOTTwwTTT...",
  "...TTTOTTTTTTS..",
  "...TTTTOTTTTTS..",
  "...TTTTTOTTTT...",
  "...TTTTTTOOO....",
  "....TTTTTTTT....",
];
const BODY_S_ATK = [
  "....TTTTwwTT....",
  "...TTOTTwwTTT...",
  "...TTTOTTTTTTTS.",
  "...TTTTOTTTTTT..",
  "...TTTTTOTTTT...",
  "...TTTTTTOOO....",
  "....TTTTTTTT....",
];
function legs(boot) {
  return {

function buildLevel(i) {
  L = LEVELS[i]; theme = THEMES[L.theme];
  const rows = Array.from({ length: 12 }, () => []);
  for (const name of L.chunks) { const ch = CH[name]; for (let r = 0; r < 12; r++) rows[r].push(...ch[r]); }
  mapW = rows[0].length;
  map = rows; enemies = []; items = []; movers = []; shots = []; eshots = []; parts = []; texts = []; bumps = []; boss = null; bossLock = false;
  let start = { x: 32, y: 120 };
  for (let y = 0; y < 12; y++) for (let x = 0; x < mapW; x++) {
    let c = map[y][x];
    if (c === 'x') c = L.hard;
    const px = x * T, py = y * T;
    if (c === 'P') { start = { x: px, y: py }; map[y][x] = '.'; }
    else if ('ebkaZ'.includes(c)) { spawnEnemy(c, px, py); map[y][x] = '.'; }
    else if (c === 'o') { items.push({ type: 'coin', x: px + 4, y: py + 3, w: 8, h: 10, ph: x * 0.4 }); map[y][x] = '.'; }
    else if (c === 'H') { items.push({ type: 'heart', x: px + 2, y: py + 2, w: 12, h: 12, ph: 0 }); map[y][x] = '.'; }
    else if (c === 'M') { movers.push({ x: px, y: py, w: 48, h: 8, x0: px, range: 7 * T, vx: 0.7, dx: 0 }); map[y][x] = '.'; }
    else if (c === 'C') { items.push({ type: 'check', x: px, y: py - 8, w: 16, h: 24, on: false }); map[y][x] = '.'; }
    else if (c === 'G') { items.push({ type: 'goal', x: px, y: py - 40, w: 40, h: 56 }); map[y][x] = '.'; }
    else if (c === 'x') map[y][x] = '.';
  }
  return start;
}
function spawnEnemy(c, x, y) {
  if (c === 'e') enemies.push({ type: 'slime', x: x + 1, y: y + 4, w: 14, h: 12, vx: -0.5, vy: 0, hp: 1, stomp: true, pts: 100 });
  if (c === 'k') enemies.push({ type: 'chestnut', x: x + 1, y: y + 2, w: 14, h: 14, vx: -0.6, vy: 0, hp: 2, stomp: false, pts: 200 });
  if (c === 'b') enemies.push({ type: 'bat', x, y, w: 14, h: 10, y0: y, vx: -0.7, vy: 0, hp: 1, stomp: true, pts: 150, ph: Math.random() * 6 });

}

function updateItems() {
  for (const it of items) {
    if (it.rise > 0) { it.y -= 1; it.rise--; }
    if (it.got) continue;
    it.ph = (it.ph || 0) + 0.08;
    if (!overlap(pl, it)) continue;
    if (it.type === 'coin') { it.got = true; addCoin(it.x + 4, it.y); sparks(it.x + 4, it.y + 4, 6, ['#ffe14d', '#fff'], 1.5, 0); }
    else if (it.type === 'heart') { it.got = true; if (pl.hp < H.hp) { pl.hp++; score += 50; popText(it.x, it.y, '+1 ♥', '#ff6b8b'); } else { score += 500; popText(it.x, it.y, '500', '#ffe14d'); } SFX.heart(); }
    else if (it.type === 'spirit') { it.got = true; spirit = Math.min(30, spirit + 12); SFX.heart(); popText(it.x - 8, it.y, 'ESPRIT +12', '#9ad7ff'); }
    else if (it.type === 'check' && !it.on) { it.on = true; checkpoint = { x: it.x, y: it.y + 8 }; SFX.check(); popText(it.x - 16, it.y - 8, 'SAUVEGARDE', '#ffd27a'); sparks(it.x + 8, it.y + 4, 14, ['#ffd27a', '#fff']); }

    const x = Math.round(s.x - camX), y = Math.round(s.y);
    if (s.spirit) { ctx.fillStyle = 'rgba(255,200,110,.35)'; ctx.beginPath(); ctx.arc(x + 4, y + 4, 7, 0, 6.28); ctx.fill(); ctx.fillStyle = '#2a1d14'; ctx.fillRect(x + 1, y, 6, 1); ctx.fillStyle = '#ffb35c'; ctx.fillRect(x + 1, y + 1, 6, 6); ctx.fillStyle = '#fff2c4'; ctx.fillRect(x + 3, y + 2, 2, 4); }
    else { ctx.fillStyle = 'rgba(255,140,60,.4)'; ctx.beginPath(); ctx.arc(x + 3, y + 3, 6, 0, 6.28); ctx.fill(); ctx.fillStyle = '#ff9b3c'; ctx.fillRect(x, y, 7, 7); ctx.fillStyle = '#fff2c4'; ctx.fillRect(x + 2, y + 2, 3, 3); }
  }
  for (const s of eshots) {
    const x = Math.round(s.x - camX), y = Math.round(s.y);
    if (s.type === 'fire') { const r = s.big ? 6 : 4; ctx.fillStyle = 'rgba(200,80,255,.35)'; ctx.beginPath(); ctx.arc(x + 3, y + 3, r + 3, 0, 6.28); ctx.fill(); ctx.fillStyle = s.big ? '#c084fc' : '#ff5a5a'; ctx.beginPath(); ctx.arc(x + 3, y + 3, r, 0, 6.28); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(x + 2, y + 2, 2, 2); }
    else if (s.type === 'wave') { ctx.fillStyle = '#c084fc'; for (let i = 0; i < 3; i++) ctx.fillRect(x + i * 4, y + 12 - (6 + Math.sin(frame * 0.5 + i) * 4), 3, 6 + Math.sin(frame * 0.5 + i) * 4); ctx.fillStyle = '#fff'; ctx.fillRect(x + 4, y + 6, 2, 2); }
    else if (s.type === 'rock') { ctx.fillStyle = '#6a5f86'; ctx.fillRect(x, y, 8, 8); ctx.fillStyle = '#9a8fb6'; ctx.fillRect(x, y, 8, 2); }
  }
}

function drawParts() {
  for (const p of parts) {
    if (p.nova) { ctx.strokeStyle = `rgba(255,233,168,${p.life / 36})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(p.x - camX, p.y, p.r, 0, 6.28); ctx.stroke(); ctx.lineWidth = 2; ctx.strokeStyle = `rgba(255,255,255,${p.life / 36})`; ctx.beginPath(); ctx.arc(p.x - camX, p.y, p.r * 0.7, 0, 6.28); ctx.stroke(); continue; }
    if (p.coin) { ctx.fillStyle = '#ffd23f'; ctx.fillRect(Math.round(p.x - camX) + 1, Math.round(p.y), 6, 10); ctx.fillStyle = '#fff6b0'; ctx.fillRect(Math.round(p.x - camX) + 2, Math.round(p.y) + 2, 1, 4); continue; }
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 20)); ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x - camX), Math.round(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
}
function updateParts() {
  for (const p of parts) { if (p.nova) { p.r += 8; p.life--; continue; } p.x += p.vx; p.y += p.vy; p.vy += p.g || 0; p.life--; }
  parts = parts.filter((p) => p.life > 0);
  for (const t of texts) { t.y -= 0.5; t.life--; }
  texts = texts.filter((t) => t.life > 0);
}

// ================================================================== TEXTE & HUD
function txt(s, x, y, size = 8, col = '#fff', align = 'left', shadow = '#000') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'top';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(s, x + 1, y + 1); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function jp(s, x, y, size, col, align = 'center') { ctx.font = `900 ${size}px 'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif`; ctx.textAlign = align; ctx.textBaseline = 'top'; ctx.fillStyle = '#000'; ctx.fillText(s, x + 2, y + 2); ctx.fillStyle = col; ctx.fillText(s, x, y); }
function heartIcon(x, y, full) {
  ctx.fillStyle = '#000'; ctx.fillRect(x, y + 1, 9, 5); ctx.fillRect(x + 1, y + 6, 7, 2); ctx.fillRect(x + 3, y + 8, 3, 1);
  ctx.fillStyle = full ? '#ff4d6d' : '#4a2a3a'; ctx.fillRect(x + 1, y, 3, 2); ctx.fillRect(x + 5, y, 3, 2); ctx.fillRect(x + 1, y + 2, 7, 3); ctx.fillRect(x + 2, y + 5, 5, 2); ctx.fillRect(x + 4, y + 7, 1, 1);
  if (full) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 2, y + 1, 1, 1); }
}
function drawHud() {
  ctx.fillStyle = 'rgba(8,10,24,.72)'; ctx.fillRect(0, 0, VW, 15); ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(0, 15, VW, 1);
  for (let i = 0; i < H.hp; i++) heartIcon(4 + i * 10, 3, i < pl.hp);
  // pièces
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(50, 4, 5, 8); ctx.fillStyle = '#fff6b0'; ctx.fillRect(51, 5, 1, 3);
  txt('x' + String(coins).padStart(2, '0'), 57, 4, 7, '#ffe9a8');
  txt(String(score).padStart(7, '0'), 92, 4, 7, '#fff');
  // jauge d'esprit
  ctx.fillStyle = '#000'; ctx.fillRect(152, 4, 34, 7); ctx.fillStyle = '#16243a'; ctx.fillRect(153, 5, 32, 5);
  const full = spirit >= 30; ctx.fillStyle = full ? (frame % 20 < 10 ? '#fff4b0' : '#ffd23f') : '#6ad0ff'; ctx.fillRect(153, 5, Math.round(32 * spirit / 30), 5);
  txt('★', 188, 3, 7, full ? '#ffd23f' : '#5a6a8a', 'left', null);
  txt(L.world, 200, 4, 7, '#9ad7ff');
  txt(String(Math.max(0, timeLeft)).padStart(3, '0'), 252, 4, 7, timeLeft <= 60 && frame % 30 < 15 ? '#ff6b6b' : '#fff', 'right');
  if (boss && boss.active && !boss.dead) {
    ctx.fillStyle = '#000'; ctx.fillRect(48, VH - 14, 160, 9); ctx.fillStyle = '#2a1030'; ctx.fillRect(49, VH - 13, 158, 7);
    ctx.fillStyle = boss.phase === 2 ? '#ff4d4d' : '#c084fc'; ctx.fillRect(49, VH - 13, Math.round(158 * boss.hp / boss.max), 7);
    txt('ZYLTHARAK', 128, VH - 24, 7, '#f0abfc', 'center');
  }
}

// ================================================================== ÉCRANS
function drawTitle() {
  L = LEVELS[0]; theme = THEMES.forest;
  const scroll = frame * 0.6;
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#1b2a4a'); g.addColorStop(0.55, '#c98fa0'); g.addColorStop(1, '#f4c38e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  [[0, 0.2], [1, 0.5]].forEach(([i, f]) => { const off = -Math.floor((scroll * f) % 512); ctx.drawImage(BG.forest[i], off, 0); ctx.drawImage(BG.forest[i], off + 512, 0); });
  ctx.fillStyle = 'rgba(10,12,30,.35)'; ctx.fillRect(0, 0, VW, VH);
  for (let x = -((scroll) % 16); x < VW; x += 16) { ctx.drawImage(tileSprite('#', false, theme), Math.round(x), 160); ctx.drawImage(tileSprite('#', true, theme), Math.round(x), 176); }
  // Pétales
  for (let i = 0; i < 18; i++) { const px = (i * 61 + frame * (0.6 + (i % 3) * 0.2)) % (VW + 20) - 10, py = (i * 37 + frame * (0.4 + (i % 4) * 0.1)) % VH; ctx.fillStyle = i % 2 ? '#f9c6d4' : '#f4a7bf'; ctx.fillRect(Math.round(px), Math.round(py), 2, 2); }
  // Les deux frères qui courent
  const ry = 160;
  [['tyriel', 96], ['soren', 132]].forEach(([id, x]) => { const S = SPR[id]; const img = Math.floor(frame / 8) % 2 ? S.runA : S.runB; ctx.drawImage(img, x, ry - 24); });
  // Logo
  jp('兄', 34, 18, 38, '#9ad7ff'); jp('弟', 222, 18, 38, '#a8e6a0');
  const wob = Math.sin(frame * 0.05) * 2;
  txt('TYRIEL', 128, 26 + wob, 16, '#ffe9a8', 'center', '#7a2a1a');
  txt('&', 128, 46 + wob, 10, '#fff', 'center', '#7a2a1a');
  txt('SOREN', 128, 60 + wob, 16, '#ffe9a8', 'center', '#7a2a1a');
  txt('LA LÉGENDE DES FRÈRES', 128, 84, 7, '#ffd0dc', 'center');
  const opts = unlocked > 0 ? ['NOUVELLE PARTIE', `CONTINUER (${LEVELS[unlocked].world})`] : ['NOUVELLE PARTIE'];
  if (frame % 60 < 40) txt('APPUIE SUR A', 128, 98, 7, '#ffe14d', 'center');
  opts.forEach((o, i) => { const sel = i === titleSel; txt((sel ? '▶ ' : '  ') + o, 128, 112 + i * 13, 8, sel ? '#fff' : '#b9c0e0', 'center'); });
  if (best) txt('RECORD ' + String(best).padStart(7, '0'), 128, 180, 6, '#fff', 'center');
}

function drawSelect() {
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#0d1428'); g.addColorStop(1, '#241a3a'); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  for (let i = 0; i < 40; i++) { ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect((i * 67) % VW, (i * 41 + frame * 0.2) % VH, 1, 1); }
  txt('CHOISIS TON HÉROS', 128, 8, 8, '#ffe9a8', 'center');
  ['tyriel', 'soren'].forEach((id, i) => {
    const h = HEROES[id], x0 = 8 + i * 124, sel = selIdx === i;
    ctx.fillStyle = sel ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.25)'; ctx.fillRect(x0, 22, 116, 152);
    ctx.strokeStyle = sel ? h.color : '#3a4266'; ctx.lineWidth = sel ? 2 : 1; ctx.strokeRect(x0 + 0.5, 22.5, 115, 151);
    if (sel) { ctx.fillStyle = h.color; ctx.fillRect(x0, 22, 116, 3); }
    jp(h.kanji, x0 + 20, 30, 22, h.color);
    txt(h.name, x0 + 38, 32, 9, '#fff'); txt(h.title, x0 + 38, 44, 6, '#b9c0e0');
    // Héros en grand
    const S = SPR[id], img = sel ? (Math.floor(frame / 8) % 2 ? S.runA : S.runB) : S.idle;
    ctx.save(); ctx.translate(x0 + 58, 104); ctx.scale(2, 2); ctx.drawImage(img, -8, -24);
    if (id === 'tyriel') { ctx.fillStyle = '#c9d2e8'; ctx.fillRect(4, -14, 9, 2); ctx.fillStyle = '#ffd28a'; ctx.fillRect(3, -15, 2, 4); }
    else { ctx.fillStyle = 'rgba(255,179,92,.35)'; ctx.beginPath(); ctx.arc(9, -3, 5, 0, 6.28); ctx.fill(); ctx.fillStyle = '#ffb35c'; ctx.fillRect(7, -6, 5, 5); }
    ctx.restore();
    txt(h.weapon, x0 + 58, 110, 6, h.glow, 'center');
    let y = 120; for (const [k, v] of Object.entries(h.stats)) { txt(k, x0 + 6, y, 6, '#b9c0e0'); for (let j = 0; j < 5; j++) { ctx.fillStyle = j < v ? h.color : '#2a3050'; ctx.fillRect(x0 + 60 + j * 10, y, 8, 5); } y += 9; }
    h.desc.forEach((d, j) => txt(d, x0 + 58, 158 + j * 8, 6, '#d9def5', 'center'));
  });
  if (frame % 60 < 40) txt('◀ ▶ CHOISIR · A VALIDER', 128, 181, 6, '#ffe14d', 'center');
}

function drawIntro() {
  ctx.fillStyle = '#05060d'; ctx.fillRect(0, 0, VW, VH);
  txt('MONDE ' + L.world, 128, 56, 12, '#fff', 'center');
  txt(L.name, 128, 80, 7, '#ffd0dc', 'center');
  const S = SPR[heroId]; ctx.drawImage(S.idle, 98, 112);
  txt('x ' + lives, 122, 124, 9, '#fff');
  jp(H.kanji, 128, 140, 16, H.color);
}

function drawClear() {
  ctx.fillStyle = 'rgba(5,6,13,.78)'; ctx.fillRect(28, 40, 200, 112);
  ctx.strokeStyle = H.color; ctx.lineWidth = 2; ctx.strokeRect(29, 41, 198, 110);
  const last = lvlIndex === LEVELS.length - 1;
  txt(last ? 'ZYLTHARAK VAINCU !' : 'NIVEAU TERMINÉ !', 128, 50, 9, '#ffe14d', 'center');
  txt('TEMPS  ' + clearTally.time + ' x10', 44, 74, 7, '#fff');
  txt(String(clearTally.timePts), 212, 74, 7, '#ffe9a8', 'right');
  txt('SANS DÉGÂT', 44, 90, 7, '#fff'); txt(clearTally.perfect ? '1000' : '---', 212, 90, 7, clearTally.perfect ? '#7CFC9A' : '#666', 'right');
  txt('SCORE', 44, 110, 8, '#fff'); txt(String(score).padStart(7, '0'), 212, 110, 8, '#fff', 'right');
  if (stateT > 90 && frame % 60 < 40) txt('APPUIE SUR A', 128, 134, 7, '#ffe14d', 'center');
}

function drawEnd() {
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#16213b'); g.addColorStop(0.6, '#d69aa2'); g.addColorStop(1, '#f6cf9e'); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  for (let i = 0; i < 24; i++) { const px = (i * 53 + frame * 0.5) % VW, py = (i * 29 + frame * (0.5 + i % 3 * 0.2)) % VH; ctx.fillStyle = i % 2 ? '#f9c6d4' : '#f4a7bf'; ctx.fillRect(px, py, 2, 2); }
  ctx.drawImage(BG.forest[1], -Math.floor(frame * 0.2 % 512), 0); ctx.drawImage(BG.forest[1], 512 - Math.floor(frame * 0.2 % 512), 0);
  ctx.drawImage(SPR.tyriel.idle, 108, 136); ctx.save(); ctx.translate(148, 136); ctx.scale(-1, 1); ctx.drawImage(SPR.soren.idle, -16, 0); ctx.restore();
  jp('兄弟', 128, 16, 24, '#fff');
  txt('LES DEUX FRÈRES', 128, 50, 9, '#fff', 'center', '#7a2a1a');
  txt('SONT ENFIN RÉUNIS !', 128, 64, 9, '#fff', 'center', '#7a2a1a');
  txt('SCORE FINAL ' + String(score).padStart(7, '0'), 128, 90, 7, '#ffe14d', 'center');
  if (score >= best) txt('★ NOUVEAU RECORD ★', 128, 104, 7, '#7CFC9A', 'center');
  txt("MERCI D'AVOIR JOUÉ !", 128, 118, 7, '#fff', 'center');
  if (stateT > 120 && frame % 60 < 40) txt('APPUIE SUR A', 128, 176, 6, '#fff', 'center');
}

function drawPause() {
  ctx.fillStyle = 'rgba(5,6,13,.65)'; ctx.fillRect(0, 0, VW, VH);
  txt('PAUSE', 128, 70, 14, '#fff', 'center');
  txt('A : REPRENDRE', 128, 100, 7, '#ffe14d', 'center');
  txt('M : MUSIQUE ' + (musicOn ? 'OUI' : 'NON'), 128, 116, 6, '#b9c0e0', 'center');
  txt('B : QUITTER', 128, 130, 6, '#b9c0e0', 'center');
}
function drawOver() {
  ctx.fillStyle = '#05060d'; ctx.fillRect(0, 0, VW, VH);
  txt('GAME OVER', 128, 60, 16, '#ff4d6d', 'center');
  txt('SCORE ' + String(score).padStart(7, '0'), 128, 96, 8, '#fff', 'center');
  if (score >= best && score > 0) txt('★ NOUVEAU RECORD ★', 128, 112, 7, '#7CFC9A', 'center');
  if (stateT > 60 && frame % 60 < 40) txt('A : CONTINUER (' + L.world + ')', 128, 140, 7, '#ffe14d', 'center');
  if (stateT > 60) txt('B : MENU', 128, 156, 6, '#b9c0e0', 'center');
}

// ================================================================== BOUCLE PRINCIPALE
function update() {
  frame++; stateT++;
  if (P.music) { musicOn = !musicOn; try { localStorage.setItem('ts_music', musicOn ? '1' : '0'); } catch (e) {} if (musicGain) musicGain.gain.value = musicOn ? 0.55 : 0; }
  switch (state) {
    case ST.TITLE: {
      playSong('title');
      const n = unlocked > 0 ? 2 : 1;
      const mUp = P.up || P.left, mDn = P.down || P.right; // (diagonale de la croix : on ne bouge que d'un cran)
      if (mUp && !mDn) { titleSel = (titleSel + n - 1) % n; SFX.select(); }
      else if (mDn && !mUp) { titleSel = (titleSel + 1) % n; SFX.select(); }
      if (P.tap && n > 1 && tapY > 108 && tapY < 136) titleSel = tapY < 124 ? 0 : 1;
      if (P.confirm && stateT > 20) { SFX.select(); setState(ST.SELECT); }
      break;
    }
    case ST.SELECT:
      if (P.left) { selIdx = 0; SFX.select(); }
      if (P.right) { selIdx = 1; SFX.select(); }
      if (P.tap && stateT > 10) { const want = tapX < VW / 2 ? 0 : 1; if (want !== selIdx) { selIdx = want; SFX.select(); P.confirm = 0; } }
      if (P.confirm && stateT > 15) {
        heroId = selIdx === 0 ? 'tyriel' : 'soren'; H = HEROES[heroId];
        score = 0; coins = 0; lives = 3; spirit = 0; checkpoint = null;
        startLevel(titleSel === 1 ? unlocked : 0, false); SFX.check();
      }
      break;
    case ST.INTRO: if (stateT > 120 || (P.confirm && stateT > 30)) { setState(ST.PLAY); playSong(theme.song); } break;
    case ST.PLAY:
      if (P.pause) { setState(ST.PAUSE); break; }
      updatePlay(); updateParts();
      break;
    case ST.PAUSE:
      if (P.pause || P.jump || (P.confirm && !P.attack)) setState(ST.PLAY);
      else if (P.attack) { playSong('title'); setState(ST.TITLE); }
      break;
    case ST.DEAD:
      if (stateT > 20) { pl.vy += 0.3; pl.y += pl.vy; }
      updateParts();
      if (stateT > 150) {
        lives--;
        if (lives <= 0) { saveBest(); setState(ST.OVER); cxPost({ type: 'cartridge:gameover', game: 'Tyriel & Soren', id: 'tyrielsoren', score, stats: { level: lvlIndex + 1 } }); }
        else { const cp = checkpoint; startLevel(lvlIndex, true); checkpoint = cp; }
      }
      break;
    case ST.CLEAR:
      updateParts();
      if (stateT === 40) score += clearTally.timePts + clearTally.perfect;
      if (stateT > 90 && P.confirm) {
        saveBest();
        if (lvlIndex >= LEVELS.length - 1) { setState(ST.END); playSong('title'); cxPost({ type: 'cartridge:gameover', game: 'Tyriel & Soren', id: 'tyrielsoren', score, stats: { level: lvlIndex + 1, won: true } }); }
        else { checkpoint = null; startLevel(lvlIndex + 1, false); }
      }
      break;
    case ST.OVER:
      if (stateT > 60 && (P.jump || (P.confirm && !P.attack))) { score = 0; lives = 3; coins = 0; spirit = 0; checkpoint = null; startLevel(lvlIndex, false); }
      else if (stateT > 60 && P.attack) setState(ST.TITLE);
      break;
    case ST.END: if (stateT > 120 && P.confirm) setState(ST.TITLE); break;
  }
  for (const k in P) P[k] = 0;
  if (shake > 0) { shake *= 0.86; if (shake < 0.3) shake = 0; }
  if (flashT > 0) flashT--;
  musicTick();
}

function draw() {
  ctx.save();
  if (shake) ctx.translate(Math.round(rnd(-shake, shake) * 0.5), Math.round(rnd(-shake, shake) * 0.5));
  if (state === ST.TITLE) drawTitle();
  else if (state === ST.SELECT) drawSelect();
  else if (state === ST.INTRO) drawIntro();
  else if (state === ST.OVER) drawOver();
  else if (state === ST.END) drawEnd();
  else {
    drawWorld();
    ctx.save(); ctx.translate(-Math.floor(camX), 0);
    for (const it of items) if (it.x > camX - 48 && it.x < camX + VW + 8) drawItem(it);
    for (const e of enemies) if (e.x > camX - 40 && e.x < camX + VW + 40) drawEnemy(e);
    ctx.restore();
    drawHero(); drawShots(); drawParts();
    for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life / 15); txt(t.txt, Math.round(t.x - camX), Math.round(t.y), 6, t.col, 'left'); }
    ctx.globalAlpha = 1;
    drawHud();
    if (state === ST.PAUSE) drawPause();
    if (state === ST.CLEAR) drawClear();
    if (state === ST.DEAD && stateT > 100) { ctx.fillStyle = `rgba(0,0,0,${(stateT - 100) / 50})`; ctx.fillRect(0, 0, VW, VH); }
  }
  if (flashT > 0) { ctx.globalAlpha = flashT / 20; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
  ctx.fillStyle = 'rgba(0,0,0,.07)'; for (let y = 0; y < VH; y += 2) ctx.fillRect(0, y, VW, 1); // scanlines
  ctx.restore();
}

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === ST.PLAY) setState(ST.PAUSE); });
// Dialogue avec l'app Cartridge (borne d'arcade) : prêt, fin de partie (pièces + missions), pause
function cxPost(m) { try { if (window.parent !== window) window.parent.postMessage(m, '*'); } catch (e) {} }
addEventListener('message', (e) => { const d = e.data; if (d && d.type === 'cartridge:pause' && state === ST.PLAY) setState(ST.PAUSE); });
cxPost({ type: 'cartridge:ready', game: 'Tyriel & Soren', id: 'tyrielsoren' });
// Quitter : retour à la salle d'arcade de l'app (ou page précédente si le jeu est ouvert seul)
function cxQuit() {
  if (window.parent !== window) cxPost({ type: 'cartridge:close' });
  else if (history.length > 1) history.back();
  else location.href = './';
}
document.getElementById('tsQuit').addEventListener('click', (e) => { e.stopPropagation(); cxQuit(); });
document.getElementById('tsQuit').addEventListener('pointerdown', (e) => e.stopPropagation());
document.getElementById('tsQuit2').addEventListener('click', (e) => { e.stopPropagation(); cxQuit(); });
if (document.fonts && document.fonts.load) document.fonts.load(`8px ${FONT}`).finally(() => requestAnimationFrame(loop)); else requestAnimationFrame(loop);
// Accès de test : window.__TS = { startLevel, ... }
window.__TS = { get state() { return state; }, startLevel: (i, h = 'tyriel') => { heroId = h; H = HEROES[h]; lives = 3; startLevel(i, false); setState(ST.PLAY); playSong(theme.song); }, get pl() { return pl; }, get boss() { return boss; }, get camX() { return camX; }, setCam: (v) => { camX = v; }, ST, get enemies() { return enemies; } };
</script>
