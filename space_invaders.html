<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Space Invaders - Classique Original</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-app: #05070a;
    --acc: #FF7A45;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-app);
    color: #f2f3f5;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 10px) 10px;
  }

  /* Bouton Fermer le jeu bien placé en haut à droite */
  .close-game-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 10px) + 10px);
    right: 16px;
    z-index: 1000000;
    background: #1b1e26;
    color: #fff;
    border: 1.5px solid var(--acc);
    padding: 6px 12px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    cursor: pointer;
    border-radius: 6px;
    box-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  .close-game-btn:active { background: var(--acc); color: #000; }

  .game-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: rgba(21, 27, 38, 0.9);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--acc);
    flex-shrink: 0;
  }

  .screen-container {
    flex: 1;
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px;
    position: relative;
    min-height: 0;
  }

  .screen-lens {
    background-color: #000;
    padding: 14px;
    border-radius: 18px;
    box-shadow: inset 0 6px 25px rgba(0,0,0,0.95), 0 0 35px rgba(255, 122, 69, 0.2);
    border: 3px solid #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 500px;
    position: relative;
  }

  .hud-top {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: #fff;
    margin-bottom: 8px;
    font-weight: bold;
    padding: 0 4px;
    flex-shrink: 0;
  }

  canvas {
    width: 100% !important;
    height: 100% !important;
    flex: 1;
    display: block;
    background-color: #000;
    border: 2px solid var(--acc);
    min-height: 0;
  }

  /* Contrôles tactiles fluides en bas */
  .controls-container {
    width: 100%;
    max-width: 420px;
    padding: 10px 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .move-group {
    display: flex;
    gap: 12px;
  }

  .arcade-btn {
    background: linear-gradient(145deg, #232c3d, #151b26);
    border: 1.5px solid color-mix(in srgb, var(--acc) 50%, transparent);
    border-radius: 14px;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 24px;
    font-weight: 900;
    width: 80px;
    height: 60px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }

  .arcade-btn:active {
    background: var(--acc);
    color: #000;
    transform: translateY(2px);
  }

  .shoot-btn {
    background: #e52521;
    border: none;
    border-radius: 14px;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    width: 120px;
    height: 60px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }

  .shoot-btn:active {
    transform: translateY(2px);
    filter: brightness(1.2);
  }

  /* Écrans de superposition (Menu & Game Over) style 16-bit classique */
  .screen-overlay {
    position: absolute;
    inset: 14px;
    background-color: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 20px;
    border-radius: 12px;
    border: 2px solid var(--acc);
  }

  .screen-overlay.hidden { display: none; }

  .screen-overlay h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: var(--acc);
    margin-bottom: 12px;
    text-shadow: 2px 2px #331100;
  }

  .screen-overlay p {
    font-family: 'Press Start 2P', monospace;
    font-size: 7.5px;
    color: #a3a9b8;
    margin-bottom: 16px;
    line-height: 1.6;
  }

  .menu-btn {
    background-color: var(--acc);
    color: #000;
    border: none;
    padding: 12px 24px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    font-weight: 900;
    cursor: pointer;
    border-radius: 6px;
    box-shadow: 0 4px #803010;
  }

  .menu-btn:active { transform: translateY(2px); }

  @media (pointer: fine) {
    .controls-container { display: none; }
  }
</style>
</head>
<body>

<button class="close-game-btn" onclick="if(window.parent && window.parent.document.querySelector('div[style*=\'z-index: 999999\']')) { window.parent.document.querySelector('div[style*=\'z-index: 999999\']').remove(); } else { window.close(); }">✕ FERMER</button>

<div class="game-header">
  <span>👾 SPACE INVADERS</span>
  <span>CLAVIER : ← → ESPACE</span>
</div>

<div class="screen-container">
  <div class="screen-lens">
    <div class="hud-top">
      <span id="scoreText">SCORE:0000</span>
      <span id="livesText">VIES:♥♥♥</span>
    </div>

    <div style="position: relative; width: 100%; flex: 1; display: flex; flex-direction: column; min-height: 0;">
      <canvas id="invadersCanvas" width="240" height="320"></canvas>

      <!-- Menu Classique Original 16-bit -->
      <div id="menuScreen" class="screen-overlay">
        <h1>SPACE INVADERS</h1>
        <p>EDITION CLASSIQUE<br><br>Détruisez la flotte extraterrestre sans pitié !</p>
        <button class="menu-btn" id="startBtn">JOUER</button>
      </div>

      <!-- Game Over -->
      <div id="gameOverScreen" class="screen-overlay hidden">
        <h1>GAME OVER</h1>
        <p id="finalScoreText">SCORE : 0</p>
        <button class="menu-btn" id="restartBtn">REJOUER</button>
      </div>
    </div>
  </div>
</div>

<div class="controls-container">
  <div class="move-group">
    <button class="arcade-btn" id="btnLeft">◀</button>
    <button class="arcade-btn" id="btnRight">▶</button>
  </div>
  <button class="shoot-btn" id="btnShoot">FEU ⚡</button>
</div>

<script>
// --- AUDIO SYNTHÉTISEUR 8-BITS ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';

    if (type === 'shoot') {
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'hit') {
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.linearRampToValueAtTime(40, now + 0.15);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'gameover') {
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(60, now + 0.8);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.8);
      osc.start(now); osc.stop(now + 0.8);
    }
  } catch (e) {}
}

// --- LOGIQUE SPACE INVADERS ---
const canvas = document.getElementById("invadersCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let lives = 3;
let gameStarted = false;
let gameOver = false;

let player = { x: 105, y: 285, width: 24, height: 12, speed: 4 };
let bullets = [];
let alienBullets = [];
let aliens = [];
let alienDirection = 1;
let alienSpeed = 0.5;

function initAliens() {
  aliens = [];
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 8; c++) {
      aliens.push({
        x: 20 + c * 24,
        y: 30 + r * 20,
        width: 16,
        height: 12,
        alive: true
      });
    }
  }
}

function updateHUD() {
  document.getElementById("scoreText").textContent = `SCORE:${String(score).padStart(4, '0')}`;
  document.getElementById("livesText").textContent = `VIES:${'♥'.repeat(Math.max(0, lives))}`;
}

let keys = {};
window.addEventListener("keydown", e => {
  if (!gameStarted || gameOver) return;
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
  if (e.code === "Space") { shootBullet(); e.preventDefault(); }
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

function shootBullet() {
  if (bullets.length < 3) {
    bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 10, speed: 6 });
    playSound('shoot');
  }
}

// Contrôles tactiles robustes (pointerdown)
let touchLeft = false, touchRight = false;
document.getElementById("btnLeft").addEventListener("pointerdown", (e) => { e.preventDefault(); touchLeft = true; });
document.getElementById("btnLeft").addEventListener("pointerup", (e) => { e.preventDefault(); touchLeft = false; });
document.getElementById("btnLeft").addEventListener("pointerleave", (e) => { e.preventDefault(); touchLeft = false; });

document.getElementById("btnRight").addEventListener("pointerdown", (e) => { e.preventDefault(); touchRight = true; });
document.getElementById("btnRight").addEventListener("pointerup", (e) => { e.preventDefault(); touchRight = false; });
document.getElementById("btnRight").addEventListener("pointerleave", (e) => { e.preventDefault(); touchRight = false; });

document.getElementById("btnShoot").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (gameStarted && !gameOver) shootBullet();
});

function gameLoop() {
  if (!gameStarted || gameOver) return;

  if ((keys.left || touchLeft) && player.x > 5) player.x -= player.speed;
  if ((keys.right || touchRight) && player.x < canvas.width - player.width - 5) player.x += player.speed;

  bullets.forEach((b, index) => {
    b.y -= b.speed;
    if (b.y < 0) bullets.splice(index, 1);
  });

  let hitEdge = false;
  aliens.forEach(a => {
    if (!a.alive) return;
    a.x += alienSpeed * alienDirection;
    if (a.x <= 5 || a.x >= canvas.width - a.width - 5) hitEdge = true;
  });

  if (hitEdge) {
    alienDirection *= -1;
    aliens.forEach(a => { a.y += 8; });
  }

  if (Math.random() < 0.03) {
    const activeAliens = aliens.filter(a => a.alive);
    if (activeAliens.length > 0) {
      const shooter = activeAliens[Math.floor(Math.random() * activeAliens.length)];
      alienBullets.push({ x: shooter.x + shooter.width / 2 - 2, y: shooter.y + shooter.height, width: 4, height: 8, speed: 3 });
    }
  }

  alienBullets.forEach((ab, index) => {
    ab.y += ab.speed;
    if (ab.y > canvas.height) alienBullets.splice(index, 1);

    if (ab.x < player.x + player.width && ab.x + ab.width > player.x && ab.y < player.y + player.height && ab.y + ab.height > player.y) {
      alienBullets.splice(index, 1);
      lives--;
      playSound('hit');
      updateHUD();
      if (lives <= 0) endGame();
    }
  });

  bullets.forEach((b, bIdx) => {
    aliens.forEach(a => {
      if (a.alive && b.x < a.x + a.width && b.x + b.width > a.x && b.y < a.y + a.height && b.y + b.height > a.y) {
        a.alive = false;
        bullets.splice(bIdx, 1);
        score += 100;
        playSound('hit');
        updateHUD();
        alienSpeed += 0.05;

        if (aliens.every(al => !al.alive)) {
          initAliens();
          alienSpeed += 0.3;
        }
      }
    });
  });

  aliens.forEach(a => {
    if (a.alive && a.y >= player.y - 10) endGame();
  });

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Style classique 16-bit d'origine (blanc et épuré)
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(player.x, player.y + 4, player.width, player.height - 4);
  ctx.fillRect(player.x + player.width / 2 - 2, player.y, 4, 4);

  ctx.fillStyle = "#00FF00";
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

  ctx.fillStyle = "#FF0000";
  alienBullets.forEach(ab => ctx.fillRect(ab.x, ab.y, ab.width, ab.height));

  ctx.fillStyle = "#FFFFFF";
  aliens.forEach(a => {
    if (!a.alive) return;
    ctx.fillRect(a.x, a.y, a.width, a.height);
    ctx.fillStyle = "#000";
    ctx.fillRect(a.x + 3, a.y + 3, 2, 2);
    ctx.fillRect(a.x + 11, a.y + 3, 2, 2);
  });

  requestAnimationFrame(gameLoop);
}

function startGame() {
  gameStarted = true;
  gameOver = false;
  score = 0;
  lives = 3;
  alienSpeed = 0.5;
  bullets = [];
  alienBullets = [];
  initAliens();
  updateHUD();

  document.getElementById("menuScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");

  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameOver = true;
  gameStarted = false;
  playSound('gameover');
  document.getElementById("finalScoreText").textContent = `SCORE : ${score}`;
  document.getElementById("gameOverScreen").classList.remove("hidden");
}

document.getElementById("startBtn").onclick = startGame;
document.getElementById("restartBtn").onclick = startGame;
</script>
</body>
</html>
