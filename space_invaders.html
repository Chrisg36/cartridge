<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Space Invaders - Édition Rétro Monochrome & Game Boy</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --card: #111111;
    --txt: #ffffff;
    --mut: #777777;
    --acc: #ffffff;
  }
  
  body.gameboy-theme {
    --bg: #0f1f0f;
    --card: #152915;
    --txt: #9bbc0f;
    --mut: #486648;
    --acc: #8bac0f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg);
    color: var(--txt);
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    transition: background 0.3s, color 0.3s;
  }

  body.gameboy-theme::after {
    content: " ";
    display: block;
    position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: radial-gradient(rgba(15, 31, 15, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
    background-size: 3px 3px;
    z-index: 999;
    pointer-events: none;
  }

  #game-container {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 750px;
    background: var(--bg);
    border: 4px solid var(--txt);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255,255,255,0.1);
  }

  canvas {
    display: block;
    width: 100%;
    flex: 1;
    background: var(--bg);
    image-rendering: pixelated;
  }

  .screen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
    text-align: center;
  }

  .screen.hidden {
    display: none;
  }

  h1 {
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 20px;
    text-shadow: 2px 2px var(--mut);
    color: var(--txt);
  }

  p {
    font-size: 10px;
    line-height: 1.8;
    color: var(--mut);
    margin-bottom: 15px;
  }

  .btn {
    background: var(--bg);
    color: var(--txt);
    border: 2px solid var(--txt);
    padding: 12px 20px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    margin: 6px 0;
    width: 220px;
    transition: 0.1s;
    text-transform: uppercase;
  }

  .btn:hover, .btn:active {
    background: var(--txt);
    color: var(--bg);
  }

  .btn.active-opt {
    background: var(--txt);
    color: var(--bg);
  }

  /* HUD Top bar */
  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 12px;
    font-size: 9px;
    border-bottom: 2px solid var(--txt);
    background: var(--card);
    z-index: 5;
  }

  /* Tactile Controls */
  #touch-controls {
    height: 110px;
    display: none;
    justify-content: space-between;
    padding: 10px;
    background: var(--card);
    border-top: 2px solid var(--txt);
    z-index: 5;
  }

  .touch-group {
    display: flex;
    gap: 10px;
  }

  .touch-btn {
    background: var(--bg);
    border: 2px solid var(--txt);
    color: var(--txt);
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    width: 65px;
    height: 80px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .touch-btn:active {
    background: var(--txt);
    color: var(--bg);
  }

  #btn-fire {
    width: 130px;
    background: rgba(255,255,255,0.05);
  }

  @media (pointer: coarse) {
    #touch-controls {
      display: flex;
    }
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- HUD -->
  <div id="hud">
    <span id="hud-score">SCORE: 000000</span>
    <span id="hud-stage">ÉTAGE 1</span>
    <span id="hud-lives">♥♥♥</span>
  </div>

  <!-- CANVAS DU JEU -->
  <canvas id="gameCanvas" width="480" height="600"></canvas>

  <!-- CONTRÔLES TACTILES -->
  <div id="touch-controls">
    <div class="touch-group">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div class="touch-group">
      <button class="touch-btn" id="btn-fire">TIR</button>
    </div>
  </div>

  <!-- MENU PRINCIPAL -->
  <div id="screen-main" class="screen">
    <h1>SPACE INVADERS</h1>
    <p>ÉDITION RÉTRO MONOCHROME</p>
    <button class="btn" id="start-adventure">MODE AVENTURE</button>
    <button class="btn" id="start-infinit">MODE INFINI</button>
    <button class="btn" id="btn-settings">RÉGLAGES</button>
  </div>

  <!-- MENU RÉGLAGES -->
  <div id="screen-settings" class="screen hidden">
    <h1>RÉGLAGES</h1>
    <p>DIFFICULTÉ : <span id="lbl-diff">NORMAL</span></p>
    <button class="btn" id="opt-diff">CHANGER DIFFICULTÉ</button>
    <p>SON : <span id="lbl-sound">ON</span></p>
    <button class="btn" id="opt-sound">TOGGLE SON</button>
    <p>FILTRE GAME BOY : <span id="lbl-gb">OFF</span></p>
    <button class="btn" id="opt-gb">TOGGLE FILTRE</button>
    <button class="btn" id="back-main">RETOUR</button>
  </div>

  <!-- ÉCRAN GAME OVER -->
  <div id="screen-gameover" class="screen hidden">
    <h1>GAME OVER</h1>
    <p id="go-score">SCORE FINAL : 0</p>
    <button class="btn" id="restart-btn">REJOUER</button>
  </div>

  <!-- ÉCRAN VICTOIRE -->
  <div id="screen-victory" class="screen hidden">
    <h1>VICTOIRE !</h1>
    <p>VOUS AVEZ SAUVÉ LA GALAXIE</p>
    <p id="vic-score">SCORE : 0</p>
    <button class="btn" id="vic-restart">MENU PRINCIPAL</button>
  </div>
</div>

<script>
// --- WEB AUDIO SYNTHESIZER ---
let audioCtx = null;
let soundOn = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!soundOn) return;
  initAudio();
  if (!audioCtx) return;

  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'shoot') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
    osc.start(now);
    osc.stop(now + 0.1);
  } else if (type === 'hit') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.linearRampToValueAtTime(40, now + 0.2);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
    osc.start(now);
    osc.stop(now + 0.2);
  } else if (type === 'boss_hit') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
    osc.start(now);
    osc.stop(now + 0.15);
  } else if (type === 'gameover') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.linearRampToValueAtTime(80, now + 1.2);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 1.2);
    osc.start(now);
    osc.stop(now + 1.2);
  } else if (type === 'victory') {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, idx) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g);
      g.connect(audioCtx.destination);
      o.type = 'square';
      o.frequency.setValueAtTime(freq, now + idx * 0.15);
      g.gain.setValueAtTime(0.1, now + idx * 0.15);
      g.gain.linearRampToValueAtTime(0.01, now + idx * 0.15 + 0.2);
      o.start(now + idx * 0.15);
      o.stop(now + idx * 0.15 + 0.2);
    });
  }
}

// --- SPRITES PIXEL ART (Matrices 0 et 1) ---
const SPRITES = {
  player: [
    "000010000",
    "000111000",
    "000111000",
    "011111110",
    "111111111",
    "101111101"
  ],
  alien1: [
    "00100100",
    "00011000",
    "00111100",
    "01100110",
    "11111111",
    "10100101",
    "10000001",
    "01000010"
  ],
  alien2: [
    "00011000",
    "00111100",
    "01111110",
    "11011011",
    "11111111",
    "00100100",
    "01011010",
    "10000001"
  ],
  boss: [
    "000111111000",
    "001111111100",
    "011011110110",
    "111111111111",
    "101111111101",
    "100100010001",
    "000110110000"
  ]
};

function drawSprite(ctx, matrix, x, y, scale = 3, color = "#ffffff") {
  ctx.fillStyle = color;
  matrix.forEach((row, r) => {
    for (let c = 0; c < row.length; c++) {
      if (row[c] === '1') {
        ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
      }
    }
  });
}

// --- ÉTAT DU JEU ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameState = "MAIN"; // MAIN, SETTINGS, ADVENTURE, INFINITE, GAMEOVER, VICTORY
let difficulty = "NORMAL"; // FACILE, NORMAL, DIFFICILE
let gameMode = "ADVENTURE"; // ADVENTURE, INFINITE
let currentStage = 1;
let score = 0;
let lives = 3;
let gbFilter = false;

let player = { x: 215, y: 520, w: 27, h: 18, speed: 5 };
let bullets = [];
let enemyBullets = [];
let enemies = [];
let boss = null;
let particleFX = [];

let keys = { ArrowLeft: false, ArrowRight: false, Space: false };
let touchLeft = false, touchRight = false, touchFire = false;

// --- GESTION DES INPUTS ---
window.addEventListener("keydown", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.ArrowLeft = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.ArrowRight = true;
  if (e.code === "Space") {
    if (!keys.Space) fireBullet();
    keys.Space = true;
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.ArrowLeft = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.ArrowRight = false;
  if (e.code === "Space") keys.Space = false;
});

// Contrôles tactiles
document.getElementById("btn-left").addEventListener("touchstart", () => touchLeft = true);
document.getElementById("btn-left").addEventListener("touchend", () => touchLeft = false);
document.getElementById("btn-right").addEventListener("touchstart", () => touchRight = true);
document.getElementById("btn-right").addEventListener("touchend", () => touchRight = false);
document.getElementById("btn-fire").addEventListener("touchstart", () => { fireBullet(); });

// Souris pour test desktop tactile
document.getElementById("btn-left").addEventListener("mousedown", () => touchLeft = true);
document.getElementById("btn-left").addEventListener("mouseup", () => touchLeft = false);
document.getElementById("btn-right").addEventListener("mousedown", () => touchRight = true);
document.getElementById("btn-right").addEventListener("mouseup", () => touchRight = false);
document.getElementById("btn-fire").addEventListener("click", () => { fireBullet(); });

function fireBullet() {
  if (gameState !== "ADVENTURE" && gameState !== "INFINITE") return;
  if (bullets.filter(b => b.fromPlayer).length < (difficulty === "FACILE" ? 3 : 2)) {
    bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10, vy: -8, fromPlayer: true });
    playSound('shoot');
  }
}

// --- INITIALISATION DU NIVEAU ---
function startStage(stageNum) {
  currentStage = stageNum;
  bullets = [];
  enemyBullets = [];
  enemies = [];
  boss = null;

  document.getElementById("hud-stage").textContent = gameMode === "ADVENTURE" ? `ÉTAGE ${currentStage}/10` : `MODE INFINI`;

  if (currentStage % 5 === 0 || (gameMode === "ADVENTURE" && currentStage === 10)) {
    // Boss stage
    let hp = 20 + currentStage * 5;
    if (difficulty === "FACILE") hp = Math.floor(hp * 0.7);
    if (difficulty === "DIFFICILE") hp = Math.floor(hp * 1.4);

    boss = {
      x: 190, y: 70, w: 36, h: 21, hp: hp, maxHp: hp, vx: difficulty === "DIFFICILE" ? 3 : 2, dir: 1, shootTimer: 0
    };
  } else {
    // Vague d'ennemis
    let rows = 3 + Math.floor(currentStage / 2);
    let cols = 6;
    let speedMult = difficulty === "FACILE" ? 0.7 : (difficulty === "DIFFICILE" ? 1.3 : 1.0);

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        enemies.push({
          x: 60 + c * 60,
          y: 70 + r * 45,
          w: 24,
          h: 24,
          type: r % 2 === 0 ? 'alien1' : 'alien2',
          alive: true,
          vx: 1 * speedMult,
          baseY: 70 + r * 45
        });
      }
    }
  }
}

function initGame(mode) {
  gameMode = mode;
  score = 0;
  lives = 3;
  player.x = 215;
  
  document.getElementById("screen-main").classList.add("hidden");
  document.getElementById("screen-gameover").classList.add("hidden");
  document.getElementById("screen-victory").classList.add("hidden");
  document.getElementById("screen-settings").classList.add("hidden");

  gameState = mode;
  startStage(1);
}

// --- BOUCLE PRINCIPALE DE JEU ---
let enemyAnimTimer = 0;

function update() {
  if (gameState !== "ADVENTURE" && gameState !== "INFINITE") return;

  // Déplacements Joueur
  if (keys.ArrowLeft || touchLeft) player.x -= player.speed;
  if (keys.ArrowRight || touchRight) player.x += player.speed;
  if (player.x < 10) player.x = 10;
  if (player.x > canvas.width - player.w - 10) player.x = canvas.width - player.w - 10;

  // Mise à jour Bullets
  bullets.forEach(b => b.y += b.vy);
  bullets = bullets.filter(b => b.y > -20 && b.y < canvas.height + 20);

  enemyBullets.forEach(b => b.y += b.vy);
  enemyBullets = enemyBullets.filter(b => b.y > -20 && b.y < canvas.height + 20);

  // Gestion Ennemis
  let touchEdge = false;
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.vx;
    if (e.x < 15 || e.x > canvas.width - e.w - 15) touchEdge = true;
  });

  if (touchEdge) {
    enemies.forEach(e => {
      e.vx *= -1;
      e.y += 15;
      if (e.y >= player.y - 20) {
        lives = 0; // Invasion réussie = Game Over immédiat
      }
    });
  }

  // Tirs ennemis aléatoires
  let aliveEnemies = enemies.filter(e => e.alive);
  let fireChance = difficulty === "FACILE" ? 0.008 : (difficulty === "DIFFICILE" ? 0.03 : 0.015);
  if (aliveEnemies.length > 0 && Math.random() < fireChance * (1 + currentStage * 0.1)) {
    let shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
    let pVy = difficulty === "FACILE" ? 3 : (difficulty === "DIFFICILE" ? 5 : 4);
    enemyBullets.push({ x: shooter.x + shooter.w / 2 - 2, y: shooter.y + shooter.h, w: 4, h: 10, vy: pVy });
  }

  // Gestion Boss
  if (boss) {
    boss.x += boss.vx * boss.dir;
    if (boss.x < 20 || boss.x > canvas.width - boss.w - 20) boss.dir *= -1;

    boss.shootTimer++;
    let bossFreq = difficulty === "FACILE" ? 50 : (difficulty === "DIFFICILE" ? 25 : 35);
    if (boss.shootTimer >= bossFreq) {
      boss.shootTimer = 0;
      enemyBullets.push({ x: boss.x + boss.w / 2 - 4, y: boss.y + boss.h, w: 8, h: 12, vy: 5 });
      if (difficulty === "DIFFICILE") {
        enemyBullets.push({ x: boss.x + 5, y: boss.y + boss.h, w: 4, h: 10, vy: 4 });
        enemyBullets.push({ x: boss.x + boss.w - 10, y: boss.y + boss.h, w: 4, h: 10, vy: 4 });
      }
    }
  }

  // Collisions Balles Joueur -> Ennemis / Boss
  bullets.forEach((b, bi) => {
    if (!b.fromPlayer) return;

    // Boss collision
    if (boss && b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
      boss.hp--;
      bullets.splice(bi, 1);
      playSound('boss_hit');
      if (boss.hp <= 0) {
        score += 500 * currentStage;
        boss = null;
        checkStageClear();
      }
      return;
    }

    // Ennemis collision
    enemies.forEach(e => {
      if (e.alive && b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
        e.alive = false;
        bullets.splice(bi, 1);
        score += 50;
        playSound('hit');
        checkStageClear();
      }
    });
  });

  // Collisions Balles Ennemies -> Joueur
  enemyBullets.forEach((eb, ebi) => {
    if (eb.x < player.x + player.w && eb.x + eb.w > player.x && eb.y < player.y + player.h && eb.y + eb.h > player.y) {
      enemyBullets.splice(ebi, 1);
      lives--;
      playSound('hit');
      if (lives <= 0) {
        gameState = "GAMEOVER";
        playSound('gameover');
        document.getElementById("go-score").textContent = `SCORE FINAL : ${score}`;
        document.getElementById("screen-gameover").classList.remove("hidden");
      }
    }
  });

  // MAJ Interface HUD
  document.getElementById("hud-score").textContent = `SCORE: ${String(score).padStart(6, '0')}`;
  document.getElementById("hud-lives").textContent = '♥'.repeat(Math.max(0, lives));
}

function checkStageClear() {
  let cleared = false;
  if (boss === null && enemies.filter(e => e.alive).length === 0) {
    cleared = true;
  }

  if (cleared) {
    if (gameMode === "ADVENTURE") {
      if (currentStage >= 10) {
        gameState = "VICTORY";
        playSound('victory');
        document.getElementById("vic-score").textContent = `SCORE : ${score}`;
        document.getElementById("screen-victory").classList.remove("hidden");
      } else {
        startStage(currentStage + 1);
      }
    } else {
      // Mode infini
      startStage(currentStage + 1);
    }
  }
}

// --- RENDU GRAPHIQUE ---
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState !== "ADVENTURE" && gameState !== "INFINITE") return;

  // Ligne de sol / scanner rétro
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--txt').trim();
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(10, player.y + player.h + 6);
  ctx.endX = canvas.width - 10;
  ctx.lineTo(canvas.width - 10, player.y + player.h + 6);
  ctx.stroke();

  // Dessin Joueur
  drawSprite(ctx, SPRITES.player, player.x, player.y, 3, getComputedStyle(document.body).getPropertyValue('--txt').trim());

  // Dessin Ennemis
  enemies.forEach(e => {
    if (e.alive) {
      let sprite = e.type === 'alien1' ? SPRITES.alien1 : SPRITES.alien2;
      drawSprite(ctx, sprite, e.x, e.y, 3, getComputedStyle(document.body).getPropertyValue('--txt').trim());
    }
  });

  // Dessin Boss
  if (boss) {
    drawSprite(ctx, SPRITES.boss, boss.x, boss.y, 3, getComputedStyle(document.body).getPropertyValue('--txt').trim());
    // Barre de vie Boss
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--mut').trim();
    ctx.fillRect(boss.x, boss.y - 10, boss.w * 3, 4);
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--txt').trim();
    ctx.fillRect(boss.x, boss.y - 10, (boss.w * 3) * (boss.hp / boss.maxHp), 4);
  }

  // Dessin Projectiles
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--txt').trim();
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
  enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// --- GESTION DES MENUS ---
document.getElementById("start-adventure").addEventListener("click", () => { playSound('shoot'); initGame("ADVENTURE"); });
document.getElementById("start-infinit").addEventListener("click", () => { playSound('shoot'); initGame("INFINITE"); });

document.getElementById("btn-settings").addEventListener("click", () => {
  playSound('shoot');
  document.getElementById("screen-main").classList.add("hidden");
  document.getElementById("screen-settings").classList.remove("hidden");
});

document.getElementById("back-main").addEventListener("click", () => {
  playSound('shoot');
  document.getElementById("screen-settings").classList.add("hidden");
  document.getElementById("screen-main").classList.remove("hidden");
});

document.getElementById("opt-diff").addEventListener("click", () => {
  playSound('shoot');
  if (difficulty === "FACILE") difficulty = "NORMAL";
  else if (difficulty === "NORMAL") difficulty = "DIFFICILE";
  else difficulty = "FACILE";
  document.getElementById("lbl-diff").textContent = difficulty;
});

document.getElementById("opt-sound").addEventListener("click", () => {
  soundOn = !soundOn;
  document.getElementById("lbl-sound").textContent = soundOn ? "ON" : "OFF";
  playSound('shoot');
});

document.getElementById("opt-gb").addEventListener("click", () => {
  gbFilter = !gbFilter;
  document.body.classList.toggle("gameboy-theme", gbFilter);
  document.getElementById("lbl-gb").textContent = gbFilter ? "ON" : "OFF";
  playSound('shoot');
});

document.getElementById("restart-btn").addEventListener("click", () => { playSound('shoot'); initGame(gameMode); });
document.getElementById("vic-restart").addEventListener("click", () => {
  playSound('shoot');
  document.getElementById("screen-victory").classList.add("hidden");
  document.getElementById("screen-main").classList.remove("hidden");
  gameState = "MAIN";
});

// Lancement de la boucle
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
