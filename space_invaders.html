<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07080c">
<title>Space Invaders — Cartridge Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   CARTRIDGE ARCADE — châssis commun des bornes (généré, ne pas éditer
   dans les jeux : modifier src/shell.css puis relancer build.py)
   ===================================================================== */
:root {
  --g: #ffcc00;            /* couleur de la borne (donnée par chaque jeu) */
  --g2: #ff3b6b;           /* couleur secondaire */
  --bg: #07080c;
  --deck: #11131b;
  --line: rgba(255, 255, 255, 0.08);
  --txt: #eef0f6;
  --mut: #8a91a5;
  --px: 'Press Start 2P', ui-monospace, Menlo, monospace;
  --ui: 'Rajdhani', system-ui, -apple-system, sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt); font-family: var(--ui); touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; touch-action: manipulation; }

/* ---------- Fond de salle d'arcade ---------- */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--g) 22%, transparent), transparent 60%),
    radial-gradient(90% 50% at 50% 110%, color-mix(in srgb, var(--g2) 16%, transparent), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 28px),
    var(--bg);
}

/* ---------- Grille principale ---------- */
#cab {
  position: fixed; inset: 0;
  padding: calc(var(--sat) + 6px) calc(var(--sar) + 10px) calc(var(--sab) + 6px) calc(var(--sal) + 10px);
  display: grid; gap: 8px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "mq" "hud" "st" "pad";
  max-width: 560px; margin: 0 auto;
}

/* ---------- Fronton (marquee) ---------- */
.mq { grid-area: mq; display: flex; align-items: center; gap: 8px; min-height: 44px; }
.mq-title {
  flex: 1; min-width: 0; text-align: center; font-family: var(--px); font-size: clamp(11px, 3.6vw, 15px); letter-spacing: 2px;
  color: #fff; text-shadow: 0 0 6px var(--g), 0 0 18px var(--g), 0 2px 0 rgba(0,0,0,.6);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 12px 6px; border-radius: 12px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--g) 18%, #0b0c12), #0b0c12);
  border: 1px solid color-mix(in srgb, var(--g) 45%, transparent);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 0 22px color-mix(in srgb, var(--g) 25%, transparent);
}
.hb {
  flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer;
  display: grid; place-items: center; background: linear-gradient(180deg, #1a1d28, #0e1017); color: var(--txt);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 4px 10px rgba(0,0,0,.4); transition: transform .1s, border-color .15s;
}
.hb svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.hb:hover { border-color: color-mix(in srgb, var(--g) 50%, transparent); }
.hb:active { transform: scale(.94); }
.hb[hidden] { display: none; }

/* ---------- Tableau de score ---------- */
.hud {
  grid-area: hud; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  font-family: var(--px); font-size: clamp(8px, 2.5vw, 10px);
}
.hud > div { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 7px 4px; border-radius: 10px; background: rgba(0,0,0,.35); border: 1px solid var(--line); min-width: 0; }
.hud small { font-size: .78em; color: var(--mut); letter-spacing: 1px; }
.hud b { font-weight: 400; color: #fff; white-space: nowrap; overflow: hidden; max-width: 100%; }
.hud .hi b { color: var(--g); text-shadow: 0 0 8px color-mix(in srgb, var(--g) 60%, transparent); }
.hud b.bump { animation: bump .3s ease-out; }
@keyframes bump { 40% { transform: scale(1.25); } }

/* ---------- Écran + cadre ---------- */
.st { grid-area: st; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
.bezel {
  position: relative; padding: 9px; border-radius: 20px;
  background: linear-gradient(160deg, #262a37, #0c0e14 55%, #171a24);
  box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 18px 40px rgba(0,0,0,.6), 0 0 40px color-mix(in srgb, var(--g) 18%, transparent), inset 0 1px 0 rgba(255,255,255,.1);
}
.screen { position: relative; overflow: hidden; border-radius: 12px; background: #000; box-shadow: inset 0 0 0 2px rgba(0,0,0,.8); }
.screen canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
/* Effet tube cathodique */
.screen .crt { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
body.crt-on .screen .crt {
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
    radial-gradient(120% 100% at 50% 50%, transparent 62%, rgba(0,0,0,.55) 100%);
  mix-blend-mode: multiply;
}
body.crt-on .screen .crt::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 18%, transparent 82%, rgba(255,255,255,.03));
  animation: flicker 4s steps(2) infinite;
}
@keyframes flicker { 50% { opacity: .7; } }

/* ---------- Écrans superposés (titre, pause, fin) ---------- */
.ov {
  position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 16px; text-align: center; background: rgba(4, 5, 9, .84); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  font-family: var(--px); overflow-y: auto;
}
.ov[hidden] { display: none; }
.ov-logo { font-size: clamp(16px, 6vw, 26px); line-height: 1.25; color: #fff; text-shadow: 0 0 8px var(--g), 0 0 22px var(--g), 3px 3px 0 var(--g2); letter-spacing: 1px; }
.ov-sub { font-size: 8px; letter-spacing: 3px; color: var(--g); }
.ov-big { font-size: clamp(18px, 7vw, 28px); color: #fff; text-shadow: 0 0 14px var(--g); }
.ov-line { font-size: 9px; color: var(--mut); line-height: 1.8; }
.ov-line b { color: #fff; font-weight: 400; }
.ov-badge { font-size: 9px; padding: 7px 10px; border-radius: 8px; color: #111; background: var(--g); box-shadow: 0 0 18px var(--g); animation: blink .7s steps(1) infinite; }
.ov-coins { font-size: 11px; color: #ffd84a; text-shadow: 0 0 10px rgba(255, 200, 0, .6); min-height: 14px; }
.ov-coins.pop { animation: bump .45s ease-out; }
.ov-missions { display: flex; flex-direction: column; gap: 4px; font-size: 7px; color: #9ef0b8; line-height: 1.6; }
.ov-btns { display: flex; flex-direction: column; gap: 8px; width: min(240px, 100%); }
.btn {
  border: 0; cursor: pointer; padding: 13px 10px; border-radius: 10px; font-family: var(--px); font-size: 10px; letter-spacing: 1px;
  color: #111; background: var(--g); box-shadow: 0 4px 0 color-mix(in srgb, var(--g) 50%, #000), 0 0 22px color-mix(in srgb, var(--g) 40%, transparent);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--g) 50%, #000); }
.btn.sec { color: var(--txt); background: #1b1e29; box-shadow: 0 4px 0 #07080c; border: 1px solid var(--line); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 300px; }
.opt { border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--mut); padding: 8px 9px; border-radius: 8px; font-family: var(--px); font-size: 7px; cursor: pointer; }
.opt b { color: #fff; font-weight: 400; }
.opt:active { transform: scale(.96); }
.blink { animation: blink 1s steps(1) infinite; font-size: 8px; color: var(--g); letter-spacing: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.help { font-size: 8px; color: var(--mut); line-height: 1.9; max-width: 290px; }
.toast-c { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 3; pointer-events: none; font-family: var(--px); font-size: clamp(12px, 4vw, 16px); color: var(--g); text-shadow: 0 0 10px var(--g), 2px 2px 0 #000; white-space: nowrap; }
.toast-c[hidden] { display: none; }

/* ---------- Pupitre tactile ---------- */
.pad { grid-area: pad; display: none; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 6px 2px; }
.pad-l, .pad-r { display: flex; align-items: center; justify-content: center; }
.pad-r { gap: 16px; }
.pad.solo { justify-content: center; }
.pad.solo .dpad { transform: scale(1.12); margin: 8px 0; }
@media (hover: none), (pointer: coarse) { .pad { display: flex; } .keys { display: none !important; } }
body.touch .pad { display: flex; }
body.touch .keys { display: none !important; }

/* Croix directionnelle (on peut glisser le pouce d'une direction à l'autre) */
.dpad { position: relative; width: 150px; height: 150px; touch-action: none; flex: none; }
.dpad::before, .dpad::after {
  content: ""; position: absolute; border-radius: 12px;
  background: linear-gradient(180deg, #2a2e3c, #161924); border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 6px 0 #05060a, 0 10px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
}
.dpad::before { left: 50px; top: 0; width: 50px; height: 150px; }
.dpad::after { top: 50px; left: 0; width: 150px; height: 50px; }
.dpad.h::before { display: none; }
.dpad.v::after { display: none; }
.dpad.h { height: 60px; } .dpad.h::after { top: 5px; }
.dpad.v { width: 70px; } .dpad.v::before { left: 10px; }
.dpad i { position: absolute; z-index: 1; width: 50px; height: 50px; display: grid; place-items: center; pointer-events: none; color: rgba(255,255,255,.55); transition: color .08s, transform .08s; }
.dpad i::before { content: ""; width: 0; height: 0; border: 9px solid transparent; }
.dpad .u { left: 50px; top: 0; } .dpad .u::before { border-bottom-color: currentColor; border-top: 0; }
.dpad .d { left: 50px; bottom: 0; } .dpad .d::before { border-top-color: currentColor; border-bottom: 0; }
.dpad .l { left: 0; top: 50px; } .dpad .l::before { border-right-color: currentColor; border-left: 0; }
.dpad .r { right: 0; top: 50px; } .dpad .r::before { border-left-color: currentColor; border-right: 0; }
.dpad.h .l, .dpad.h .r { top: 5px; }
.dpad.v .u, .dpad.v .d { left: 10px; }
.dpad i.on { color: var(--g); transform: scale(.88); filter: drop-shadow(0 0 6px var(--g)); }
.dpad.h .u, .dpad.h .d, .dpad.v .l, .dpad.v .r { display: none; }

/* Boutons d'arcade ronds */
.abtn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; touch-action: none; border: 0; background: none; padding: 0; cursor: pointer; }
.abtn span {
  width: 72px; height: 72px; border-radius: 50%; display: block;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c, var(--g2)) 70%, #fff) 0 12%, var(--c, var(--g2)) 45%, color-mix(in srgb, var(--c, var(--g2)) 55%, #000) 100%);
  box-shadow: 0 7px 0 color-mix(in srgb, var(--c, var(--g2)) 35%, #000), 0 12px 20px rgba(0,0,0,.55), inset 0 -4px 8px rgba(0,0,0,.25);
  transition: transform .06s, box-shadow .06s;
}
.abtn.sm span { width: 58px; height: 58px; }
.abtn small { font-family: var(--px); font-size: 7px; color: var(--mut); letter-spacing: 1px; }
.abtn.on span { transform: translateY(5px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c, var(--g2)) 35%, #000), 0 4px 10px rgba(0,0,0,.5); }
.abtn[hidden] { display: none; }

/* Aide clavier (PC) */
.keys { grid-area: pad; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 12px; font-family: var(--px); font-size: 7px; color: var(--mut); padding: 4px 0 2px; }
.keys kbd { font-family: var(--px); font-size: 7px; color: #fff; padding: 4px 6px; border-radius: 5px; background: #1b1e29; border: 1px solid var(--line); box-shadow: 0 2px 0 #05060a; }

/* ---------- Téléphone couché : manettes de chaque côté ---------- */
@media (orientation: landscape) and (max-height: 560px) and (pointer: coarse) {
  #cab {
    max-width: none; gap: 6px 10px;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "mq hud hud" "pl st pr";
  }
  .mq { min-height: 36px; } .hb { width: 36px; height: 36px; }
  .mq-title { padding: 8px 6px; font-size: 10px; }
  .hud { grid-template-columns: repeat(3, auto); align-self: center; }
  .hud > div { flex-direction: row; padding: 6px 10px; }
  .pad { display: contents !important; }
  .pad-l { grid-area: pl; } .pad-r { grid-area: pr; flex-direction: row-reverse; }
  .keys { display: none !important; }
}
/* ---------- Grand écran PC : un peu plus d'air ---------- */
@media (min-width: 900px) and (min-height: 700px) {
  #cab { max-width: 760px; padding-top: 18px; padding-bottom: 14px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

</style>
</head>
<body>
<script>
/* =====================================================================
   CARTRIDGE ARCADE — moteur commun des bornes
   - boucle à pas fixe (même vitesse sur un écran 60 Hz ou 120 Hz)
   - écran net sur Retina, mis à l'échelle sans déformation
   - croix tactile glissable, boutons ronds, clavier, glisser sur l'écran
   - écrans Titre / Pause / Fin, options enregistrées, son 8-bit
   - plein écran (PC, Android, iPad) et dialogue avec l'app Cartridge :
       jeu → app : cartridge:ready | score | gameover | close
       app → jeu : cartridge:init {best} | reward {coins, record, missions} | pause
   ===================================================================== */
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const EMBED = window.parent !== window;
  const SVG = {
    x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',
    full: '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    exit: '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  };

  const CX = (window.CX = {
    state: "boot", input: { up: 0, down: 0, left: 0, right: 0, a: 0, b: 0 },
    opts: {}, best: 0, score: 0, time: 0, scale: 1,
  });
  let G = null; // configuration du jeu
  let ctx, canvas, dpr = 1;

  // -------------------------------------------------------------------
  // SON — une seule puce audio, débloquée au premier geste (obligatoire sur iOS)
  // -------------------------------------------------------------------
  let ac = null, master = null, noiseBuf = null;
  function audio() {
    if (!ac) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      ac = new A(); master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  CX.tone = function (f, d = 0.1, type = "square", v = 0.08, f2 = null, delay = 0) {
    if (!CX.opts.sound) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  };
  CX.noise = function (d = 0.2, v = 0.12, delay = 0, hp = 600) {
    if (!CX.opts.sound) return;
    const a = audio(); if (!a) return;
    try {
      const t = a.currentTime + delay, s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
      s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = hp;
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.02);
    } catch (e) {}
  };
  CX.melody = function (notes, step = 0.09, type = "square", v = 0.07) {
    notes.forEach((f, i) => f && CX.tone(f, step * 0.95, type, v, null, i * step));
  };
  CX.buzz = function (ms = 15) { try { if (CX.opts.vibe !== false && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

  // -------------------------------------------------------------------
  // STOCKAGE
  // -------------------------------------------------------------------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  CX.store = store;

  // -------------------------------------------------------------------
  // CONSTRUCTION DE LA BORNE
  // -------------------------------------------------------------------
  function build() {
    document.documentElement.style.setProperty("--g", G.color);
    document.documentElement.style.setProperty("--g2", G.color2 || "#ff3b6b");
    const c = G.controls || {};
    const btn = (id, label, cls, color) =>
      label ? `<button class="abtn ${cls || ""}" id="${id}" type="button" aria-label="${label}" ${color ? `style="--c:${color}"` : ""}><span></span><small>${label}</small></button>` : "";
    document.body.insertAdjacentHTML("afterbegin", `
      <div id="cab">
        <div class="mq">
          <button class="hb" id="hbQuit" type="button" aria-label="Quitter">${SVG.x}</button>
          <div class="mq-title">${G.title}</div>
          <button class="hb" id="hbPause" type="button" aria-label="Pause">${SVG.pause}</button>
          <button class="hb" id="hbFull" type="button" aria-label="Plein écran" hidden>${SVG.full}</button>
        </div>
        <div class="hud">
          <div><small>SCORE</small><b id="hudScore">0</b></div>
          <div class="hi"><small>HI-SCORE</small><b id="hudHi">0</b></div>
          <div><small id="hudXl">${G.hudLabel || "VIES"}</small><b id="hudX">-</b></div>
        </div>
        <div class="st"><div class="bezel"><div class="screen" id="screen">
          <canvas id="cv"></canvas><div class="crt"></div>
          <div class="toast-c" id="toastC" hidden></div>
          <div class="ov" id="ovTitle" hidden></div>
          <div class="ov" id="ovPause" hidden></div>
          <div class="ov" id="ovOver" hidden></div>
        </div></div></div>
        <div class="pad${c.a || c.b ? "" : " solo"}">
          <div class="pad-l">${c.dpad ? `<div class="dpad ${c.dpad === "h" ? "h" : c.dpad === "v" ? "v" : ""}" id="dpad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>` : ""}</div>
          <div class="pad-r">${btn("btnB", c.b, "sm", c.bColor || "#3b82f6")}${btn("btnA", c.a, "", c.aColor)}</div>
        </div>
        <div class="keys">${(G.keys || []).map(([k, t]) => `<span><kbd>${k}</kbd> ${t}</span>`).join("")}<span><kbd>P</kbd> pause</span></div>
      </div>`);
    canvas = $("#cv"); ctx = canvas.getContext("2d");
    CX.ctx = ctx; CX.canvas = canvas;
  }

  // Mise à l'échelle : le jeu dessine toujours en W×H « logiques »
  function fit() {
    const st = $(".st"), bz = $(".bezel");
    const pad = 18; // padding du cadre ×2
    const aw = Math.max(50, st.clientWidth - pad), ah = Math.max(50, st.clientHeight - pad);
    const s = Math.min(aw / G.W, ah / G.H);
    const cw = Math.floor(G.W * s), ch = Math.floor(G.H * s);
    dpr = Math.min(3, window.devicePixelRatio || 1);
    canvas.style.width = cw + "px"; canvas.style.height = ch + "px";
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    CX.scale = s;
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    bz.style.width = cw + pad + "px";
    if (CX.state !== "play" && G.draw) G.draw(ctx, 0);
  }

  // -------------------------------------------------------------------
  // OPTIONS (son, écran cathodique, vibrations + options du jeu)
  // -------------------------------------------------------------------
  function loadOpts() {
    const saved = store.get(`cxarc_${G.id}_opt`, {});
    const defs = [
      { id: "sound", label: "SON", values: [true, false], names: ["ON", "OFF"] },
      { id: "crt", label: "ÉCRAN CRT", values: [true, false], names: ["ON", "OFF"], def: G.crt !== undefined ? G.crt : true },
      ...(G.options || []),
    ];
    CX.optDefs = defs;
    defs.forEach((d) => { CX.opts[d.id] = d.values.includes(saved[d.id]) ? saved[d.id] : (d.def !== undefined ? d.def : d.values[0]); });
    applyOpts();
  }
  function applyOpts() {
    document.body.classList.toggle("crt-on", !!CX.opts.crt);
    store.set(`cxarc_${G.id}_opt`, CX.opts);
    if (G.onOptions) G.onOptions(CX.opts);
  }
  function optsHTML() {
    return `<div class="opts">${CX.optDefs.map((d) => {
      const i = d.values.indexOf(CX.opts[d.id]);
      return `<button class="opt" type="button" data-opt="${d.id}">${d.label} : <b>${(d.names || d.values)[i]}</b></button>`;
    }).join("")}</div>`;
  }
  function bindOpts(root) {
    root.querySelectorAll("[data-opt]").forEach((b) => b.addEventListener("click", () => {
      const d = CX.optDefs.find((x) => x.id === b.dataset.opt);
      const i = (d.values.indexOf(CX.opts[d.id]) + 1) % d.values.length;
      CX.opts[d.id] = d.values[i];
      applyOpts();
      b.querySelector("b").textContent = (d.names || d.values)[i];
      CX.tone(660, 0.05, "square", 0.06);
    }));
  }

  // -------------------------------------------------------------------
  // ÉCRANS
  // -------------------------------------------------------------------
  const pad6 = (n) => String(Math.max(0, Math.floor(n))).padStart(G.scoreDigits || 6, "0");
  function showTitle() {
    CX.state = "title";
    hide("#ovPause"); hide("#ovOver");
    const o = $("#ovTitle");
    o.innerHTML = `
      <div class="ov-logo">${G.logo || G.title}</div>
      <div class="ov-sub">ÉDITION CARTRIDGE</div>
      <div class="ov-line">HI-SCORE <b>${pad6(CX.best)}</b></div>
      <div class="ov-btns"><button class="btn" id="bStart" type="button">▶ JOUER</button></div>
      ${optsHTML()}
      <div class="help">${G.help || ""}</div>
      <div class="blink">INSERT COIN</div>`;
    o.hidden = false;
    bindOpts(o);
    $("#bStart").addEventListener("click", start);
    if (G.onTitle) G.onTitle();
  }
  function start() {
    audio();
    hide("#ovTitle"); hide("#ovOver"); hide("#ovPause");
    CX.score = 0; CX.setScore(0, true);
    CX.state = "play";
    G.start();
    post({ type: "cartridge:start" });
  }
  CX.restart = start;
  function pause(on) {
    if (on && CX.state === "play") {
      CX.state = "pause";
      const o = $("#ovPause");
      o.innerHTML = `<div class="ov-big">PAUSE</div>
        <div class="ov-btns"><button class="btn" id="bResume" type="button">▶ REPRENDRE</button>
        <button class="btn sec" id="bRetry" type="button">RECOMMENCER</button>
        <button class="btn sec" id="bMenu" type="button">MENU</button></div>${optsHTML()}`;
      o.hidden = false; bindOpts(o);
      $("#bResume").onclick = () => pause(false);
      $("#bRetry").onclick = start;
      $("#bMenu").onclick = showTitle;
      clearInput();
      if (G.onPause) G.onPause(true);
    } else if (!on && CX.state === "pause") {
      hide("#ovPause"); CX.state = "play"; last = performance.now();
      if (G.onPause) G.onPause(false);
    }
  }
  CX.pause = pause;
  function hide(s) { const e = $(s); if (e) e.hidden = true; }

  // Fin de partie : record local, envoi à l'app, attente des pièces gagnées
  CX.gameOver = function (stats = {}) {
    if (CX.state === "over") return;
    CX.state = "over";
    clearInput();
    const score = Math.floor(CX.score);
    const record = score > 0 && score > CX.best;
    if (record) { CX.best = score; store.set(`cxarc_${G.id}_pb`, score); $("#hudHi").textContent = pad6(score); }
    post({ type: "cartridge:score", game: G.name, score });
    post({ type: "cartridge:gameover", game: G.name, id: G.id, score, stats });
    const o = $("#ovOver");
    o.innerHTML = `
      <div class="ov-big">${stats.title || "GAME OVER"}</div>
      ${record ? `<div class="ov-badge">★ NOUVEAU RECORD ★</div>` : ""}
      <div class="ov-line">SCORE</div>
      <div class="ov-logo" style="font-size:clamp(16px,6vw,24px)">${pad6(score)}</div>
      ${stats.line ? `<div class="ov-line">${stats.line}</div>` : ""}
      <div class="ov-coins" id="ovCoins">${EMBED ? "" : ""}</div>
      <div class="ov-missions" id="ovMissions"></div>
      <div class="ov-btns">
        <button class="btn" id="bAgain" type="button">↻ REJOUER</button>
        <button class="btn sec" id="bMenu2" type="button">MENU</button>
        <button class="btn sec" id="bQuit2" type="button">QUITTER</button>
      </div>`;
    setTimeout(() => { if (CX.state === "over") o.hidden = false; }, stats.delay || 600);
    $("#bAgain").onclick = start;
    $("#bMenu2").onclick = showTitle;
    $("#bQuit2").onclick = quit;
    if (record) setTimeout(() => CX.melody([523, 659, 784, 1047, 784, 1047], 0.1, "square", 0.08), 650);
  };

  // Score
  let lastPost = 0, postTimer = null;
  CX.setScore = function (n, silent) {
    CX.score = n;
    const el = $("#hudScore");
    el.textContent = pad6(n);
    if (!silent) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    if (n > CX.best) $("#hudHi").textContent = pad6(n);
    const now = Date.now();
    clearTimeout(postTimer);
    if (n > 0) {
      if (now - lastPost > 400) { lastPost = now; post({ type: "cartridge:score", game: G.name, score: Math.floor(n) }); }
      else postTimer = setTimeout(() => { lastPost = Date.now(); post({ type: "cartridge:score", game: G.name, score: Math.floor(CX.score) }); }, 450);
    }
  };
  CX.addScore = (n) => CX.setScore(CX.score + n);
  CX.setHud = function (v, label) { $("#hudX").textContent = v; if (label) $("#hudXl").textContent = label; };

  // Message central (READY!, NIVEAU 2…)
  let toastT = null;
  CX.toast = function (txt, ms = 1500) {
    const t = $("#toastC"); t.textContent = txt; t.hidden = !txt;
    clearTimeout(toastT); if (txt && ms) toastT = setTimeout(() => (t.hidden = true), ms);
  };

  // -------------------------------------------------------------------
  // DIALOGUE AVEC L'APP CARTRIDGE
  // -------------------------------------------------------------------
  function post(m) { if (EMBED) try { window.parent.postMessage(m, "*"); } catch (e) {} }
  CX.post = post;
  window.addEventListener("message", (e) => {
    const d = e.data; if (!d || typeof d !== "object") return;
    if (d.type === "cartridge:init") {
      const b = Number(d.best);
      if (Number.isFinite(b) && b > CX.best) { CX.best = b; $("#hudHi").textContent = pad6(b); if (CX.state === "title") showTitle(); }
    } else if (d.type === "cartridge:reward") {
      const c = $("#ovCoins"), m = $("#ovMissions");
      if (c && d.coins > 0) { c.textContent = `+${d.coins} PIÈCES`; c.classList.add("pop"); CX.melody([988, 1319], 0.08, "square", 0.06); }
      else if (c && d.capped) c.textContent = "LIMITE DE PIÈCES DU JOUR ATTEINTE";
      if (m && Array.isArray(d.missions)) m.innerHTML = d.missions.map((x) => `✔ ${String(x).replace(/[<>&]/g, "")}`).join("<br>");
    } else if (d.type === "cartridge:pause") pause(true);
  });
  function quit() {
    if (EMBED) post({ type: "cartridge:close" });
    else if (history.length > 1) history.back();
    else location.href = "./";
  }

  // Plein écran : PC, Android, iPad (l'iPhone ne le permet pas → bouton caché ;
  // l'app installée sur l'écran d'accueil est déjà en plein écran)
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const fsOK = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  function toggleFull() {
    const de = document.documentElement;
    try {
      if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (de.requestFullscreen || de.webkitRequestFullscreen).call(de, { navigationUI: "hide" });
    } catch (e) {}
  }
  function fsIcon() { $("#hbFull").innerHTML = fsEl() ? SVG.exit : SVG.full; setTimeout(fit, 120); }

  // -------------------------------------------------------------------
  // COMMANDES
  // -------------------------------------------------------------------
  function press(k) {
    if (CX.input[k]) return;
    CX.input[k] = 1;
    if (CX.state === "play" && G.onPress) G.onPress(k);
  }
  function release(k) { if (!CX.input[k]) return; CX.input[k] = 0; if (G.onRelease) G.onRelease(k); }
  function clearInput() { Object.keys(CX.input).forEach((k) => (CX.input[k] = 0)); document.querySelectorAll(".dpad i.on,.abtn.on").forEach((e) => e.classList.remove("on")); }
  CX.press = press; CX.release = release;

  const KEYMAP = {
    ArrowUp: "up", KeyW: "up", KeyZ: "up", ArrowDown: "down", KeyS: "down",
    ArrowLeft: "left", KeyA: "left", KeyQ: "left", ArrowRight: "right", KeyD: "right",
    Space: "a", Enter: "a", KeyK: "a", KeyX: "a", ShiftLeft: "b", ShiftRight: "b", KeyC: "b", KeyJ: "b",
  };
  function bindKeys() {
    window.addEventListener("keydown", (e) => {
      audio();
      if (e.code === "KeyP" || e.code === "Escape") { e.preventDefault(); if (CX.state === "play") pause(true); else if (CX.state === "pause") pause(false); return; }
      if (CX.state === "title" && (e.code === "Enter" || e.code === "Space")) { e.preventDefault(); start(); return; }
      if (CX.state === "over" && e.code === "Enter") { e.preventDefault(); start(); return; }
      if (CX.state === "pause" && e.code === "Enter") { e.preventDefault(); pause(false); return; }
      const remap = G.keymap && G.keymap[e.code];
      const k = remap || KEYMAP[e.code];
      if (!k) return;
      e.preventDefault();
      if (e.repeat) return;
      press(k);
    });
    window.addEventListener("keyup", (e) => {
      const k = (G.keymap && G.keymap[e.code]) || KEYMAP[e.code];
      if (k) release(k);
    });
  }

  function bindPad() {
    const dp = $("#dpad");
    if (dp) {
      const mode = G.controls.dpad;
      let cur = null;
      const set = (dir) => {
        if (dir === cur) return;
        if (cur) { release(cur); dp.querySelector("." + cur[0]).classList.remove("on"); }
        cur = dir;
        if (dir) { press(dir); dp.querySelector("." + dir[0]).classList.add("on"); CX.buzz(8); }
      };
      const pick = (e) => {
        const r = dp.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        const dead = Math.min(r.width, r.height) * 0.12;
        if (Math.hypot(dx, dy) < dead) return set(null);
        if (mode === "h") return set(dx < 0 ? "left" : "right");
        if (mode === "v") return set(dy < 0 ? "up" : "down");
        set(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down"));
      };
      dp.addEventListener("pointerdown", (e) => { e.preventDefault(); audio(); try { dp.setPointerCapture(e.pointerId); } catch (_) {} pick(e); });
      dp.addEventListener("pointermove", (e) => { if (cur !== null || e.buttons) pick(e); });
      const end = () => set(null);
      dp.addEventListener("pointerup", end); dp.addEventListener("pointercancel", end); dp.addEventListener("lostpointercapture", end);
    }
    [["#btnA", "a"], ["#btnB", "b"]].forEach(([s, k]) => {
      const b = $(s); if (!b) return;
      b.addEventListener("pointerdown", (e) => { e.preventDefault(); audio(); try { b.setPointerCapture(e.pointerId); } catch (_) {} b.classList.add("on"); press(k); CX.buzz(12); });
      const up = () => { b.classList.remove("on"); release(k); };
      b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("lostpointercapture", up);
    });

    // Glisser / toucher directement l'écran de jeu
    const sc = $("#screen");
    let sx = 0, sy = 0, down = false, swiped = false, t0 = 0;
    const logical = (e) => { const r = canvas.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * G.W, y: ((e.clientY - r.top) / r.height) * G.H }; };
    sc.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".ov")) return;
      audio(); down = true; swiped = false; sx = e.clientX; sy = e.clientY; t0 = Date.now();
      try { sc.setPointerCapture(e.pointerId); } catch (_) {}
      if (CX.state === "play" && G.onDrag) { const p = logical(e); G.onDrag(p.x, p.y, "start"); }
    });
    sc.addEventListener("pointermove", (e) => {
      if (!down || CX.state !== "play") return;
      if (G.onDrag) { const p = logical(e); G.onDrag(p.x, p.y, "move"); }
      if (G.onSwipe) {
        const dx = e.clientX - sx, dy = e.clientY - sy, th = G.swipeStep || 26;
        if (Math.hypot(dx, dy) >= th) {
          G.onSwipe(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down"), Math.abs(dy) > Math.abs(dx) ? dy : dx);
          swiped = true; sx = e.clientX; sy = e.clientY;
        }
      }
    });
    const upS = (e) => {
      if (!down) return; down = false;
      if (CX.state !== "play") return;
      if (G.onDrag) { const p = logical(e); G.onDrag(p.x, p.y, "end"); }
      if (!swiped && Date.now() - t0 < 300 && G.onTap) G.onTap();
    };
    sc.addEventListener("pointerup", upS); sc.addEventListener("pointercancel", () => { down = false; });

    window.addEventListener("touchstart", () => document.body.classList.add("touch"), { once: true, passive: true });
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.addEventListener("dblclick", (e) => e.preventDefault());
    document.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  // -------------------------------------------------------------------
  // BOUCLE À PAS FIXE (60 mises à jour par seconde, quel que soit l'écran)
  // -------------------------------------------------------------------
  const STEP = 1 / 60;
  let last = 0, acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.25) dt = 0.25;
    CX.time += dt;
    if (CX.state === "play") {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 6) { G.update(STEP); acc -= STEP; n++; if (CX.state !== "play") break; }
      if (n === 6) acc = 0;
    } else acc = 0;
    G.draw(ctx, dt);
  }

  // -------------------------------------------------------------------
  // DÉMARRAGE
  // -------------------------------------------------------------------
  CX.boot = function (cfg) {
    G = cfg;
    build();
    loadOpts();
    CX.best = Number(store.get(`cxarc_${G.id}_pb`, 0)) || 0;
    $("#hudHi").textContent = pad6(CX.best);
    $("#hudScore").textContent = pad6(0);
    bindKeys(); bindPad();
    $("#hbQuit").onclick = quit;
    $("#hbPause").onclick = () => (CX.state === "play" ? pause(true) : CX.state === "pause" ? pause(false) : null);
    if (fsOK()) { $("#hbFull").hidden = false; $("#hbFull").onclick = toggleFull; }
    document.addEventListener("fullscreenchange", fsIcon); document.addEventListener("webkitfullscreenchange", fsIcon);
    document.addEventListener("visibilitychange", () => { if (document.hidden) pause(true); });
    window.addEventListener("blur", () => pause(true));
    window.addEventListener("resize", fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe($(".st"));
    if (G.init) G.init();
    fit();
    showTitle();
    last = performance.now();
    requestAnimationFrame(frame);
    post({ type: "cartridge:ready", game: G.name, id: G.id });
    // Les polices pixel arrivent parfois après : on redessine
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => G.draw(ctx, 0));
  };
})();

</script>
<script>
/* SPACE INVADERS — Édition Cartridge
   Escadrille qui avance par à-coups et accélère quand elle se vide,
   marche à 4 notes, boucliers destructibles, soucoupe mystère, bonus
   (tir double, bouclier, vie), maintien du bouton pour tirer en rafale. */
(function () {
  const W = 300, H = 400, GROUND = H - 22;
  const SPR = {
    a1: ["00011000", "00111100", "01111110", "11011011", "11111111", "00100100", "01011010", "10100101"],
    a2: ["00011000", "00111100", "01111110", "11011011", "11111111", "01011010", "10000001", "01000010"],
    b1: ["00100000100", "00010001000", "00111111100", "01101110110", "11111111111", "10111111101", "10100000101", "00011011000"],
    b2: ["00100000100", "10010001001", "10111111101", "11101110111", "11111111111", "01111111110", "00100000100", "01000000010"],
    c1: ["000011110000", "011111111110", "111111111111", "111001100111", "111111111111", "000110011000", "001101101100", "110000000011"],
    c2: ["000011110000", "011111111110", "111111111111", "111001100111", "111111111111", "001110011100", "011001100110", "001100001100"],
    ship: ["0000010000", "0000111000", "0000111000", "0111111110", "1111111111", "1111111111", "1111111111"],
    ufo: ["0000011111100000", "0001111111111000", "0011111111111100", "0110110110110110", "1111111111111111", "0011100110011100", "0001000000001000"],
  };
  const ROWS = [["a", 30, "#ff5bd1"], ["b", 20, "#25f4ff"], ["b", 20, "#25f4ff"], ["c", 10, "#39ff88"], ["c", 10, "#39ff88"]];
  const COLS = 9, SC = 2;
  let ship, shots, bombs, aliens, dirX, stepT, stepIdx, frame2, ufo, ufoT, shields, pows, power, powerT, wave, lives, parts, stars, fireHeld, fireCd, deadT, extraAt, killed, shake;

  function sprite(c, m, x, y, s, col) {
    c.fillStyle = col;
    for (let r = 0; r < m.length; r++) for (let i = 0; i < m[r].length; i++) if (m[r][i] === "1") c.fillRect(x + i * s, y + r * s, s, s);
  }
  function makeShields() {
    shields = [];
    const shape = ["0011111100", "0111111110", "1111111111", "1111111111", "1110000111", "1100000011"];
    for (let k = 0; k < 4; k++) {
      const bx = 30 + k * 72, by = GROUND - 62;
      shape.forEach((row, r) => [...row].forEach((v, i) => { if (v === "1") shields.push({ x: bx + i * 4, y: by + r * 4, hp: 2 }); }));
    }
  }
  function newWave() {
    aliens = [];
    const top = 44 + Math.min(5, wave - 1) * 10;
    ROWS.forEach(([t, pts, col], r) => {
      for (let i = 0; i < COLS; i++) {
        const w = t === "a" ? 16 : t === "b" ? 22 : 24;
        aliens.push({ t, pts, col, x: 22 + i * 28 + (24 - w) / 2, y: top + r * 22, w, h: 16, alive: true });
      }
    });
    dirX = 1; stepT = 0; stepIdx = 0; frame2 = 0; shots = []; bombs = []; pows = [];
    ufo = null; ufoT = 12 + Math.random() * 10;
    makeShields();
    CX.toast(`VAGUE ${wave}`, 1300);
    hud();
  }
  function hud() { CX.setHud("♥".repeat(Math.max(0, lives)) + ` V${wave}`); }
  const alive = () => aliens.filter((a) => a.alive);

  function fire() {
    if (deadT > 0 || fireCd > 0) return;
    const max = power === "DOUBLE" ? 4 : 2;
    if (shots.length >= max) return;
    if (power === "DOUBLE") { shots.push({ x: ship.x - 7, y: ship.y - 4 }, { x: ship.x + 7, y: ship.y - 4 }); }
    else shots.push({ x: ship.x, y: ship.y - 6 });
    fireCd = 0.18;
    CX.tone(1200, 0.07, "square", 0.05, 300);
  }
  function boom(x, y, col, n = 14) {
    for (let i = 0; i < n; i++) { const a = Math.random() * 7, s = 30 + Math.random() * 110; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.35, col }); }
  }
  function hitShield(x, y, r = 4) {
    for (const s of shields) if (s.hp > 0 && x > s.x - r && x < s.x + 4 + r && y > s.y - 2 && y < s.y + 6) { s.hp--; return true; }
    return false;
  }
  function loseLife() {
    lives--; hud(); deadT = 1.6; bombs = []; CX.buzz(150);
    boom(ship.x, ship.y, "#ffd21f", 30); shake = 8;
    CX.noise(0.7, 0.18, 0, 200); CX.tone(400, 0.8, "sawtooth", 0.06, 60);
    const run = G._run;
    if (lives <= 0) setTimeout(() => run === G._run && (CX.state === "play" || CX.state === "pause") && CX.gameOver({ line: `VAGUE <b>${wave}</b> · ${killed} ENVAHISSEURS`, wave, delay: 200 }), 900);
  }

  const G = {
    id: "invaders", name: "Space Invaders", title: "SPACE INVADERS", logo: "SPACE<br>INVADERS", color: "#39ff88", color2: "#ff5bd1",
    W, H, hudLabel: "VIES · VAGUE",
    controls: { dpad: "h", a: "TIR", aColor: "#ff3b3b" },
    options: [{ id: "diff", label: "DIFFICULTÉ", values: ["FACILE", "NORMAL", "DIFFICILE"], def: "NORMAL" }],
    keys: [["← →", "bouger"], ["ESPACE", "tirer (maintenu = rafale)"]],
    help: "Détruis l'escadrille avant qu'elle n'atterrisse.<br>Maintiens TIR pour une rafale.<br>Abats la soucoupe pour un bonus mystère !",
    init() {
      stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.2 + 0.3, v: 4 + Math.random() * 14 }));
      wave = 1; lives = 3; parts = []; ship = { x: W / 2, y: GROUND - 12 }; newWave();
    },
    start() {
      G._run = (G._run || 0) + 1;
      wave = 1; lives = 3; killed = 0; parts = []; power = null; powerT = 0; fireCd = 0; deadT = 0; extraAt = 1500; shake = 0;
      ship = { x: W / 2, y: GROUND - 12 }; newWave();
    },
    onPress(k) { if (k === "a") fire(); },
    onTap() { fire(); },
    onDrag(x, y, ph) { if (ph !== "end") G._drag = x; else G._drag = null; },
    update(dt) {
      const diff = { FACILE: 0.75, NORMAL: 1, DIFFICILE: 1.3 }[CX.opts.diff] || 1;
      fireCd -= dt; if (powerT > 0) { powerT -= dt; if (powerT <= 0) power = null; }
      if (deadT > 0) { deadT -= dt; if (deadT <= 0 && lives > 0) ship.x = W / 2; }
      else {
        const k = (CX.input.right ? 1 : 0) - (CX.input.left ? 1 : 0);
        if (k) ship.x += k * 160 * dt;
        else if (G._drag != null) ship.x += Math.max(-200 * dt, Math.min(200 * dt, G._drag - ship.x));
        ship.x = Math.max(14, Math.min(W - 14, ship.x));
        if (CX.input.a) fire();
      }
      // tirs du joueur
      shots.forEach((s) => (s.y -= 330 * dt));
      shots = shots.filter((s) => {
        if (s.y < 20) return false;
        if (hitShield(s.x, s.y, 1)) return false;
        for (const a of aliens) if (a.alive && s.x > a.x - 1 && s.x < a.x + a.w + 1 && s.y > a.y && s.y < a.y + a.h) {
          a.alive = false; killed++; CX.addScore(a.pts * (1 + Math.floor((wave - 1) / 3)));
          boom(a.x + a.w / 2, a.y + a.h / 2, a.col); CX.noise(0.15, 0.1, 0, 1200); CX.buzz(8);
          if (Math.random() < 0.06) pows.push({ x: a.x + a.w / 2, y: a.y, t: ["DOUBLE", "SHIELD", "LIFE"][Math.floor(Math.random() * 2.3)] });
          return false;
        }
        if (ufo && s.x > ufo.x && s.x < ufo.x + 32 && s.y > ufo.y && s.y < ufo.y + 14) {
          const pts = [50, 100, 150, 300][(Math.random() * 4) | 0];
          CX.addScore(pts); CX.toast(String(pts), 900); boom(ufo.x + 16, ufo.y + 7, "#ff3b3b", 24); ufo = null;
          CX.melody([880, 1175, 1568], 0.06, "square", 0.07); return false;
        }
        return true;
      });
      // escadrille : avance par à-coups, plus vite quand il en reste peu
      const al = alive();
      if (!al.length) { wave++; CX.melody([523, 659, 784, 1047, 1319], 0.08, "square", 0.07); newWave(); return; }
      const interval = Math.max(0.035, (0.05 + (al.length / aliens.length) * 0.65) / (diff * (1 + (wave - 1) * 0.08)));
      stepT -= dt;
      if (stepT <= 0) {
        stepT = interval; frame2 ^= 1;
        CX.tone([98, 87, 78, 73][stepIdx++ % 4], 0.09, "square", 0.08);
        let minX = Infinity, maxX = -Infinity;
        al.forEach((a) => { minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x + a.w); });
        if ((dirX > 0 && maxX + 5 > W - 6) || (dirX < 0 && minX - 5 < 6)) { dirX *= -1; al.forEach((a) => (a.y += 10)); }
        else al.forEach((a) => (a.x += 5 * dirX));
        // un envahisseur qui touche un bouclier le ronge
        al.forEach((a) => { shields.forEach((s) => { if (s.hp > 0 && s.x + 4 > a.x && s.x < a.x + a.w && s.y + 4 > a.y && s.y < a.y + a.h) s.hp = 0; }); });
        if (al.some((a) => a.y + a.h >= ship.y - 4) && deadT <= 0) { lives = 1; loseLife(); return; }
      }
      // bombes ennemies (tirées par l'envahisseur le plus bas de chaque colonne)
      const rate = (0.6 + wave * 0.12) * diff;
      if (deadT <= 0 && Math.random() < rate * dt && bombs.length < 3 + wave) {
        const cols = {};
        al.forEach((a) => { const k = Math.round(a.x / 28); if (!cols[k] || cols[k].y < a.y) cols[k] = a; });
        const list = Object.values(cols);
        const near = list.sort((p, q) => Math.abs(p.x - ship.x) - Math.abs(q.x - ship.x));
        const a = Math.random() < 0.5 ? near[0] : list[(Math.random() * list.length) | 0];
        if (a) bombs.push({ x: a.x + a.w / 2, y: a.y + a.h, v: (110 + wave * 8) * diff, z: Math.random() < 0.5 });
      }
      bombs.forEach((b) => (b.y += b.v * dt));
      bombs = bombs.filter((b) => {
        if (b.y > GROUND) { boom(b.x, GROUND, "#888", 4); return false; }
        if (hitShield(b.x, b.y + 6, 2)) return false;
        if (deadT <= 0 && Math.abs(b.x - ship.x) < 11 && b.y + 8 > ship.y - 6 && b.y < ship.y + 8) {
          if (power === "SHIELD") { power = null; powerT = 0; boom(ship.x, ship.y - 8, "#25f4ff", 12); CX.tone(700, 0.15, "square", 0.08, 300); }
          else loseLife();
          return false;
        }
        return true;
      });
      // tirs croisés qui s'annulent
      shots = shots.filter((s) => { const i = bombs.findIndex((b) => Math.abs(b.x - s.x) < 4 && Math.abs(b.y - s.y) < 8); if (i >= 0) { bombs.splice(i, 1); boom(s.x, s.y, "#fff", 5); return false; } return true; });
      // bonus qui tombent
      pows.forEach((p) => (p.y += 70 * dt));
      pows = pows.filter((p) => {
        if (p.y > GROUND) return false;
        if (deadT <= 0 && Math.abs(p.x - ship.x) < 14 && Math.abs(p.y - ship.y) < 12) {
          if (p.t === "LIFE") { lives++; hud(); CX.melody([523, 659, 784, 1047], 0.07, "triangle", 0.09); }
          else { power = p.t; powerT = 9; CX.tone(400, 0.25, "sine", 0.1, 1200); }
          CX.toast(p.t === "LIFE" ? "+1 VIE" : p.t === "DOUBLE" ? "TIR DOUBLE" : "BOUCLIER", 900);
          return false;
        }
        return true;
      });
      // soucoupe
      ufoT -= dt;
      if (!ufo && ufoT <= 0 && al.length > 6) { const l = Math.random() < 0.5; ufo = { x: l ? -32 : W, y: 24, v: l ? 70 : -70 }; ufoT = 18 + Math.random() * 12; }
      if (ufo) { ufo.x += ufo.v * dt; if (Math.floor(CX.time * 12) % 3 === 0) CX.tone(ufo.v > 0 ? 880 : 760, 0.04, "sine", 0.025); if (ufo.x < -40 || ufo.x > W + 40) ufo = null; }
      if (CX.score >= extraAt) { extraAt += 1500; lives++; hud(); CX.toast("+1 VIE", 900); CX.melody([523, 659, 784, 1047], 0.07, "triangle", 0.09); }
      parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
      parts = parts.filter((p) => p.life > 0);
      shake = Math.max(0, (shake || 0) - dt * 25);
    },
    draw(c, dt) {
      c.save();
      if (shake) c.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      c.fillStyle = "#02030a"; c.fillRect(-10, -10, W + 20, H + 20);
      stars.forEach((s) => { s.y += s.v * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } c.fillStyle = `rgba(255,255,255,${s.s / 2})`; c.fillRect(s.x, s.y, s.s, s.s); });
      // sol
      c.fillStyle = "#39ff88"; c.fillRect(0, GROUND, W, 2);
      // boucliers
      shields.forEach((s) => { if (s.hp > 0) { c.fillStyle = s.hp === 2 ? "#39ff88" : "#1d8a4a"; c.fillRect(s.x, s.y, 4, 4); } });
      // envahisseurs
      aliens.forEach((a) => { if (a.alive) sprite(c, SPR[a.t + (frame2 ? "2" : "1")], a.x, a.y, SC, a.col); });
      if (ufo) { c.shadowColor = "#ff3b3b"; c.shadowBlur = 10; sprite(c, SPR.ufo, ufo.x, ufo.y, 2, "#ff3b3b"); c.shadowBlur = 0; }
      // vaisseau
      if (CX.state !== "title" && ship && (deadT <= 0 || (lives > 0 && deadT < 0.6 && Math.floor(CX.time * 10) % 2))) {
        c.shadowColor = "#ffd21f"; c.shadowBlur = 8;
        sprite(c, SPR.ship, ship.x - 10, ship.y - 7, 2, "#ffd21f"); c.shadowBlur = 0;
        if (power === "SHIELD") { c.strokeStyle = "rgba(37,244,255,.8)"; c.lineWidth = 1.5; c.beginPath(); c.arc(ship.x, ship.y, 16, Math.PI, 0); c.stroke(); }
      }
      // tirs
      c.fillStyle = "#fff"; shots.forEach((s) => c.fillRect(s.x - 1, s.y - 6, 2, 8));
      bombs.forEach((b) => { c.fillStyle = "#ff5bd1"; const z = Math.floor(CX.time * 16) % 2; for (let i = 0; i < 4; i++) c.fillRect(b.x - 1 + (b.z ? ((i + z) % 2) * 2 - 1 : 0), b.y + i * 2, 2, 2); });
      pows.forEach((p) => {
        c.fillStyle = p.t === "LIFE" ? "#ff3b6b" : p.t === "DOUBLE" ? "#ffd21f" : "#25f4ff";
        c.fillRect(p.x - 7, p.y - 7, 14, 14); c.fillStyle = "#000"; c.font = "7px 'Press Start 2P', monospace"; c.textAlign = "center";
        c.fillText(p.t === "LIFE" ? "♥" : p.t === "DOUBLE" ? "2" : "S", p.x, p.y + 4);
      });
      parts.forEach((p) => { c.globalAlpha = Math.max(0, p.life * 2.2); c.fillStyle = p.col; c.fillRect(p.x - 1, p.y - 1, 2.5, 2.5); });
      c.globalAlpha = 1;
      if (power && powerT > 0) { c.fillStyle = "rgba(255,255,255,.6)"; c.font = "6px 'Press Start 2P', monospace"; c.textAlign = "left"; c.fillText(`${power === "DOUBLE" ? "TIR DOUBLE" : "BOUCLIER"} ${Math.ceil(powerT)}`, 6, GROUND + 14); }
      c.restore();
      if (CX.state === "title") { frame2 = Math.floor(CX.time * 2) % 2; }
    },
  };
  CX.boot(G);
})();

</script>
