<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartridge</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1c23;
            --accent-color: #6366f1;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
        }

        /* Barre de filtres */
        .filters-container {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        select#genreFilter {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        /* Grille des jeux */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .game-info {
            padding: 20px;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .game-meta {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .game-hype {
            color: #f59e0b;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cartridge</h1>
        <p>Découvrez et suivez les sorties de jeux vidéo à venir</p>
    </header>

    <!-- Filtres Hype & Genres -->
    <div class="filters-container">
        <button class="filter-btn active" onclick="filterByHype('all', this)">Tous les jeux</button>
        <button class="filter-btn" onclick="filterByHype('hyped', this)">🔥 Les plus attendus</button>
        
        <select id="genreFilter" onchange="filterByGenre(this.value)">
            <option value="all">Tous les genres</option>
            <option value="RPG">RPG</option>
            <option value="Action">Action</option>
            <option value="Adventure">Aventure</option>
            <option value="Shooter">Shooter</option>
            <option value="Strategy">Stratégie</option>
        </select>
    </div>

    <!-- Liste des jeux -->
    <div id="gamesGrid" class="games-grid">
        <!-- Les cartes de jeux seront injectées ici -->
    </div>

    <script>
        // Tableau complet des données de jeux
        let allGames = [
            { id: 1, title: "Cyber Odyssey", releaseDate: "15 Nov 2026", hypes: 25, genres: ["RPG", "Action"] },
            { id: 2, title: "Shadow Tactics 2", releaseDate: "22 Nov 2026", hypes: 5, genres: ["Strategy"] },
            { id: 3, title: "Starfall Arena", releaseDate: "05 Déc 2026", hypes: 40, genres: ["Shooter", "Action"] },
            { id: 4, title: "Mystic Realms", releaseDate: "12 Déc 2026", hypes: 12, genres: ["RPG", "Adventure"] }
        ];

        // Fonction pour afficher les jeux dans la grille
        function displayGames(gamesToDisplay) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            if (gamesToDisplay.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Aucun jeu trouvé.</p>';
                return;
            }

            gamesToDisplay.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <div class="game-meta">
                            <span>📅 ${game.releaseDate}</span>
                            <span class="game-hype">🔥 ${game.hypes} Hype</span>
                        </div>
                        <div style="font-size: 0.75rem; color: var(--accent-color);">
                            ${game.genres.join(' • ')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filtrer par Hype
        function filterByHype(type, btnElement) {
            document.querySelectorAll('.filters-container .filter-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            document.getElementById('genreFilter').value = 'all';

            if (type === 'hyped') {
                const hypedGames = allGames.filter(game => game.hypes > 10);
                displayGames(hypedGames);
            } else {
                displayGames(allGames);
            }
        }

        // Filtrer par Genre
        function filterByGenre(genre) {
            document.querySelectorAll('.filters-container .filter-btn').forEach(b => b.classList.remove('active'));
            
            if (genre === 'all') {
                document.querySelector('.filter-btn').classList.add('active');
                displayGames(allGames);
            } else {
                const filtered = allGames.filter(game => game.genres && game.genres.includes(genre));
                displayGames(filtered);
            }
        }

        // Initialisation de l'affichage au chargement de la page
        displayGames(allGames);
    </script>
</body>
</html>
