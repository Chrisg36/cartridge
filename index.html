const LANG_NAMES = {

};

try { currentLang = localStorage.getItem("lang") || "fr"; } catch (e) {}

function t(key, param) {
  const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.fr;
  const val = dict[key] || TRANSLATIONS.fr[key];
  if (typeof val === "function") return val(param);

}

let favorites = [];
try { favorites = JSON.parse(localStorage.getItem("favorites") || "[]"); } catch (e) { favorites = []; }

function isFavorite(id) { return favorites.includes(id); }
function toggleFavorite(id) {
  if (isFavorite(id)) { favorites = favorites.filter(favId => favId !== id); }
  else { favorites.push(id); }
  try { localStorage.setItem("favorites", JSON.stringify(favorites)); } catch (e) {}
  playThemeSound(theme);
  render();

/* --- SYSTÈME DE SONS PAR WEB AUDIO --- */
let soundEnabled = true;
try { soundEnabled = localStorage.getItem("sound") !== "false"; } catch (e) {}

function playThemeSound(themeKey) {
  if (!soundEnabled) return;
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    const modernThemes = ["dark", "light", "midnight", "forest", "violet", "ruby"];

    if (modernThemes.includes(themeKey)) {
      osc.type = "sine";
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.15);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else {
      osc.type = "square";
      osc.frequency.setValueAtTime(400, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    }
  } catch (e) {}
}

/* --- BADGES CONSOLES ÉTENDUS POUR TOUTES LES PLATEFORMES --- */
function getPlatformBadgeClass(plat) {
  const p = plat.toLowerCase();
  if (p.includes("ps5")) return "badge-ps5";
  if (p.includes("ps4")) return "badge-ps4";
  if (p.includes("ps3")) return "badge-ps3";
  if (p.includes("ps2")) return "badge-ps2";
  if (p.includes("playstation") || p.includes("ps1")) return "badge-ps1";
  if (p.includes("xbox 360")) return "badge-xbox360";
  if (p.includes("xbox one")) return "badge-xboxone";
  if (p.includes("xbox")) return "badge-xbox";
  if (p.includes("switch")) return "badge-switch2";
  if (p.includes("gamecube") || p.includes("game cube")) return "badge-gamecube";
  if (p.includes("nintendo 64") || p.includes("n64")) return "badge-n64";
  if (p.includes("super nintendo") || p.includes("snes")) return "badge-snes";
  if (p.includes("nes") || p.includes("nintendo entertainment system")) return "badge-nes";
  if (p.includes("game boy advance") || p.includes("gba")) return "badge-gba";
  if (p.includes("game boy color") || p.includes("gbc")) return "badge-gbc";
  if (p.includes("game boy") || p.includes("gb")) return "badge-gb";
  if (p.includes("3ds")) return "badge-3ds";
  if (p.includes("ds")) return "badge-ds";
  if (p.includes("dreamcast")) return "badge-dreamcast";
  if (p.includes("saturn")) return "badge-saturn";
  if (p.includes("mega drive") || p.includes("genesis")) return "badge-megadrive";
  if (p.includes("master system")) return "badge-mastersystem";
  if (p.includes("pc") || p.includes("win")) return "badge-pc";
  return "badge-default";
}

function renderPlatforms(releases) {
  if (!releases) return '';
  const platforms = [...new Set(releases.map(r => r.platform))];
  return platforms.map(plat => {
    const badgeClass = getPlatformBadgeClass(plat);
    return `<span class="platform-badge ${badgeClass}">${plat}</span>`;
  }).join('');
}

function renderHypeBadge(game) {
  if (!game.hypes || game.hypes < 5) return '';
  return `<span class="score-badge" style="background: rgba(255, 107, 53, 0.15); color: var(--acc);">🔥 ${game.hypes}</span>`;
}

function renderTimeBadge(dateStr) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const releaseDate = new Date(dateStr + "T00:00:00Z"); releaseDate.setHours(0, 0, 0, 0);
  const diffDays = Math.round((releaseDate - today) / (1000 * 60 * 60 * 24));
  if (diffDays === 0) return `<span class="time-badge badge-today">${t('today')}</span>`;
  if (diffDays === 1) return `<span class="time-badge">${t('tomorrow')}</span>`;
  if (diffDays > 1 && diffDays <= 7) return `<span class="time-badge">${t('inDays', diffDays)}</span>`;
  if (diffDays === -1) return `<span class="time-badge">${t('yesterday')}</span>`;
  if (diffDays < -1 && diffDays >= -7) return `<span class="time-badge">${t('daysAgo', Math.abs(diffDays))}</span>`;
  return '';
}

function renderScoreBadge(game) {
  const scoreRaw = game.aggregated_rating || game.rating;
  if (!scoreRaw) return '';
  const score = Math.round(scoreRaw);
  let scoreClass = score < 50 ? "score-low" : (score < 75 ? "score-mid" : "score-high");
  return `<span class="score-badge ${scoreClass}">★ ${score}</span>`;
}

const FILTERS = ["Tous", "❤️ Favoris", "PC", "PS5", "Xbox", "Switch 2"];
const cache = {};
let ym = new Date().toISOString().slice(0, 7);
let filter = "Tous";
let currentGenreFilter = "all";
let searchQuery = "";
let searchResults = null;

const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const utc = (d) => new Date(d + "T00:00:00Z");
const fmtDay = (d) => utc(d).toLocaleDateString(currentLang, { weekday: "long", day: "numeric", timeZone: "UTC" });
const fmtFull = (d) => utc(d).toLocaleDateString(currentLang, { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

function shiftMonth(delta) {
  playThemeSound(theme);
  const [y, m] = ym.split("-").map(Number);
  ym = new Date(Date.UTC(y, m - 1 + delta, 1)).toISOString().slice(0, 7);
  load();
}

function updateStaticTexts() {
  $("#sub-title").textContent = t('subTitle');
  $("#search").placeholder = t('searchPlaceholder');
}

async function load() {
  updateStaticTexts();
  $("#title").textContent = utc(ym + "-01").toLocaleDateString(currentLang, { month: "long", year: "numeric", timeZone: "UTC" });
  if (!cache[ym]) {
    $("#list").replaceChildren(el("p", "msg", t('loading')));
    try {
      const res = await fetch(`${API}/?month=${ym}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erreur du serveur");
      cache[ym] = data;
    } catch (e) {
      $("#list").replaceChildren(el("p", "msg", t('netError')));
      return;
    }
  }
  render();
}

async function searchGlobal(query) {
  if (!query || query.length < 2) {
    searchResults = null;
    render();
    return;
  }
  $("#list").replaceChildren(el("p", "msg", t('searchDb')));
  try {
    const res = await fetch(`${API}/?search=${encodeURIComponent(query)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Erreur");
    searchResults = data;
    render();
  } catch (e) {
    $("#list").replaceChildren(el("p", "msg", t('searchError')));
  }
}

function itemsFor(games) {
  const out = [];
  for (const g of games) {
    if (filter === "❤️ Favoris" && !isFavorite(g.id)) continue;
    
    // Filtrage par genre (mots-clés ou identifiants IGDB)
    if (currentGenreFilter !== "all") {
      const gName = (g.name || "").toLowerCase();
      const gSummary = (g.summary || "").toLowerCase();
      const gGenres = Array.isArray(g.genres) ? g.genres.join(" ").toLowerCase() : "";
      const searchCat = currentGenreFilter.toLowerCase();
      
      const match = gName.includes(searchCat) || gSummary.includes(searchCat) || gGenres.includes(searchCat);
      if (!match) continue;
    }

    const rel = (filter === "Tous" || filter === "❤️ Favoris") ? g.releases : g.releases.filter((r) => r.platform === filter);
    if (!rel.length) continue;
    out.push({ g, rel, date: rel[0].date });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || b.g.hypes - a.g.hypes);
}

function render() {
  let gamesToDisplay = searchQuery ? (searchResults || []) : (cache[ym] || []);
  const items = itemsFor(gamesToDisplay);
  const list = $("#list");
  
  if (!items.length) {
    let msgText = searchQuery ? t('noGamesSearch') : (filter === "❤️ Favoris" ? t('noGamesFav') : t('noGamesFilter'));
    list.replaceChildren(el("p", "msg", msgText));
    return;
  }
  const frag = document.createDocumentFragment();
  let last = "";
  for (const it of items) {
    const headerText = searchQuery ? fmtFull(it.date) : fmtDay(it.date);
    if (headerText !== last) {
      frag.append(el("p", "day", headerText));
      last = headerText;
    }
    frag.append(row(it));
  }
  list.replaceChildren(frag);
}

function row(it) {
  const r = el("div", "row");
  const open = el("button", "open");
  const img = el("img", "cov");
  img.src = it.g.cover; img.alt = ""; img.loading = "lazy"; img.width = 56; img.height = 76;
  const tDiv = el("div", "t");
  
  const platformSpan = el("span", "m");
  platformSpan.innerHTML = renderPlatforms(it.rel) + renderHypeBadge(it.g) + renderScoreBadge(it.g) + renderTimeBadge(it.date);
  tDiv.append(el("b", "", it.g.name), platformSpan);

  open.append(img, tDiv);
  open.addEventListener("click", () => {
    playThemeSound(theme);
    openSheet(it);
  });

  const actions = el("div", "actions");
  const favBtn = el("button", "btn-icon" + (isFavorite(it.g.id) ? " fav-active" : ""));
  favBtn.innerHTML = isFavorite(it.g.id)
    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="#FF4757" stroke="#FF4757" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
  favBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleFavorite(it.g.id); });

  const add = el("button", "btn-icon add");
  add.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  add.addEventListener("click", (e) => { 
    e.stopPropagation(); 
    playThemeSound(theme);
    addToCalendar(it); 
  });

  actions.append(favBtn, add);
  r.append(open, actions);
  return r;
}

function openShareModal() {
  playThemeSound(theme);
  const p = $("#panel");
  const monthName = utc(ym + "-01").toLocaleDateString(currentLang, { month: "long", year: "numeric", timeZone: "UTC" });
  
  const allGames = cache[ym] || [];
  const favGames = allGames.filter(g => isFavorite(g.id));

  let shareText = `🎮 Mes jeux favoris de ${monthName} :\n`;
  if (favGames.length === 0) {
    shareText += t('noFavShare') + "\n";
  } else {
    for (const g of favGames) {
      const plats = [...new Set(g.releases.map(r => r.platform))].join(", ");
      shareText += `• ${g.name} (${plats})\n`;
    }
  }
  shareText += "\n" + t('shareFooter');

  const textarea = el("textarea", "share-textarea");
  textarea.value = shareText;
  textarea.readOnly = true;

  const copyBtn = el("button", "cta", t('copyBtn'));
  copyBtn.addEventListener("click", () => {
    playThemeSound(theme);
    navigator.clipboard.writeText(textarea.value).then(() => {
      copyBtn.textContent = t('copiedBtn');
      setTimeout(() => { copyBtn.textContent = t('copyBtn'); }, 3000);
    });
  });

  const close = el("button", "close", t('close'));
  close.addEventListener("click", () => {
    playThemeSound(theme);
    closeSheet();
  });

  p.replaceChildren(el("h2", "", t('shareTitle')), el("p", "m", t('shareDesc')), textarea, copyBtn, close);
  $("#sheet").classList.add("on");
}
$("#shareBtn").addEventListener("click", openShareModal);

async function openSheet(it) {
  const p = $("#panel");
  const img = el("img", "big"); img.src = it.g.cover; img.alt = "";
  const close = el("button", "close", t('close')); 
  close.addEventListener("click", () => {
    playThemeSound(theme);
    closeSheet();
  });
  
  const cta = el("button", "cta", t('calendarBtn'));
  cta.addEventListener("click", () => {
    playThemeSound(theme);
    addToCalendar(it);
  });

  const favCta = el("button", "cta-sec");
  favCta.innerHTML = isFavorite(it.g.id) ? t('favRemove') : t('favAdd');
  favCta.addEventListener("click", () => { toggleFavorite(it.g.id); openSheet(it); });

  const dates = it.g.releases.map((r) => `${r.platform} : ${fmtFull(r.date)}`).join("\n");
  const d = el("p", "m", dates); d.style.whiteSpace = "pre-line";

  p.replaceChildren(img, el("h2", "", it.g.name), d, cta, favCta);

  const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(it.g.name + ' trailer official')}`;
  const trailerBtn = el("a", "cta-sec");
  trailerBtn.href = ytSearchUrl; trailerBtn.target = "_blank"; trailerBtn.rel = "noopener noreferrer";
  trailerBtn.style.textDecoration = "none"; trailerBtn.style.marginTop = "8px";
  trailerBtn.innerHTML = t('trailerBtn');
  trailerBtn.addEventListener("click", () => playThemeSound(theme));
  p.append(trailerBtn);

  const hltbUrl = `https://howlongtobeat.com/?q=${encodeURIComponent(it.g.name)}`;
  const hltbBtn = el("a", "cta-sec");
  hltbBtn.href = hltbUrl; hltbBtn.target = "_blank"; hltbBtn.rel = "noopener noreferrer";
  hltbBtn.style.textDecoration = "none"; hltbBtn.style.marginTop = "8px";
  hltbBtn.innerHTML = t('hltbBtn');
  hltbBtn.addEventListener("click", () => playThemeSound(theme));
  p.append(hltbBtn);

  if (it.g.summary) {
    const label = el("p", "m", t('summaryLabel')); label.style.marginTop = "16px";
    const summaryEl = el("p", "", t('summaryLoading'));
    summaryEl.style.opacity = "0.7";
    p.append(label, summaryEl);
    $("#sheet").classList.add("on");

    try {
      const res = await fetch(`${API}/?translate=${it.g.id}&lang=${currentLang}`);
      const data = await res.json();
      summaryEl.style.opacity = "1";
      summaryEl.textContent = data.summary || it.g.summary;
    } catch (e) {
      summaryEl.style.opacity = "1";
      summaryEl.textContent = it.g.summary;
    }
  } else {
    $("#sheet").classList.add("on");
  }
  p.append(close);
}

function closeSheet() { $("#sheet").classList.remove("on"); }
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

const icsEsc = (s) => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
function addToCalendar(it) {
  const day = it.date.replace(/-/g, "");
  const next = new Date(utc(it.date).getTime() + 864e5).toISOString().slice(0, 10).replace(/-/g, "");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Sorties Jeux//FR", "BEGIN:VEVENT",
    `UID:${it.g.id}-${day}@sorties-jeux`, `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${day}`, `DTEND;VALUE=DATE:${next}`,
    `SUMMARY:${icsEsc("Sortie : " + it.g.name)}`,
    `DESCRIPTION:${icsEsc(it.rel.map((r) => r.platform).join(", "))}`,
    "BEGIN:VALARM", "TRIGGER:PT9H", "ACTION:DISPLAY", "DESCRIPTION:Sortie aujourd’hui", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR",
  ];
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = it.g.name.replace(/[^\w]+/g, "-").slice(0, 40) + ".ics";
  document.body.append(a);
  a.click();
  a.remove();
}

const THEMES = {
  dark: ["Sombre", "#111318", "#FF7A45"],
  light: ["Clair", "#F6F7F9", "#C2410C"],
  midnight: ["Minuit", "#0B1020", "#5CA8FF"],
  forest: ["Forêt", "#0E1511", "#4ADE80"],
  violet: ["Violet", "#130F1E", "#B794FF"],
  ruby: ["Rubis", "#170D10", "#FF5C7A"],
  gameboy: ["Game Boy", "#0f1f0f", "#8BAC0F"],
  nes: ["NES Classic", "#121214", "#E52521"],
  snes: ["Super Nintendo", "#16151d", "#6b5cd5"],
  ps1: ["PlayStation 1", "#1a1e29", "#0070D1"],
  n64: ["Nintendo 64", "#120b1f", "#f5b201"],
  dreamcast: ["Dreamcast", "#eceef2", "#ff6600"],
  gamecube: ["GameCube", "#110e1b", "#6747ed"],
  arcade: ["Arcade 90s", "#0d0614", "#00FFFF"],
  atari: ["Atari 2600", "#1a120b", "#FF7700"],
  dos: ["MS-DOS", "#000000", "#00FF00"],
  megadrive: ["Mega Drive", "#060914", "#FF0033"]
};

function applyTheme(th) {
  if (!THEMES[th]) th = "dark";
  document.documentElement.dataset.theme = th;
  $("#themeMeta").content = THEMES[th][1];
  playThemeSound(th);
  return th;
}
let theme = "dark";
try { theme = localStorage.getItem("theme") || "dark"; } catch (e) {}
theme = applyTheme(theme);

function openSettings() {
  playThemeSound(theme);
  const p = $("#panel");
  p.replaceChildren(); 

  p.append(el("h2", "", t('settingsTitle')));

  // Section Thèmes & Consoles Rétro
  p.append(el("p", "m", t('themeLabel')));
  const group = el("div", "chips"); group.style.flexWrap = "wrap";
  for (const [key, [label, , acc]] of Object.entries(THEMES)) {
    const b = el("button", "chip", label);
    const dot = el("span", "dot"); dot.style.background = acc; b.prepend(dot);
    b.setAttribute("aria-pressed", String(key === theme));
    b.addEventListener("click", () => {
      theme = applyTheme(key);
      try { localStorage.setItem("theme", theme); } catch (e) {}
      group.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
    });
    group.append(b);
  }
  p.append(group);

  // Section Paramètre Sonore (ON/OFF)
  p.append(el("p", "m", t('soundLabel')));
  const soundBtn = el("button", "cta-sec", soundEnabled ? t('soundOn') : t('soundOff'));
  soundBtn.addEventListener("click", () => {
    soundEnabled = !soundEnabled;
    try { localStorage.setItem("sound", soundEnabled); } catch (e) {}
    soundBtn.textContent = soundEnabled ? t('soundOn') : t('soundOff');
    if (soundEnabled) playThemeSound(theme);
  });
  p.append(soundBtn);

  // Section Langues
  p.append(el("p", "m", t('langLabel')));
  const langGrid = el("div", "lang-grid");
  Object.entries(LANG_NAMES).forEach(([code, label]) => {
    const b = el("button", "chip", label);
    if (code === currentLang) b.setAttribute("aria-pressed", "true");
    b.addEventListener("click", () => {
      playThemeSound(theme);
      currentLang = code;
      try { localStorage.setItem("lang", currentLang); } catch (e) {}
      load();          
      openSettings();  
    });
    langGrid.append(b);
  });
  p.append(langGrid);

  // Section Capsule Temporelle (Mode Rétro)
  p.append(el("p", "m", t('retroLabel')));
  const retroGroup = el("div", "chips"); retroGroup.style.flexWrap = "wrap";
  [
    [-1, "Année dernière"],
    [-5, "Il y a 5 ans"],
    [-10, "Il y a 10 ans"],
    [-20, "Il y a 20 ans"]
  ].forEach(([years, label]) => {
    const b = el("button", "chip", label);
    b.addEventListener("click", () => {
      playThemeSound(theme);
      const [y, m] = ym.split("-").map(Number);
      const targetYear = y + years;
      ym = `${targetYear}-${String(m).padStart(2, "0")}`;
      load();
      closeSheet();
    });
    retroGroup.append(b);
  });
  p.append(retroGroup);

  const close = el("button", "close", t('close')); 
  close.addEventListener("click", () => {
    playThemeSound(theme);
    closeSheet();
  });
  p.append(close);

  $("#sheet").classList.add("on");
}
$("#settings").addEventListener("click", openSettings);

const chips = $("#chips");

function renderChipsBar() {
  chips.replaceChildren();
  
  for (const f of FILTERS) {
    let label = f;
    if (f === "Tous") label = t('all');
    if (f === "❤️ Favoris") label = t('favorites');
    const b = el("button", "chip", label);
    b.setAttribute("aria-pressed", String(f === filter));
    b.addEventListener("click", () => {
      playThemeSound(theme);
      filter = f;
      renderChipsBar();
      render();
    });
    chips.append(b);
  }

  const select = document.createElement("select");
  select.id = "genreFilter";
  select.innerHTML = `
    <option value="all">${t('allGenres')}</option>
    <option value="FPS" ${currentGenreFilter === 'FPS' ? 'selected' : ''}>🎯 FPS</option>
    <option value="Horror" ${currentGenreFilter === 'Horror' ? 'selected' : ''}>😱 Horreur</option>
    <option value="Indie" ${currentGenreFilter === 'Indie' ? 'selected' : ''}>💡 Indé</option>
    <option value="Adventure" ${currentGenreFilter === 'Adventure' ? 'selected' : ''}>🗺️ Aventure</option>
    <option value="Action" ${currentGenreFilter === 'Action' ? 'selected' : ''}>⚔️ Action</option>
    <option value="Sport" ${currentGenreFilter === 'Sport' ? 'selected' : ''}>⚽ Sport</option>
    <option value="Strategy" ${currentGenreFilter === 'Strategy' ? 'selected' : ''}>♟️ Stratégie</option>
    <option value="Simulator" ${currentGenreFilter === 'Simulator' ? 'selected' : ''}>✈️ Simulation</option>
    <option value="Racing" ${currentGenreFilter === 'Racing' ? 'selected' : ''}>🏎️ Course</option>
    <option value="RPG" ${currentGenreFilter === 'RPG' ? 'selected' : ''}>🛡️ RPG</option>
  `;
  select.addEventListener("change", (e) => {
    playThemeSound(theme);
    currentGenreFilter = e.target.value;
    render();
  });
  chips.append(select);
}

renderChipsBar();

let searchTimeout;
$("#search").addEventListener("input", (e) => {
  searchQuery = e.target.value.trim();
  clearTimeout(searchTimeout);
  if (!searchQuery) {
    searchResults = null;
    render();
    return;
  }
  searchTimeout = setTimeout(() => {
    searchGlobal(searchQuery);
  }, 400);
});

$("#prev").addEventListener("click", () => shiftMonth(-1));
$("#next").addEventListener("click", () => shiftMonth(1));
load();
</script>
