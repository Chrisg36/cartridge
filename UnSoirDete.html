<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05040a">
<title>Un Soir d'Été — Édition Intégrale 1994</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --win-a:#3a4fc7; --win-b:#18226e; --win-c:#0a0e3f; --edge:#e4e8ff;
  --gold:#ffd45e; --cyan:#86f4ff; --pink:#ff74b4; --green:#7dff9a;
  --txt:#f3f4ff; --dim:#9ea7da; --ink:#05040a;
  --px:'Press Start 2P', monospace; --body:'Pixelify Sans', 'Trebuchet MS', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000}
body{display:flex;align-items:center;justify-content:center;color:var(--txt);font-family:var(--body);
  overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- Console / TV frame ---------- */
#console{position:relative;width:100%;height:100dvh;max-width:560px;background:var(--ink);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
@media (min-width:700px){
  body{background:radial-gradient(ellipse at center,#1d1830 0%,#07060c 70%)}
  #console{height:min(94dvh,900px);border-radius:20px;
    box-shadow:0 0 0 10px #17151e,0 0 0 12px #2c2936,0 0 0 13px #000,0 40px 90px rgba(0,0,0,.85)}
}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* CRT overlay */
#crt{position:absolute;inset:0;pointer-events:none;z-index:90;
  background:
    repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 3px),
    radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;animation:flick 6s infinite steps(1)}
#crt::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,0,60,.035),rgba(0,255,120,.02),rgba(40,80,255,.035));mix-blend-mode:screen}
@keyframes flick{0%,100%{opacity:1}48%{opacity:.93}49%{opacity:1}}
.crt-off #crt{display:none}

/* ---------- Windows (style JRPG 32-bit) ---------- */
.win{position:relative;background:linear-gradient(180deg,var(--win-a) 0%,var(--win-b) 52%,var(--win-c) 100%);
  border:2px solid var(--edge);border-radius:7px;
  box-shadow:inset 0 0 0 2px #070a2e,inset 0 3px 0 2px rgba(255,255,255,.13),0 3px 0 #000;
  text-shadow:2px 2px 0 #050726}
.win.dark{background:linear-gradient(180deg,#1d2363 0%,#0b0f3c 100%)}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* Boot */
#boot{background:#000;align-items:center;justify-content:center;z-index:80;gap:14px}
#boot .logo{width:84px;height:84px;position:relative;animation:spinIn 1.4s cubic-bezier(.2,.8,.2,1) both}
#boot .logo i{position:absolute;inset:0;border:6px solid;transform:rotate(45deg) scale(.7)}
#boot .logo i:nth-child(1){border-color:#ff8a3d}
#boot .logo i:nth-child(2){border-color:#ffd45e;transform:rotate(45deg) scale(.45)}
#boot .logo i:nth-child(3){background:#ff74b4;border:0;transform:rotate(45deg) scale(.2)}
#boot b{font-family:var(--px);font-size:13px;letter-spacing:3px;color:#fff;animation:fadeUp 1s .5s both}
#boot small{font-family:var(--px);font-size:7px;color:#8890b8;letter-spacing:2px;animation:fadeUp 1s .9s both}
@keyframes spinIn{0%{transform:rotate(-200deg) scale(0);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}

/* Title */
#title{z-index:60;background:linear-gradient(180deg,#0b0726 0%,#1a0f3f calc(var(--ty) + 1px),#1b1426 calc(var(--ty) + 56.25vw - 2px),#0c0812 100%);--ty:31dvh}
@media (min-width:560px){#title{background:linear-gradient(180deg,#0b0726 0%,#1a0f3f calc(var(--ty) + 1px),#1b1426 calc(var(--ty) + 314px),#0c0812 100%)}}
#title canvas{position:absolute;left:0;top:var(--ty);width:100%;aspect-ratio:16/9;height:auto}
#title .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,4,20,0) 0%,rgba(5,4,20,0) 55%,rgba(5,4,20,.6) 80%,rgba(5,4,20,.9) 100%)}
#title .logo{position:relative;margin-top:7dvh;text-align:center;animation:logoDrop 1.1s cubic-bezier(.2,1.3,.4,1) both}
#title .logo .l1,#title .logo .l2{font-family:var(--px);display:block;line-height:1.1;
  background:linear-gradient(180deg,#fff6c9 0%,#ffd45e 38%,#ff8a3d 62%,#ff4f8b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 #3a0b3e) drop-shadow(0 0 1px #3a0b3e)}
#title .logo .l1{font-size:clamp(26px,8.5vw,40px)}
#title .logo .l2{font-size:clamp(34px,11vw,54px);margin-top:6px}
#title .logo .sub{display:inline-block;margin-top:14px;font-family:var(--px);font-size:8px;letter-spacing:2px;color:#ffe9b0;background:rgba(10,6,40,.6);padding:6px 10px;border:2px solid #ffd45e;border-radius:3px;text-shadow:1px 1px 0 #000}
@keyframes logoDrop{0%{transform:translateY(-60px) scale(1.3);opacity:0}100%{transform:none;opacity:1}}
#title .press{position:relative;margin-top:auto;text-align:center;font-family:var(--px);font-size:11px;color:#fff;text-shadow:2px 2px 0 #000;animation:blink 1s steps(1) infinite;padding:0 0 4px}
@keyframes blink{50%{opacity:0}}
#titleMenu{position:relative;margin:auto auto 14px;width:min(78%,300px);padding:10px 8px;display:none}
#titleMenu.on{display:block}
#title .foot{position:relative;text-align:center;font-family:var(--px);font-size:6.5px;color:#8e93bf;padding:0 0 calc(14px + env(safe-area-inset-bottom));letter-spacing:1px;line-height:1.8}

.menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px 8px 30px;font-size:17px;position:relative;border-radius:4px}
.menu-item[disabled]{opacity:.38;cursor:default}
.menu-item.focus::before,.choice.focus::before{content:"";position:absolute;left:4px;top:50%;width:20px;height:14px;margin-top:-7px;background:var(--hand) no-repeat center/contain;animation:point .5s steps(2) infinite alternate;image-rendering:pixelated}
@keyframes point{to{transform:translateX(3px)}}

/* ---------- Game screen ---------- */
#game{z-index:10}
#sceneWrap{position:relative;width:100%;aspect-ratio:16/9;flex-shrink:0;background:#000;overflow:hidden}
#scene{width:100%;height:100%}
.hud{position:absolute;top:6px;z-index:5;padding:4px 8px 5px;font-family:var(--px);border-width:2px;border-radius:5px}
#hudAct{left:6px;max-width:62%}
#hudAct .a{display:block;font-size:7px;color:var(--gold);letter-spacing:1px}
#hudAct .p{display:block;font-size:8px;color:#fff;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudClock{right:6px;text-align:right}
#hudClock .t{display:block;font-size:12px;color:var(--cyan);letter-spacing:1px}
#hudClock .s{display:block;font-size:6px;color:var(--dim);margin-top:4px}
#saveIcon{position:absolute;right:8px;bottom:6px;z-index:5;display:flex;align-items:center;gap:5px;font-family:var(--px);font-size:6px;color:#fff;opacity:0;transition:opacity .2s;text-shadow:1px 1px 0 #000}
#saveIcon.on{opacity:1;animation:blink .35s steps(1) 4}
#saveIcon canvas{width:16px;height:20px}

/* Status strip */
#status{display:flex;align-items:center;gap:8px;padding:6px 8px;background:linear-gradient(180deg,#141842,#090b26);border-top:2px solid #2c347a;border-bottom:2px solid #2c347a;flex-shrink:0}
.trust{display:flex;align-items:center;gap:4px}
.trust canvas{width:22px;height:16px}
.hearts{display:flex;gap:1px}
.hearts i{width:9px;height:8px;background:var(--h) no-repeat center/contain;image-rendering:pixelated}
#inv{flex:1;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;min-height:26px;align-items:center}
#inv::-webkit-scrollbar{display:none}
#inv .slot{flex-shrink:0;width:26px;height:26px;border:2px solid #39428e;border-radius:4px;background:#0c1036;display:grid;place-items:center;animation:pop .35s steps(4)}
#inv .slot canvas{width:20px;height:20px}
#inv .empty{font-family:var(--px);font-size:6px;color:#5a63a3}
@keyframes pop{0%{transform:scale(.3)}100%{transform:none}}
#btnMenu{font-family:var(--px);font-size:7px;padding:7px 8px;border-radius:5px;flex-shrink:0}

/* Dialogue */
#dialog{flex:1;min-height:0;margin:8px;display:flex;flex-direction:column;padding:10px 10px 8px;overflow:hidden}
#dlgTop{display:flex}
#portraitBox{float:left;margin:3px 10px 4px 0;width:66px;height:66px;border:2px solid var(--edge);border-radius:4px;box-shadow:inset 0 0 0 2px #070a2e,0 2px 0 #000;overflow:hidden;background:#000}
#portraitBox canvas{width:100%;height:100%}
#portraitBox.hide{display:none}
#dlgBody{flex:1;min-width:0}
#nameplate{display:inline-block;font-family:var(--px);font-size:7.5px;padding:4px 7px 5px;border-radius:3px;color:#120a20;text-shadow:none;margin-bottom:6px;box-shadow:2px 2px 0 #000;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scroll{flex:1;min-height:0;overflow-y:auto;margin-top:2px;padding-right:2px;scrollbar-width:thin;scrollbar-color:#5a66c8 transparent}
#text{font-size:17.5px;line-height:1.38;letter-spacing:.2px;min-height:2.8em;word-wrap:break-word}
#text .kw{color:var(--gold)}
#text .fx{color:var(--cyan)}
#next{display:inline-block;width:10px;height:8px;margin-left:6px;background:var(--tri) no-repeat center/contain;image-rendering:pixelated;animation:bob .5s steps(2) infinite alternate;vertical-align:middle}
@keyframes bob{to{transform:translateY(3px)}}
#choices{clear:both;display:flex;flex-direction:column;gap:3px;margin-top:10px;padding-bottom:4px}
.choice{position:relative;text-align:left;padding:8px 8px 8px 30px;font-size:16.5px;line-height:1.28;border-radius:5px;border:2px solid transparent;transition:background .08s}
.choice.focus{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.choice .req{display:inline-block;margin-left:6px;font-family:var(--px);font-size:6px;color:#1a1000;background:var(--gold);padding:3px 4px 2px;border-radius:2px;vertical-align:2px;text-shadow:none}
.choice{animation:slideIn .22s steps(3) both}
@keyframes slideIn{0%{opacity:0;transform:translateX(-10px)}100%{opacity:1;transform:none}}

/* Ending card */
.end-card{margin-top:10px;padding:10px;border:2px dashed rgba(255,212,94,.6);border-radius:6px;background:rgba(0,0,0,.18)}
.end-card h3{font-family:var(--px);font-size:9px;color:var(--gold);margin-bottom:8px;line-height:1.5}
.end-card .row{display:flex;justify-content:space-between;font-size:15px;color:var(--dim);padding:1px 0}
.end-card .row b{color:#fff;font-weight:500}
.end-card .tot{margin-top:6px;padding-top:6px;border-top:2px solid rgba(255,255,255,.18);font-family:var(--px);font-size:10px;color:var(--cyan)}
.end-card .tot b{color:var(--cyan)}

/* FIN banner over scene */
#finBanner{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,0) 70%)}
#finBanner.on{display:flex;animation:finIn 1.2s cubic-bezier(.2,1.2,.4,1) both}
#finBanner b{font-family:var(--px);font-size:34px;letter-spacing:6px;background:linear-gradient(180deg,#fff,#ffd45e 50%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #2a0830)}
#finBanner span{font-family:var(--px);font-size:8px;color:#fff;text-shadow:2px 2px 0 #000;text-align:center;padding:0 16px;line-height:1.6}
@keyframes finIn{0%{transform:scale(2.5);opacity:0}100%{transform:none;opacity:1}}

/* Toast */
#toast{position:absolute;left:50%;top:52px;transform:translate(-50%,-10px);z-index:70;padding:8px 12px;font-family:var(--px);font-size:7.5px;line-height:1.6;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88%;text-align:center}

#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Menu ---------- */
#menu{z-index:50;background:rgba(3,3,14,.82);padding:10px;gap:8px}
#menuHead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
#menuHead b{font-family:var(--px);font-size:10px;color:var(--gold)}
#menuHead button{font-family:var(--px);font-size:7px;padding:6px 8px;border:2px solid var(--edge);border-radius:4px;background:#0c1040}
#tabs{display:flex;gap:4px;padding:5px}
.tab{flex:1;font-family:var(--px);font-size:6.5px;padding:8px 2px;border-radius:4px;color:var(--dim)}
.tab.sel{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
#panel{flex:1;min-height:0;overflow-y:auto;padding:12px}
.li{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px;line-height:1.3}
.li canvas{width:26px;height:26px;flex-shrink:0}
.li .tag{font-family:var(--px);font-size:7px;color:var(--gold);margin-top:3px;flex-shrink:0}
.li.lock{color:#6a72a8}
.li small{display:block;color:var(--dim);font-size:14px;margin-top:2px}
.muted{color:var(--dim);font-size:15px;line-height:1.4}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 6px;font-size:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.opt span:last-child{font-family:var(--px);font-size:8px;color:var(--cyan)}
.danger{margin-top:14px;width:100%;padding:10px;border:2px solid #ff6f8f;border-radius:5px;color:#ffc2cf;font-size:15px;background:rgba(120,0,30,.25)}
.sec{font-family:var(--px);font-size:7px;color:var(--gold);margin:12px 0 6px}
.sec:first-child{margin-top:0}

@media (max-height:640px){
  #text{font-size:16px} .choice{font-size:15.5px;padding:6px 8px 6px 28px} #portraitBox{width:56px;height:56px}
  #dialog{margin:6px;padding:8px}
}
</style>
</head>
<body>
<div id="console">
  <div id="crt"></div>

  <!-- Écran de démarrage -->
  <section class="screen on" id="boot">
    <div class="logo"><i></i><i></i><i></i></div>
    <b>ÉRABLE SOFT</b>
    <small>PRÉSENTE</small>
  </section>

  <!-- Écran titre -->
  <section class="screen" id="title">
    <canvas id="titleCanvas" width="320" height="180"></canvas>
    <div class="shade"></div>
    <div class="logo">
      <span class="l1">UN SOIR</span>
      <span class="l2">D'ÉTÉ</span>
      <span class="sub">ÉDITION INTÉGRALE · 1994</span>
    </div>
    <div class="press" id="press">APPUIE SUR START</div>
    <div class="win" id="titleMenu">
      <button class="menu-item" data-act="continue">Continuer l'aventure</button>
      <button class="menu-item" data-act="new">Nouvelle partie</button>
      <button class="menu-item" data-act="endings">Fins débloquées</button>
    </div>
    <div class="foot" id="titleFoot">© 1994 ÉRABLE SOFT · 1 JOUEUR · CARTE MÉMOIRE</div>
  </section>

  <!-- Jeu -->
  <section class="screen" id="game">
    <div id="sceneWrap">
      <canvas id="scene" width="320" height="180"></canvas>
      <div class="win hud" id="hudAct"><span class="a" id="actA">ACTE I</span><span class="p" id="actP">LE DÉPART</span></div>
      <div class="win hud" id="hudClock"><span class="t" id="clock">21:00</span><span class="s" id="step">SCÈNE 1</span></div>
      <div id="saveIcon"><canvas id="memCard" width="8" height="10"></canvas>SAUVEGARDE</div>
      <div id="finBanner"><b>FIN</b><span id="finTitle"></span></div>
    </div>
    <div id="status">
      <div class="trust" title="Confiance de Léo"><canvas id="headLeo" width="13" height="9"></canvas><div class="hearts" id="leoH"></div></div>
      <div class="trust" title="Confiance de Maïa"><canvas id="headMaia" width="13" height="9"></canvas><div class="hearts" id="maiaH"></div></div>
      <div id="inv"></div>
      <button class="win" id="btnMenu">MENU</button>
    </div>
    <div class="win" id="dialog">
      <div id="dlgTop"><span id="nameplate">NARRATEUR</span></div>
      <div id="scroll">
        <div id="portraitBox"><canvas id="portrait" width="40" height="40"></canvas></div>
        <div id="text"></div>
        <div id="choices"></div>
      </div>
    </div>
  </section>

  <!-- Menu / Carnet -->
  <section class="screen" id="menu">
    <div class="win" id="menuHead"><b>CARNET D'AVENTURE</b><button id="menuClose">✕ RETOUR</button></div>
    <div class="win dark" id="tabs">
      <button class="tab sel" data-tab="items">OBJETS</button>
      <button class="tab" data-tab="clues">INDICES</button>
      <button class="tab" data-tab="endings">FINS</button>
      <button class="tab" data-tab="options">OPTIONS</button>
    </div>
    <div class="win" id="panel"></div>
  </section>

  <div class="win" id="toast"></div>
</div>

function vgrad(c, y0, y1, stops, x0 = 0, x1 = W) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(([p, col]) => g.addColorStop(p, col)); c.fillStyle = g; c.fillRect(x0, y0, x1 - x0, y1 - y0); }

}
function disc(c, x, y, r, col) { c.fillStyle = col; for (let j = -r; j <= r; j++) { const w = Math.round(Math.sqrt(r * r - j * j)); c.fillRect(Math.round(x - w), Math.round(y + j), w * 2, 1); } }

function stars(c, t, n, seed, maxY, bright = 1) {
  const r = rng(seed);

    const x = Math.floor(r() * W), y = Math.floor(r() * maxY), s = r(), ph = r() * 6.28;
    const tw = 0.55 + 0.45 * Math.sin(t * 0.05 + ph);

  }

}
function ridge(c, base, amp, f1, f2, ph, col, x0 = 0, x1 = W) {
  c.fillStyle = col;

function pine(c, x, base, h, col) {
  c.fillStyle = col; c.fillRect(x - 1, base - 4, 2, 4);

function seg7(c, x, y, str, on, off, s = 1) { // afficheur 7 segments

function kidsGroup(c, t, x, ground, opts = {}) {
  const order = ['leo', 'toi', 'maia'];

/* ---------------------------------------------------------------------------
   5. RENDU : décor → mosaïque de transition → tramage 15 bits → écran
   --------------------------------------------------------------------------- */
class Renderer {
  constructor(canvas, theme) {
    this.out = canvas; this.octx = canvas.getContext('2d');
    this.buf = mk(W, H); this.b = this.buf.getContext('2d');
    this.small = mk(W, H); this.s = this.small.getContext('2d');
    [this.octx, this.b, this.s].forEach((x) => (x.imageSmoothingEnabled = false));
    this.theme = theme; this.next = null; this.phase = 0; this.t = 0; this.sceneT = 0; this.active = true;
  }
  set(theme) {
    if (!SCENES[theme]) theme = 'street_dusk';
    if (theme === this.theme && !this.next) return;
    if (this.next) { this.next = theme; return; }
    this.next = theme; this.phase = 0;
  }
  frame() {
    if (!this.active) return;
    this.t++; this.sceneT++;
    const b = this.b; b.globalAlpha = 1; b.globalCompositeOperation = 'source-over';
    b.fillStyle = '#000'; b.fillRect(0, 0, W, H);
    SCENES[this.theme](b, this.sceneT);
    let block = 1;
    if (this.next) {
      this.phase++;
      const p = this.phase / 10;
      if (p <= 1) block = 1 + Math.round(p * 15);
      else if (p <= 2) { if (this.theme !== this.next) { this.theme = this.next; this.sceneT = 0; } block = 1 + Math.round((2 - p) * 15); }
      if (p >= 2) { this.next = null; block = 1; }
    }
    if (block > 1) {
      const sw = Math.ceil(W / block), sh = Math.ceil(H / block);
      this.s.clearRect(0, 0, W, H); this.s.drawImage(this.buf, 0, 0, sw, sh);
      b.drawImage(this.small, 0, 0, sw, sh, 0, 0, sw * block, sh * block);
    }
    if (this.theme === 'time_anomaly' && this.t % 3 === 0) { // glitch horizontal
      const r = rng(this.t);
      for (let i = 0; i < 5; i++) { const y = Math.floor(r() * H), h = 2 + Math.floor(r() * 6), dx = Math.floor((r() - 0.5) * 16); b.drawImage(this.buf, 0, y, W, h, dx, y, W, h); }
    }
    quantize(b, W, H);
    this.octx.drawImage(this.buf, 0, 0);
  }
}

/* ---------------------------------------------------------------------------
   6. PORTRAITS ANIMÉS (40×40, bouche qui parle, clignement)
   --------------------------------------------------------------------------- */
function portraitType(sp) {
  sp = sp || '';
  if (sp.includes('FIN')) return 'trophy';
  if (sp.includes('PAPA')) return 'papa';
  if (sp.includes('ACHILLE')) return sp.includes('RADIO') ? 'achille_radio' : 'achille';
  if (sp.includes('VICTOR')) return 'victor';
  if (sp.includes('LÉO')) return 'leo';
  if (sp.includes('MAÏA')) return 'maia';
  if (sp.includes('WALKIE')) return 'radio';
  if (sp.includes('ENREGISTREMENT')) return 'cassette';

    <div class="row tot"><span>SCORE</span><b>${total.toLocaleString('fr-FR')}</b></div>`;
  $('#choices').append(card);
  const mkBtn = (txt, fn) => { const b = document.createElement('button'); b.className = 'choice'; b.textContent = txt; b.onclick = () => { Audio32.sfx('select'); fn(); }; $('#choices').append(b); choiceEls.push(b); b.onmouseenter = () => setFocus(choiceEls.indexOf(b), true); };
  mkBtn('🔄 Rejouer pour découvrir les autres fins', () => newGame());
  mkBtn("🏠 Retour à l'écran titre", () => goTitle());
  setFocus(0, false);
  if (!G.reported) {
    G.reported = true; save(false);
    cx({ type: 'cartridge:score', score: total, game: "Un Soir d'Été" });
    cx({ type: 'cartridge:gameover', id: 'soirdete', score: total, stats: { ending: node.endingId, endings: unlocked.length, secret: node.endingId === 'FIN_ARCADE_SECRETE' } });
  }
}
function newGame() {
  G = fresh(); save(false);
  showScreen('game'); renderer.theme = 'street_dusk'; renderer.next = null; renderer.sceneT = 0;
  renderNode('start', false); toast('NOUVELLE PARTIE — 21:00');
}
function continueGame() {
  showScreen('game'); renderer.theme = (STORY_NODES[G.currentNode] || {}).theme || 'street_dusk'; renderer.next = null;
  renderNode(G.currentNode, false);
}

/* ---------- Menu / carnet ---------- */
let menuTab = 'items';
function openMenu(tab) {
  Audio32.sfx('open'); menuTab = tab || menuTab;
  showScreen('menu'); renderMenu();
}
function closeMenu() { Audio32.sfx('close'); showScreen(menuFrom); }
let menuFrom = 'game';
function renderMenu() {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('sel', t.dataset.tab === menuTab));
  const p = $('#panel'); p.innerHTML = ''; p.scrollTop = 0;
  const li = (html, cls = '') => { const d = document.createElement('div'); d.className = 'li ' + cls; d.innerHTML = html; p.append(d); return d; };
  if (menuTab === 'items') {
    if (!G.inventory.length) p.innerHTML = '<p class="muted">Ton sac à dos est vide. Fouille les décors !</p>';
    G.inventory.forEach((id) => { const it = ITEMS_DB[id]; if (!it) return; const d = li(`<div><b>${it.name}</b></div>`); d.prepend(iconCanvas(it.icon, 26)); });
  } else if (menuTab === 'clues') {
    const cl = G.clues.filter((c) => CLUES_DB[c]);
    if (!cl.length) p.innerHTML = '<p class="muted">Aucun indice pour l\'instant. Ouvre l\'œil !</p>';
    cl.forEach((c) => li(`<span class="tag">◆</span><div>${CLUES_DB[c]}</div>`));
  } else if (menuTab === 'endings') {
    ENDINGS.forEach((e) => { const ok = unlocked.includes(e.id), n = STORY_NODES[e.node]; li(`<span class="tag">${ok ? '★' : '?'}</span><div><b>${ok ? e.title : '? ? ? ? ?'}</b><small>${ok ? 'Débloquée' : 'Indice : ' + (n.endingHint || '')}</small></div>`, ok ? '' : 'lock'); });
  } else {
    const opt = (label, val, fn) => { const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = `<span>${label}</span><span>${val}</span>`; b.onclick = () => { fn(); store.set(SETTINGS_KEY, settings); applySettings(); Audio32.sfx('move'); renderMenu(); }; p.append(b); };
    opt('Effets sonores', settings.sound ? 'OUI' : 'NON', () => (settings.sound = !settings.sound));
    opt('Musique', settings.music ? 'OUI' : 'NON', () => (settings.music = !settings.music));
    opt('Filtre écran cathodique', settings.crt ? 'OUI' : 'NON', () => (settings.crt = !settings.crt));
    opt('Vitesse du texte', SPEEDS[settings.speed].n, () => (settings.speed = (settings.speed + 1) % SPEEDS.length));
    if (menuFrom === 'game') {
      const d = document.createElement('button'); d.className = 'danger'; d.textContent = '⚠ Recommencer l\'histoire à 21:00';
      d.onclick = () => { if (d.dataset.ok) { closeMenu(); newGame(); } else { d.dataset.ok = 1; d.textContent = 'Touche encore pour confirmer'; } };
      p.append(d);
      const t = document.createElement('button'); t.className = 'danger'; t.style.borderColor = '#86f4ff'; t.style.color = '#d8fbff'; t.style.background = 'rgba(0,60,90,.25)'; t.textContent = "Retour à l'écran titre";
      t.onclick = () => goTitle(); p.append(t);
    }
    if (IN_FRAME) {
      const q = document.createElement('button'); q.className = 'danger'; q.style.borderColor = '#ffae00'; q.style.color = '#ffe2a8'; q.style.background = 'rgba(90,50,0,.25)';
      q.textContent = menuFrom === 'game' ? '⏏ Quitter le jeu (partie sauvegardée)' : '⏏ Quitter le jeu';
      q.onclick = quitGame; p.append(q);
    }
  }
}
function applySettings() {
  Audio32.setSound(settings.sound); Audio32.setMusic(settings.music);
  document.getElementById('console').classList.toggle('crt-off', !settings.crt);
}

/* ---------- Écran titre ---------- */
let titleFocus = 0, titleReady = false;
function titleItems() { return [...document.querySelectorAll('#titleMenu .menu-item')]; }
function setTitleFocus(i, sound) {
  const items = titleItems().filter((b) => !b.disabled); if (!items.length) return;
  titleFocus = (i + items.length) % items.length;
  if (sound) Audio32.sfx('move');
  titleItems().forEach((b) => b.classList.toggle('focus', b === items[titleFocus]));
}
function goTitle() {
  showScreen('title'); Music.set('title');
  const hasSave = G.currentNode && (G.currentNode !== 'start' || G.stepCount > 1);
  titleItems()[0].disabled = !hasSave;
  if (titleReady) { $('#press').style.display = 'none'; $('#titleMenu').classList.add('on'); setTitleFocus(0); }
}
function pressStart() {
  if (titleReady) return; titleReady = true;
  Audio32.init(); applySettings(); Music.start(); Music.set('title'); Audio32.sfx('start');
  $('#press').style.display = 'none'; $('#titleMenu').classList.add('on'); setTitleFocus(0);
}
function titleAction(act) {
  Audio32.sfx('select');
  if (act === 'continue') continueGame();
  else if (act === 'new') newGame();
  else if (act === 'endings') { menuFrom = 'title'; openMenu('endings'); }
  else if (act === 'quit') quitGame();
}

/* ---------------------------------------------------------------------------
   10. DÉMARRAGE & CONTRÔLES
   --------------------------------------------------------------------------- */
function loop() {
  if (titleRenderer && titleRenderer.active) titleRenderer.frame();
  if (renderer && renderer.active) renderer.frame();
  if (screen === 'game' && portraitState.type) {
    portraitState.t++;
    const pc = $('#portrait').getContext('2d');
    drawPortrait(pc, portraitState.type, portraitState.t, portraitState.talking);
    quantize(pc, 40, 40);
  }
}
let last = 0;
function raf(ts) { if (ts - last >= 33) { last = ts; loop(); } requestAnimationFrame(raf); } // ~30 i/s, comme sur console

function boot() {
  // Dans Cartridge : entrée « Quitter » sur l'écran titre (invisible si le jeu est ouvert seul)
  if (IN_FRAME) {
    const qb = document.createElement('button'); qb.className = 'menu-item'; qb.dataset.act = 'quit';
    qb.textContent = 'Quitter le jeu'; qb.style.opacity = '.8';
    $('#titleMenu').append(qb);
  }
  buildSprites();
  G = Object.assign(fresh(), store.get(STORAGE_KEY, {}) || {});
  if (!STORY_NODES[G.currentNode]) G = fresh();
  ['inventory', 'clues', 'flags'].forEach((k) => { if (!Array.isArray(G[k])) G[k] = []; });
  if (typeof G.clock !== 'number') G.clock = toMin((STORY_NODES[G.currentNode] || {}).time);
  unlocked = store.get(ENDINGS_KEY, []) || [];
  settings = Object.assign(settings, store.get(SETTINGS_KEY, {}) || {});
  applySettings();
  // éléments d'interface en pixel art
  document.documentElement.style.setProperty('--hand', `url(${SPR.hand.toDataURL()})`);
  document.documentElement.style.setProperty('--tri', `url(${SPR.tri.toDataURL()})`);
  const hl = $('#headLeo').getContext('2d'); hl.drawImage(SPR.leo, 0, 0, 13, 9, 0, 0, 13, 9);
  const hm = $('#headMaia').getContext('2d'); hm.drawImage(SPR.maia, 0, 0, 13, 9, 0, 0, 13, 9);
  $('#memCard').getContext('2d').drawImage(SPR.mem, -1, -1);
  renderer = new Renderer($('#scene'), 'street_dusk'); renderer.active = false;
  titleRenderer = new Renderer($('#titleCanvas'), 'street_dusk');
  requestAnimationFrame(raf);
  cx({ type: 'cartridge:ready' });
  const toTitle = () => { if (screen !== 'boot') return; goTitle(); };
  setTimeout(toTitle, 2100);
  $('#boot').onclick = toTitle;

  $('#title').addEventListener('click', (e) => { if (!titleReady) pressStart(); });
  titleItems().forEach((b) => { b.onclick = (e) => { e.stopPropagation(); if (!b.disabled) titleAction(b.dataset.act); }; b.onmouseenter = () => { if (!b.disabled) { const items = titleItems().filter((x) => !x.disabled); setTitleFocus(items.indexOf(b), true); } }; });
  $('#btnMenu').onclick = () => { menuFrom = 'game'; openMenu(); };
  $('#menuClose').onclick = closeMenu;
  document.querySelectorAll('.tab').forEach((t) => (t.onclick = () => { menuTab = t.dataset.tab; Audio32.sfx('move'); renderMenu(); }));
  document.addEventListener('pointerdown', () => { Audio32.init(); if (titleReady) Music.start(); }, { once: false, passive: true });

  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (screen === 'boot') return toTitle();
    if (screen === 'title') {
      if (k === 'Escape' && IN_FRAME) { quitGame(); e.preventDefault(); return; }
      if (!titleReady) { if (k === 'Enter' || k === ' ') pressStart(); return; }
      if (k === 'ArrowDown') setTitleFocus(titleFocus + 1, true);
      else if (k === 'ArrowUp') setTitleFocus(titleFocus - 1, true);
      else if (k === 'Enter' || k === ' ') { const items = titleItems().filter((b) => !b.disabled); titleAction(items[titleFocus].dataset.act); }
      e.preventDefault(); return;
    }
    if (screen === 'menu') { if (k === 'Escape' || k === 'Backspace') closeMenu(); return; }
    if (screen === 'game') {
      if (k === 'Escape') { menuFrom = 'game'; openMenu(); return; }
      if (typing && (k === 'Enter' || k === ' ')) { $('#dialog').click(); e.preventDefault(); return; }
      if (k === 'ArrowDown') { setFocus(focusIdx + 1, true); choiceEls[focusIdx]?.scrollIntoView({ block: 'nearest' }); e.preventDefault(); }
      else if (k === 'ArrowUp') { setFocus(focusIdx - 1, true); choiceEls[focusIdx]?.scrollIntoView({ block: 'nearest' }); e.preventDefault(); }
      else if ((k === 'Enter' || k === ' ') && choiceEls[focusIdx]) { choiceEls[focusIdx].click(); e.preventDefault(); }
      else if (/^[1-4]$/.test(k) && choiceEls[+k - 1]) choiceEls[+k - 1].click();
    }
  });
}
window.addEventListener('DOMContentLoaded', boot);
</script>
